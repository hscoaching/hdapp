<style>
  :root{
    --bg:#0b0b0c; --surface:#16171a; --surface-2:#1f2024; --line:#2c2c30;
    --ink:#f5f5f5; --ink-muted:#9a9a9e; --accent:#ffffff; --accent-ink:#0b0b0c;
    --ok:#ffffff; --warn:#f5f5f5; --radius:14px; box-sizing:border-box; color-scheme:dark;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Cinzel',sans-serif; letter-spacing:.02em; line-height:.95;}
  a{color:inherit;} button{font-family:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding:0 20px;}
  header.top{position:sticky; top:0; z-index:20; background:rgba(11,11,12,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
  .top-inner{display:flex; align-items:center; gap:14px; padding:14px 20px; max-width:960px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; font-family:'Cinzel'; font-size:19px; color:var(--accent-ink);}
  .brand .b1{font-size:15px; font-weight:700;} .brand .b2{font-size:12px; color:var(--ink-muted);}
  main{padding:28px 0 80px;}
  main.wrap{padding:28px 20px 80px;}
  .center-msg{max-width:420px; margin:80px auto; text-align:center;}
  .center-msg p{color:var(--ink-muted); font-size:14px; margin-top:10px;}
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .tab{padding:12px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--ink); border-color:var(--accent);}
  .subtabs{display:flex; gap:8px; margin-bottom:16px;}
  .subtab{font-size:12.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:7px 14px; border-radius:999px; cursor:pointer;}
  .subtab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:999px; border:none; cursor:pointer;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}
  .reps-mode-btn.active{border-color:var(--accent); color:var(--accent); background:var(--surface);}
  .pick-ex-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; max-height:340px; overflow-y:auto; padding:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:8px 0 12px;}
  .pick-ex-card{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:6px; cursor:pointer; text-align:center; font-family:inherit; font-size:11px; color:var(--ink);}
  .pick-ex-card .pick-ex-img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; background:var(--surface);}
  .pick-ex-card .pick-ex-noimg{width:100%; aspect-ratio:1/1; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); font-size:9px; text-transform:uppercase; letter-spacing:.05em; padding:4px;}
  .pick-ex-card span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2;}
  .pick-ex-card.selected{border-color:var(--accent); background:var(--surface);}
  .ex-edit{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .ex-edit label{display:flex; flex-direction:column; gap:2px; font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
  .ex-edit input{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 8px; font-family:inherit; font-size:13px; width:74px; text-transform:none; letter-spacing:0;}
  .ex-edit label.ex-edit-name{flex-basis:100%;}
  .ex-edit label.ex-edit-name input{width:100%;}
  .ex-edit label:nth-child(3) input{width:118px;}
  #pfChips,#pfSubchips{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
  #pfChips .fchip,#pfSubchips .fchip{flex:none;}
  .ex-mini.in-ss{border-left:3px solid var(--accent); padding-left:10px;}
  .ex-mini button.on{border-color:var(--accent); color:var(--accent);}
  .ex-mini button:disabled{opacity:.35; cursor:default;}
  .ss-chip{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; padding:2px 7px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); vertical-align:middle;}
  .draft-var{font-size:12px; color:var(--ink-muted); margin-top:3px;}
  .rm-var{background:none !important; border:none !important; color:var(--ink-muted); cursor:pointer; font-size:12px; padding:0 4px; width:auto !important; height:auto !important;}
  .day-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 8px;}
  .day-chip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .day-chip.active{background:var(--surface-2); border-color:var(--accent); color:var(--accent);}
  .day-chip.add{border-style:dashed;}
  .pf-field{display:flex; flex-direction:column; gap:3px;}
  .pf-field label{font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
  .btn-danger{background:none; border:1px dashed var(--ink-muted); color:var(--ink);}
  .clients-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; align-items:start;}
  button.subtab{background:transparent; font-family:inherit;}
  button.subtab.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .row-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:16px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center;}
  .stat-num{font-family:'Cinzel'; font-size:28px; color:var(--accent); line-height:1;}
  .stat-label{font-size:11px; color:var(--ink-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.03em; line-height:1.3;}
  @media (max-width:480px){ .stats-row{grid-template-columns:repeat(2,1fr);} .stat-tile{padding:10px 4px;} .stat-num{font-size:22px;} .stat-label{font-size:10px;} }
  .set-rows{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .set-row{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:13.5px; border-bottom:1px solid var(--line);}
  .set-row:last-child{border-bottom:none;}
  .set-row-num{color:var(--ink-muted);}
  .set-row-val{font-weight:600;}
  .origin-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .origin-pill{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2);}
  .origin-pill.coach{color:#7ee0a0; border-color:rgba(126,224,160,.4); background:rgba(126,224,160,.1);}
  .origin-pill.client{color:#8ab4ff; border-color:rgba(138,180,255,.4); background:rgba(138,180,255,.1);}
  .origin-pill.visitor{color:#ffb86b; border-color:rgba(255,184,107,.4); background:rgba(255,184,107,.1);}
  .origin-pill.official{color:var(--ink); }
  .origin-pill.unknown{color:var(--ink-muted); border-style:dashed;}
  .origin-for{font-size:12.5px; color:var(--ink-muted);}
  .fchips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .fchip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .fchip span{opacity:.7; margin-left:3px;}
  .fchip.active{background:var(--accent); color:var(--accent-ink,#0b0b0c); border-color:var(--accent);}
  .ex-card{display:flex; gap:12px; align-items:center;}
  .ex-thumb{flex:none; width:84px; height:84px; border-radius:10px; overflow:hidden; background:var(--surface-2); display:flex; align-items:center; justify-content:center;}
  .ex-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .ex-thumb-empty{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); text-align:center; padding:4px;}
  .ex-card-text{min-width:0; flex:1;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px; cursor:pointer;}
  .card:hover{border-color:var(--accent);}
  .card .tag{font-size:10.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.07em;}
  .card h3{font-family:'Inter'; font-weight:700; font-size:15px; margin-top:3px; letter-spacing:0; color:var(--ink);}
  .card p{color:var(--ink-muted); font-size:12.5px; margin-top:4px;}
  .badge{display:inline-block; background:var(--accent); color:var(--accent-ink); font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px; margin-left:8px;}
  .empty{color:var(--ink-muted); font-size:13.5px; padding:16px 0;}
  .field{margin-top:12px;}
  .field label{font-size:12px; color:var(--ink-muted); display:block; margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 12px; font-size:13.5px; font-family:inherit;}
  .field textarea{min-height:70px; resize:vertical;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px;}
  .backlink{font-size:13px; color:var(--ink-muted); display:inline-block; margin-bottom:14px; cursor:pointer;}
  .backlink:hover{color:var(--accent);}
  .chat-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; height:420px; display:flex; flex-direction:column;}
  .chat-msgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:75%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.4;}
  .msg.coach{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
  .msg.user{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px;}
  .chat-input{display:flex; border-top:1px solid var(--line); padding:10px;}
  .chat-input input{flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:14px; padding:8px; font-family:inherit;}
  .chat-input button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer;}
  .ex-mini{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:13px; gap:10px;}
  .ex-mini > span:first-child{flex:1;}
  .ex-mini > span:last-child{display:flex; gap:8px;}
  .ex-mini button{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink-muted); cursor:pointer; font-size:15px; width:36px; height:36px; flex:none;}
  .visits-section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin:16px 0 4px; display:flex; align-items:center; gap:7px;}
  .visits-toggle{cursor:pointer;}
  .visits-count{background:var(--surface-2); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--ink); font-weight:700;}
  .visit-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line);}
  .visit-avatar{flex:none; width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .visit-avatar-anon{background:var(--surface-2); color:var(--ink-muted);}
  .visit-info{flex:1; min-width:0;}
  .visit-name{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .visit-sub{font-size:11.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .visit-badge{background:var(--surface-2); border-radius:999px; padding:1px 7px; font-size:9.5px; color:var(--accent); font-weight:700; text-transform:uppercase;}
  .visit-when{flex:none; font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .visit-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .picker{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .picker select, .picker input{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:9px; font-family:inherit; font-size:13px;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line); padding:12px 20px; border-radius:999px; font-size:13.5px; z-index:80; display:none;}
  .install-banner{position:fixed; left:12px; right:12px; bottom:12px; z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .install-banner.show{display:flex;}
  .install-banner p{flex:1; font-size:13px; color:var(--ink); margin:0; line-height:1.4;}
  .install-banner .btn-row{display:flex; gap:8px; flex:none; align-items:center;}
  .qr-overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center;}
  .qr-overlay.open{display:flex;}
  .qr-sheet{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center; max-width:320px;}
  .qr-sheet .box{background:#fff; padding:12px; border-radius:10px; display:inline-block; margin:16px 0;}
  .ex-overlay{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:16px;}
  .ex-overlay.open{display:flex;}
  .ex-modal{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto;}
  .ex-modal h3{font-family:Inter; font-weight:700; font-size:16px; margin-bottom:14px;}
  @media print{
    body *{visibility:hidden;}
    #printAreaAdmin, #printAreaAdmin *{visibility:visible;}
    #printAreaAdmin{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#fff;}
    #printAreaAdmin .box{background:#fff;}
    #printAreaAdmin h3{font-family:'Cinzel'; font-size:34px; color:#000;}
    #printClientArea, #printClientArea *{visibility:visible;}
    #printClientArea{display:block; position:fixed; inset:0; background:#fff; padding:40px; overflow:visible;}
    #printClientArea h1{font-family:'Cinzel',sans-serif; font-size:32px; color:#000; margin:0 0 2px;}
    #printClientArea .pmeta{color:#777; font-size:12px; margin-bottom:22px; text-transform:uppercase; letter-spacing:.5px;}
    #printClientArea h2{font-family:Inter; font-size:16px; color:#000; margin:22px 0 10px; border-bottom:1px solid #ccc; padding-bottom:6px;}
    #printClientArea .pex{border-top:1px solid #eee; padding:8px 0; color:#000; font-size:13px; display:flex; justify-content:space-between;}
    #printClientArea .sess-row{border-top:1px solid #eee; padding:8px 0; color:#000; font-size:13px; display:flex; justify-content:space-between;}
    #printClientArea .empty-print{color:#777; font-size:13px; font-style:italic;}
  }
  .navrow{display:flex; gap:8px; max-width:960px; margin:0 auto; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:1; text-align:center; font-size:13.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:10px 14px; border-radius:999px; white-space:nowrap; text-decoration:none;}
  .navrow a.active{background:var(--ink); border-color:var(--ink); color:var(--bg);}

  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
    .picker{ flex-direction:column; align-items:stretch; }
    .picker select, .picker input{ width:100% !important; }
  }
</style>

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getSession(){ try{ return JSON.parse(localStorage.getItem('hs_session')||'null'); }catch(e){ return null; } }
let _refP=null;
function refreshIfNeeded(force){
  if(_refP) return _refP;
  const s = getSession();
  if(!s || !s.refresh_token) return Promise.resolve();
  const exp = (s.expires_at || 0) * 1000;
  if(!force && exp && Date.now() < exp - 60000) return Promise.resolve();
  _refP = (async()=>{
    try{
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      const data = await res.json();
      if(res.ok && data.access_token) localStorage.setItem('hs_session', JSON.stringify(data));
      else if(res.status===400 || res.status===401) localStorage.removeItem('hs_session');
    }catch(e){}
    finally{ setTimeout(()=>{ _refP=null; },0); }
  })();
  return _refP;
}
async function api(path, opts={}, _retry){
  await refreshIfNeeded();
  const s = getSession();
  let res;
  try{
    res = await fetch(`${SUPABASE_URL}${path}`, { cache:'no-store', ...opts, headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s?.access_token}`, 'Content-Type':'application/json', ...(opts.headers||{}) } });
  }catch(e){ const er = new Error('network_error'); er.detail = String(e&&e.message||e); throw er; }
  if(res.status===401 && !_retry && s && s.refresh_token){ await refreshIfNeeded(true); return api(path, opts, true); }
  if(!res.ok){ const t = await res.text(); console.error(t); const er = new Error('api_error'); er.detail = t; er.status = res.status; throw er; }
  const text = await res.text();
  try{ return text ? JSON.parse(text) : null; }catch(e){ return null; }
}

async function renderCoachStats(){
  const el = document.getElementById('coachStats');
  if(!el) return;
  try{
    const now = new Date();
    const day = (now.getDay()+6)%7; // lundi=0
    const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
    const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
    const [weekSessions, allClients, recentSessions, unread, visits] = await Promise.all([
      api(`/rest/v1/sessions?select=id&imported=is.false&started_at=gte.${monday.toISOString()}`),
      api('/rest/v1/profiles?select=id,coach_id&role=eq.client'),
      api(`/rest/v1/sessions?select=user_id&imported=is.false&started_at=gte.${weekAgo.toISOString()}`),
      api('/rest/v1/messages?select=conversation_id&sender=eq.user&read=eq.false'),
      IS_SUPER ? api('/rest/v1/app_visits?select=user_id') : Promise.resolve([])
    ]);
    let unreadN = unread.length;
    if(IS_SUPER){
      try{
        const cv = await api('/rest/v1/conversations?select=id,user_id');
        const ownClient = new Set(allClients.filter(c => !c.coach_id).map(c => c.id));
        const ownConv = new Set(cv.filter(c => ownClient.has(c.user_id) || !allClients.some(k => k.id === c.user_id)).map(c => c.id));
        unreadN = unread.filter(m => ownConv.has(m.conversation_id)).length;
      }catch(e){}
    }
    const clientIds = new Set(allClients.map(c=>c.id));
    const activeClients = new Set(recentSessions.map(s=>s.user_id).filter(id=>id && clientIds.has(id))).size;
    // Un compte utilisé sur plusieurs appareils ne compte qu'une fois
    const withAccount = new Set(visits.filter(v=>v.user_id).map(v=>v.user_id)).size;
    const anonymous = visits.filter(v=>!v.user_id).length;
    const totalVisitors = withAccount + anonymous;
    if(!document.getElementById('coachStats')) return; // l'utilisateur a changé de page pendant le chargement
    el.innerHTML = `
      <div class="stat-tile"><div class="stat-num">${weekSessions.length}</div><div class="stat-label">Séances cette semaine</div></div>
      <div class="stat-tile"><div class="stat-num">${activeClients}/${allClients.length}</div><div class="stat-label">Clients ayant fait une séance (7 derniers jours)</div></div>
      <div class="stat-tile"><div class="stat-num">${unreadN}</div><div class="stat-label">Messages non lus</div></div>
      ${!IS_SUPER ? '' : `<div class="stat-tile" style="cursor:pointer;" onclick="openVisitsModal()"><div class="stat-num">${totalVisitors}</div><div class="stat-label">Visiteurs de l'appli (${withAccount} comptes, ${anonymous} invités)</div></div>`}
    `;
  }catch(e){
    console.error(e);
    if(el) el.innerHTML = '<div class="empty">Statistiques indisponibles.</div>';
  }
}
let visitsAccounts = [];
let visitsAnon = [];
async function openVisitsModal(){
  document.getElementById('visitsOverlay').classList.add('open');
  const body = document.getElementById('visitsBody');
  body.innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const visits = await api('/rest/v1/app_visits?select=user_id,first_seen,last_seen&order=last_seen.desc');
    const userIds = [...new Set(visits.map(v=>v.user_id).filter(Boolean))];
    let profilesById = {};
    if(userIds.length){
      const profs = await api(`/rest/v1/profiles?select=id,full_name,email,role&id=in.(${userIds.join(',')})`);
      profilesById = Object.fromEntries(profs.map(p=>[p.id,p]));
    }
    // Un même compte peut avoir visité depuis plusieurs appareils (téléphone, ordi, navigation privée...),
    // ce qui crée une ligne par appareil : on les fusionne ici pour n'afficher le compte qu'une fois.
    const grouped = {};
    visits.filter(v=>v.user_id).forEach(v=>{
      const g = grouped[v.user_id] || (grouped[v.user_id] = { user_id: v.user_id, first_seen: v.first_seen, last_seen: v.last_seen, devices: 0 });
      g.devices++;
      if(new Date(v.first_seen) < new Date(g.first_seen)) g.first_seen = v.first_seen;
      if(new Date(v.last_seen) > new Date(g.last_seen)) g.last_seen = v.last_seen;
    });
    visitsAccounts = Object.values(grouped)
      .map(g=>({ visit:g, profile: profilesById[g.user_id] || {} }))
      .sort((a,b)=> new Date(b.visit.last_seen) - new Date(a.visit.last_seen));
    visitsAnon = visits.filter(v=>!v.user_id);
    body.innerHTML = `
      <div class="field" style="margin-bottom:8px;"><input id="visitsSearch" type="text" placeholder="Chercher un nom ou email…" oninput="renderVisitsList()"></div>
      <div class="visits-section-title">Comptes <span class="visits-count">${visitsAccounts.length}</span></div>
      <div id="visitsAccountsList"></div>
      <div class="visits-section-title visits-toggle" onclick="toggleAnonVisits()">Invités anonymes <span class="visits-count">${visitsAnon.length}</span> <span id="anonToggleIcon">▸</span></div>
      <div id="visitsAnonList" style="display:none;"></div>
    `;
    renderVisitsList();
  }catch(e){
    console.error(e);
    body.innerHTML = '<div class="empty">Impossible de charger les visites.</div>';
  }
}
function renderVisitsList(){
  const qEl = document.getElementById('visitsSearch');
  const q = qEl ? qEl.value.trim().fold() : '';
  const matches = !q ? visitsAccounts : visitsAccounts.filter(a=>
    (a.profile.full_name||'').fold().includes(q) || (a.profile.email||'').fold().includes(q)
  );
  const listEl = document.getElementById('visitsAccountsList');
  listEl.innerHTML = matches.length ? matches.map(a=> accountRowHtml(a.visit, a.profile)).join('') : '<div class="empty">Aucun compte ne correspond.</div>';
  const anonEl = document.getElementById('visitsAnonList');
  if(anonEl && anonEl.dataset.loaded !== '1'){
    anonEl.innerHTML = visitsAnon.length ? visitsAnon.map(anonRowHtml).join('') : '<div class="empty">Aucun invité anonyme.</div>';
    anonEl.dataset.loaded = '1';
  }
}
function toggleAnonVisits(){
  const el = document.getElementById('visitsAnonList');
  const icon = document.getElementById('anonToggleIcon');
  const show = el.style.display === 'none';
  el.style.display = show ? 'block' : 'none';
  icon.textContent = show ? '▾' : '▸';
}
function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return "à l'instant";
  if(min < 60) return `il y a ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `il y a ${h} h`;
  const days = Math.floor(h/24);
  if(days === 1) return 'hier';
  if(days < 7) return `il y a ${days} j`;
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase() || '?';
}
function accountRowHtml(v, p){
  const name = p.full_name || p.email || 'Compte';
  const ageMs = Date.now() - new Date(v.last_seen).getTime();
  const dotColor = ageMs < 24*3600*1000 ? '#4caf7d' : (ageMs < 7*24*3600*1000 ? '#e0a94c' : 'var(--ink-muted)');
  return `<div class="visit-row">
    <div class="visit-avatar">${escapeHtml(initials(name))}</div>
    <div class="visit-info">
      <div class="visit-name">${escapeHtml(name)}${p.role==='admin' ? ' <span class="visit-badge">coach</span>' : ''}</div>
      <div class="visit-sub">${escapeHtml(p.email||'')}${v.devices>1?` · ${v.devices} appareils`:''}</div>
    </div>
    <div class="visit-when"><span class="visit-dot" style="background:${dotColor};"></span>${timeAgo(v.last_seen)}</div>
  </div>`;
}
function anonRowHtml(v){
  const first = new Date(v.first_seen).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
  return `<div class="visit-row">
    <div class="visit-avatar visit-avatar-anon">?</div>
    <div class="visit-info">
      <div class="visit-name">Invité anonyme</div>
      <div class="visit-sub">Première visite : ${first}</div>
    </div>
    <div class="visit-when">${timeAgo(v.last_seen)}</div>
  </div>`;
}

const CH_KIND = { hold: 'Tenir le plus longtemps', reps: 'Max de reps en temps limité' };
function chFmt(c, v){ if(v == null) return '—'; if(c.kind === 'hold'){ const m = Math.floor(v/60), s = v%60; return m + ':' + String(s).padStart(2,'0'); } return v + ' reps'; }
function chStatus(c){ const n = Date.now(); return n < new Date(c.starts_at) ? 'à venir' : (n > new Date(c.ends_at) ? 'terminé' : 'en cours'); }
function toLocalInput(d){ const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,16); }
async function renderChallengesAdmin(){
  const tb = document.getElementById('tabBody');
  tb.innerHTML = '<div class="empty">Chargement…</div>';
  let chs, parts;
  try{
    chs = await api('/rest/v1/challenges?select=*&order=starts_at.desc');
    parts = await api('/rest/v1/challenge_participants?select=challenge_id').catch(() => []);
  }catch(e){ console.error(e); tb.innerHTML = '<div class="empty">Impossible de charger les challenges. Réessaie.</div>'; return; }
  const n = id => parts.filter(p => p.challenge_id === id).length;
  tb.innerHTML = `${IS_SUPER ? '<div class="row-actions" style="margin-bottom:14px"><button class="btn btn-accent" onclick="openChallengeForm()">+ Nouveau challenge</button></div>' : ''}
    <div id="chForm"></div>
    ${chs.length ? chs.map(c => `<div class="card" style="cursor:default">
      <div class="tag">${chStatus(c)}${c.is_published ? '' : ' · masqué'}</div>
      <h3>${escapeHtml(c.badge_icon)} ${escapeHtml(c.title)}</h3>
      <p>${escapeHtml(c.exercise_name)} · ${CH_KIND[c.kind]}${c.kind === 'reps' ? ' (' + Math.floor(c.time_limit_seconds/60) + ' min ' + (c.time_limit_seconds%60) + ' s)' : ''}</p>
      <p>${new Date(c.starts_at).toLocaleDateString('fr-FR')} → ${new Date(c.ends_at).toLocaleDateString('fr-FR')} · ${n(c.id)} participant${n(c.id) > 1 ? 's' : ''}</p>
      ${c.reward_text ? `<p>🎁 ${escapeHtml(c.reward_text)}</p>` : ''}
      ${c.winner_announced_at ? `<p>🏆 Vainqueur annoncé le ${new Date(c.winner_announced_at).toLocaleDateString('fr-FR')} · ${c.videos_purged_at ? 'vidéos supprimées' : 'vidéos supprimées le ' + new Date(new Date(c.winner_announced_at).getTime() + 7*864e5).toLocaleDateString('fr-FR')}</p>` : ''}
      <div class="row-actions" style="margin-top:10px">
        <button class="btn btn-ghost btn-sm" onclick="openChallengeResults('${c.id}')">📊 Résultats</button>
        ${IS_SUPER && chStatus(c) !== 'terminé' ? `<button class="btn btn-ghost btn-sm" onclick="setDemoVideo('${c.id}')">🎬 ${c.demo_video_path ? 'Changer la vidéo démo' : 'Ajouter une vidéo démo'}</button>` : ''}
        ${IS_SUPER && chStatus(c) === 'terminé' && !c.winner_announced_at ? `<button class="btn btn-accent btn-sm" onclick="announceWinner('${c.id}')">🏆 Annoncer le vainqueur</button>` : ''}
        ${IS_SUPER && chStatus(c) === 'en cours' ? `<button class="btn btn-ghost btn-sm" onclick="endChallengeNow('${c.id}')">⏹ Terminer maintenant</button>` : ''}
        ${IS_SUPER ? `<button class="btn btn-ghost btn-sm" onclick="toggleChallenge('${c.id}', ${c.is_published ? 'false' : 'true'})">${c.is_published ? 'Masquer' : 'Publier'}</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteChallenge('${c.id}')">🗑 Supprimer</button>` : ''}
      </div></div>`).join('') : `<div class="empty">Aucun challenge. ${IS_SUPER ? 'Crée le premier : un exercice à tenir ou un maximum de reps en temps limité.' : 'Le grand admin peut en créer un.'}</div>`}`;
}
function openChallengeForm(){
  const now = new Date(), end = new Date(now.getTime() + 7*864e5);
  const inp = 'width:100%;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:11px;font:inherit;font-size:16px';
  const lab = t => `<label style="display:block;margin:12px 0 4px;font-size:13px;opacity:.8">${t}</label>`;
  document.getElementById('chForm').innerHTML = `<div class="card" style="cursor:default;margin-bottom:16px">
    <h3>Nouveau challenge</h3>
    ${lab('Titre')}<input id="chTitle" style="${inp}" placeholder="Ex. Défi gainage d'octobre">
    ${lab('Type')}<select id="chKind" style="${inp}" onchange="document.getElementById('chLimitBox').style.display = this.value === 'reps' ? 'block' : 'none'"><option value="hold">Tenir le plus longtemps (gainage, suspension…)</option><option value="reps">Maximum de répétitions en temps limité</option></select>
    ${lab('Exercice')}<input id="chEx" style="${inp}" placeholder="Ex. Gainage planche, Pompes, Tractions">
    <div id="chLimitBox" style="display:none">${lab('Durée de l\'essai (minutes et secondes)')}<div style="display:flex;gap:10px"><input id="chMin" type="number" min="0" max="60" value="2" style="${inp}"><input id="chSec" type="number" min="0" max="59" value="0" style="${inp}"></div></div>
    ${lab('Description / règles')}<textarea id="chDesc" style="${inp};min-height:90px" placeholder="Comment tenir ou faire l'exercice, ce qui est valide…"></textarea>
    ${lab('Début')}<input id="chStart" type="datetime-local" style="${inp}" value="${toLocalInput(now)}">
    ${lab('Fin')}<input id="chEnd" type="datetime-local" style="${inp}" value="${toLocalInput(end)}">
    ${lab('Récompense en plus du badge (facultatif)')}<input id="chReward" style="${inp}" placeholder="Ex. 1 mois de coaching offert au 1er">
    ${lab('Icône du badge (un emoji)')}<input id="chIcon" style="${inp}" value="🏆" maxlength="4">
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-accent" style="flex:1;justify-content:center" onclick="saveChallenge()">Publier le challenge</button><button class="btn btn-ghost" onclick="document.getElementById('chForm').innerHTML=''">Annuler</button></div></div>`;
  document.getElementById('chForm').scrollIntoView({ behavior:'smooth' });
}
async function saveChallenge(){
  const v = id => document.getElementById(id).value.trim();
  const kind = v('chKind');
  const row = { title: v('chTitle'), kind, exercise_name: v('chEx'), description: v('chDesc') || null,
    starts_at: new Date(v('chStart')).toISOString(), ends_at: new Date(v('chEnd')).toISOString(),
    reward_text: v('chReward') || null, badge_icon: v('chIcon') || '🏆', is_published: true };
  if(kind === 'reps') row.time_limit_seconds = (parseInt(v('chMin')) || 0) * 60 + (parseInt(v('chSec')) || 0);
  if(!row.title || !row.exercise_name){ toast('Titre et exercice requis'); return; }
  if(!(new Date(row.ends_at) > new Date(row.starts_at))){ toast('La fin doit être après le début'); return; }
  if(kind === 'reps' && !(row.time_limit_seconds >= 10)){ toast('Durée minimale : 10 secondes'); return; }
  try{ await api('/rest/v1/challenges', { method:'POST', headers:{ Prefer:'return=minimal' }, body: JSON.stringify(row) }); toast('Challenge publié 🎉'); renderChallengesAdmin(); }
  catch(e){ toast('Erreur : ' + String((e && e.detail) || e).slice(0, 100)); }
}
function setDemoVideo(id){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*'; inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    if(f.size > 50*1024*1024){ toast('Vidéo trop lourde (50 Mo max)'); return; }
    const ext = (f.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0,5) || 'mp4';
    const path = id + '/demo-' + Date.now() + '.' + ext;
    toast('Envoi en cours…');
    try{
      await refreshIfNeeded(); const s = getSession();
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/challenge-demos/${path}`, { method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s?.access_token}`, 'Content-Type': f.type || 'video/mp4' }, body: f });
      if(!res.ok) throw new Error('upload');
      await api(`/rest/v1/challenges?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ demo_video_path: path }) });
      toast('Vidéo démo ajoutée 🎬'); renderChallengesAdmin();
    }catch(e){ console.error(e); toast('Envoi impossible, réessaie'); }
  };
  inp.click();
}
async function announceWinner(id){
  if(!confirm('Annoncer le vainqueur ? Les médailles et badges deviennent définitifs, et les vidéos seront supprimées automatiquement dans 7 jours. Pense à valider d\'abord tous les essais en attente.')) return;
  try{ await api('/rest/v1/rpc/challenge_announce', { method:'POST', body: JSON.stringify({ p_id: id }) }); toast('Vainqueur annoncé 🏆'); renderChallengesAdmin(); }catch(e){ toast('Erreur, réessaie'); }
}
async function endChallengeNow(id){
  if(!confirm('Terminer ce challenge maintenant ? Le classement sera figé.')) return;
  try{ await api(`/rest/v1/challenges?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ ends_at: new Date().toISOString() }) }); toast('Challenge terminé'); renderChallengesAdmin(); }catch(e){ toast('Erreur, réessaie'); }
}
async function toggleChallenge(id, pub){
  try{ await api(`/rest/v1/challenges?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ is_published: pub }) }); renderChallengesAdmin(); }catch(e){ toast('Erreur, réessaie'); }
}
async function deleteChallenge(id){
  if(!confirm('Supprimer ce challenge, ses participants et tous les résultats ? (les badges liés disparaissent)')) return;
  try{ await api(`/rest/v1/challenges?id=eq.${id}`, { method:'DELETE' }); toast('Challenge supprimé'); renderChallengesAdmin(); }catch(e){ toast('Erreur, réessaie'); }
}
async function openChallengeResults(id){
  const tb = document.getElementById('tabBody');
  tb.innerHTML = '<a class="backlink" onclick="renderChallengesAdmin()">← Challenges</a><div class="empty">Chargement…</div>';
  let c, atts;
  try{
    c = (await api(`/rest/v1/challenges?select=*&id=eq.${id}`))[0];
    atts = await api('/rest/v1/rpc/challenge_attempts_admin', { method:'POST', body: JSON.stringify({ p_id: id }) });
  }catch(e){ console.error(e); tb.innerHTML = '<a class="backlink" onclick="renderChallengesAdmin()">← Challenges</a><div class="empty">Impossible de charger les résultats.</div>'; return; }
  window._chAtts = atts; window._chCur = c;
  const best = {}, names = {};
  atts.forEach(a => { names[a.user_id] = a.name; if(!a.removed && a.status === 'validated' && a.value > 0 && (!best[a.user_id] || a.value > best[a.user_id])) best[a.user_id] = a.value; });
  const ranking = Object.entries(best).sort((a,b) => b[1] - a[1]);
  const pending = atts.filter(a => a.status === 'pending' && !a.removed && a.value > 0);
  const stLab = { pending:'⏳ À valider', validated:'✅ Validé', rejected:'❌ Refusé' };
  const row = a => `<div style="padding:10px 2px;border-bottom:1px solid var(--line);${a.removed ? 'opacity:.45;text-decoration:line-through' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="min-width:0">${escapeHtml(a.name)} <span style="opacity:.6;font-size:12px">${new Date(a.started_at).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</span></span><b>${chFmt(c, a.value)}</b></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px"><span style="font-size:12.5px;opacity:.85">${stLab[a.status]}${a.video_path ? ' · 🎥 vidéo' : ' · sans vidéo'}</span>
        ${a.video_path ? `<button class="btn btn-ghost btn-sm" onclick="watchChallengeVideo('${a.id}')">▶ Voir la vidéo</button>` : ''}
        ${a.status !== 'validated' ? `<button class="btn btn-accent btn-sm" onclick="reviewAttempt('${a.id}','validated')">✅ Valider</button>` : ''}
        ${a.status !== 'rejected' ? `<button class="btn btn-ghost btn-sm" onclick="reviewAttempt('${a.id}','rejected')">❌ Refuser</button>` : ''}
        ${IS_SUPER ? `<button class="btn btn-ghost btn-sm" onclick="removeAttempt('${a.id}', ${a.removed ? 'false' : 'true'}, '${id}')">${a.removed ? 'Rétablir' : 'Retirer'}</button>` : ''}</div>
      ${a.review_note ? `<div style="font-size:12px;opacity:.7;margin-top:4px">Note : ${escapeHtml(a.review_note)}</div>` : ''}</div>`;
  tb.innerHTML = `<a class="backlink" onclick="renderChallengesAdmin()">← Challenges</a>
    <h3 style="font-family:Inter;font-weight:700;font-size:18px;margin:6px 0">${escapeHtml(c.badge_icon)} ${escapeHtml(c.title)} · résultats</h3>
    <div style="font-size:13px;opacity:.7;margin-bottom:10px">${escapeHtml(c.exercise_name)} · ${CH_KIND[c.kind]}</div>
    <div style="font-weight:700;margin:14px 0 6px">À valider (${pending.length})</div>
    ${pending.length ? pending.map(row).join('') : '<div class="empty">Rien en attente.</div>'}
    <div style="font-weight:700;margin:20px 0 6px">Classement (essais validés)</div>
    ${ranking.length ? ranking.map(([uid, v], i) => `<div style="display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line)"><span>${i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1) + '.'} ${escapeHtml(names[uid])}</span><b>${chFmt(c, v)}</b></div>`).join('') : '<div class="empty">Aucun résultat validé pour le moment.</div>'}
    <div style="font-weight:700;margin:20px 0 6px">Tous les essais</div>
    ${atts.filter(a => !pending.includes(a)).map(row).join('') || '<div class="empty">Aucun essai.</div>'}`;
}
async function reviewAttempt(attId, status){
  const a = (window._chAtts || []).find(x => x.id === attId); if(!a) return;
  let note = null, value = null;
  if(status === 'rejected'){ note = prompt('Motif du refus (visible par le client) :', 'Vidéo non conforme'); if(note === null) return; }
  else{
    const c = window._chCur;
    const v = prompt('Valider ' + a.name + ' avec le résultat suivant (' + (c.kind === 'hold' ? 'en secondes' : 'en répétitions') + '). Corrige-le si la vidéo montre autre chose :', a.value);
    if(v === null) return; value = parseInt(v); if(!(value >= 0)){ toast('Valeur invalide'); return; }
  }
  try{
    await api('/rest/v1/rpc/challenge_review', { method:'POST', body: JSON.stringify({ p_attempt: attId, p_status: status, p_note: note, p_value: value }) });
    toast(status === 'validated' ? 'Essai validé ✅' : 'Essai refusé'); openChallengeResults(window._chCur.id); refreshChPending();
  }catch(e){ toast('Erreur, réessaie'); }
}
async function watchChallengeVideo(attId){
  const a = (window._chAtts || []).find(x => x.id === attId); if(!a || !a.video_path) return;
  try{
    const r = await api('/storage/v1/object/sign/challenge-videos/' + a.video_path, { method:'POST', body: JSON.stringify({ expiresIn: 900 }) });
    const url = SUPABASE_URL + '/storage/v1' + r.signedURL;
    const ov = document.createElement('div'); ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px';
    ov.innerHTML = `<div style="color:#fff;font-weight:700">${escapeHtml(a.name)} · ${chFmt(window._chCur, a.value)}</div><video src="${url}" controls playsinline autoplay style="max-width:100%;max-height:70vh;border-radius:12px"></video><button class="btn btn-ghost">Fermer</button>`;
    ov.querySelector('button').onclick = () => ov.remove(); document.body.appendChild(ov);
  }catch(e){ console.error(e); toast('Vidéo introuvable'); }
}
async function refreshChPending(){
  try{ const n = await api('/rest/v1/rpc/challenges_pending_count', { method:'POST', body:'{}' }); const el = document.getElementById('chPend'); if(el) el.textContent = n > 0 ? ' (' + n + ')' : ''; }catch(e){}
}
async function removeAttempt(attId, removed, chId){
  try{ await api(`/rest/v1/challenge_attempts?id=eq.${attId}`, { method:'PATCH', body: JSON.stringify({ removed }) }); openChallengeResults(chId); }catch(e){ toast('Erreur, réessaie'); }
}

// ================= CLIENTS =================
let clientRows = [];
let pendingEditReqs = [];
function renderEditRequests(){
  const box = document.getElementById('editReqBox'); if(!box) return;
  if(!pendingEditReqs.length){ box.innerHTML = ''; return; }
  const nameOf = id => { const r = clientRows.find(x => x.client.id === id); return r ? (r.client.full_name || r.client.email) : 'Client'; };
  box.innerHTML = `<div class="card" style="border-color:var(--accent); margin-bottom:16px;">
    <h3 style="font-family:Inter; font-weight:700; font-size:16px; margin:0 0 4px;">✏️ ${pendingEditReqs.length} demande${pendingEditReqs.length>1?'s':''} de modification</h3>
    <p class="empty" style="padding:0 0 8px; text-align:left;">Si tu approuves, le client peut corriger les séries de cette séance puis la verrouiller de nouveau.</p>
    ${pendingEditReqs.map(r => {
      const s = r.sessions || {};
      const d = s.started_at ? new Date(s.started_at).toLocaleDateString('fr-FR',{day:'numeric', month:'long', year:'numeric'}) : '';
      const t = (s.programs && s.programs.name ? s.programs.name : 'Séance libre') + (s.day_label ? ' · ' + s.day_label : '');
      return `<div style="border-top:1px solid var(--line); padding:12px 0;">
        <div style="font-weight:700;">${escapeHtml(nameOf(r.user_id))} <span style="font-weight:500; color:var(--ink-muted);">· ${escapeHtml(d)} · ${escapeHtml(t)}</span></div>
        <div style="font-size:13.5px; margin:6px 0 10px; white-space:pre-wrap;">« ${escapeHtml(r.message)} »</div>
        <div class="row-actions" style="gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="openClientSessions('${r.user_id}',${jq(nameOf(r.user_id))})">📅 Voir la séance</button>
          <button class="btn btn-accent btn-sm" onclick="decideEditRequest('${r.id}', true)">Approuver</button>
          <button class="btn btn-ghost btn-sm" onclick="decideEditRequest('${r.id}', false)">Refuser</button>
        </div></div>`;
    }).join('')}</div>`;
}
async function decideEditRequest(id, approve){
  try{
    await api('/rest/v1/rpc/decide_edit_request', { method:'POST', body: JSON.stringify({ p_request: id, p_approve: approve }) });
  }catch(e){ console.error(e); toast('Action impossible. Réessaie.'); return; }
  pendingEditReqs = pendingEditReqs.filter(r => r.id !== id);
  renderEditRequests();
  toast(approve ? 'Modification autorisée' : 'Demande refusée');
}
// ---- Gestion des coachs (grand admin uniquement) ----
function coachesBoxHtml(clients){
  if(!IS_SUPER) return '';
  const n = id => (clients || []).filter(c => c.coach_id === id).length;
  const rows = coachList.length ? coachList.map(co => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)">
      <div style="min-width:180px;flex:1 1 180px"><div style="font-weight:700">${escapeHtml(co.full_name || 'Coach')}</div><div style="font-size:12.5px;opacity:.7;overflow:hidden;text-overflow:ellipsis">${escapeHtml(co.email || '')} · ${n(co.id)} client${n(co.id) > 1 ? 's' : ''}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="openMyCoachCard('${co.id}',${jq(co.full_name || co.email || 'ce coach')})">🪪 Fiche</button>
      <button class="btn btn-ghost btn-sm" onclick="demoteCoach('${co.id}',${jq(co.full_name || co.email || 'ce coach')})">Retirer les droits</button></div></div>`).join('')
    : '<div style="font-size:13px;opacity:.7;padding-top:8px">Aucun coach pour le moment. Pour en ajouter : ouvre la fiche d\'un client inscrit et appuie sur « 🎓 Promouvoir coach ». Tu pourras ensuite lui attribuer des clients.</div>';
  return `<details class="coaches-box" ${coachesOpen ? 'open' : ''} ontoggle="coachesOpen = this.open" style="border:1px solid var(--line);border-radius:16px;padding:4px 14px 12px;margin-bottom:16px">
    <summary style="cursor:pointer;font-weight:700;padding:12px 0">🎓 Coachs <span style="opacity:.6;font-weight:500">(${coachList.length})</span></summary>${rows}</details>`;
}
async function promoteCoach(id, name){
  if(!confirm(`Promouvoir « ${name} » coach ?\n\nIl aura accès à l'espace coach, mais seulement pour les clients que tu lui attribues. Tu peux retirer ses droits à tout moment.`)) return;
  try{ await api('/rest/v1/rpc/set_coach_role', { method:'POST', body: JSON.stringify({ p_user: id, p_make: true }) }); coachesOpen = true; toast(name + ' est maintenant coach (voir l’encadré Coachs)'); renderClientsTab(); }
  catch(e){ toast('Erreur : ' + String((e && e.detail) || (e && e.message) || e).slice(0, 120)); }
}
async function demoteCoach(id, name){
  if(!confirm(`Retirer les droits de coach à « ${name} » ?\n\nIl redevient simple client et perd l'accès à l'espace coach. Ses clients te sont réattribués.`)) return;
  try{ await api('/rest/v1/rpc/set_coach_role', { method:'POST', body: JSON.stringify({ p_user: id, p_make: false }) }); toast('Droits retirés'); renderClientsTab(); }
  catch(e){ toast('Erreur : ' + String((e && e.detail) || (e && e.message) || e).slice(0, 120)); }
}
async function assignClientTo(clientId, coachId, sel){
  try{ await api('/rest/v1/rpc/assign_client', { method:'POST', body: JSON.stringify({ p_client: clientId, p_coach: coachId || null }) });
    const r = clientRows.find(x => x.client.id === clientId); if(r) r.client.coach_id = coachId || null;
    toast(coachId ? 'Client attribué' : 'Client repris par toi'); }
  catch(e){ toast('Erreur, réessaie'); renderClientsTab(); }
}
let clientSearchQ = '';
async function renderClientsTab(){
  document.getElementById('tabBody').innerHTML = '<div class="empty">Chargement…</div>';
  let clients, progs, sessions, convs, unreadMsgs, revs = [], editReqs = [];
  try{
    clients = await api('/rest/v1/profiles?select=id,full_name,email,featured_badge,coach_id,role&' + (IS_SUPER ? `role=in.(client,coach)&id=neq.${MY_ID}` : 'role=eq.client') + '&order=full_name');   // le grand admin garde aussi accès aux comptes devenus coachs (leurs séances/programmes perso)
    coachList = IS_SUPER ? ((await api('/rest/v1/profiles?select=id,full_name,email&role=eq.coach&order=full_name').catch(()=>[])) || []) : [];
    if(!clients.length){ document.getElementById('tabBody').innerHTML = coachesBoxHtml([]) + '<div class="empty">Aucun client pour le moment.</div>'; return; }
    const idList = clients.map(c=>c.id).join(',');
    [progs, sessions, convs, unreadMsgs] = await Promise.all([
      api(`/rest/v1/programs?select=id,name,owner_user_id,created_at&owner_user_id=in.(${idList})&is_official=eq.false&order=created_at.desc`),
      api(`/rest/v1/sessions?select=id,user_id,started_at,completed_at,badge_eligible&imported=is.false&for_name=is.null&user_id=in.(${idList})&order=started_at.desc&limit=5000`),
      api(`/rest/v1/conversations?select=id,user_id&user_id=in.(${idList})`),
      api('/rest/v1/messages?select=conversation_id&sender=eq.user&read=eq.false')
    ]);
    try{ revs = await api(`/rest/v1/badge_revocations?select=user_id,badge_id,reason&user_id=in.(${idList})`) || []; }catch(e){ revs = []; }

  const lastActivityByUser = {};

    if(s.user_id && !lastActivityByUser[s.user_id]) lastActivityByUser[s.user_id] = s.started_at;
    if(s.user_id) (sessionsByUser[s.user_id] = sessionsByUser[s.user_id] || []).push(s);

  const convByUser = {}; convs.forEach(c=> convByUser[c.user_id] = c.id);
  const unreadByConv = {}; unreadMsgs.forEach(m=> unreadByConv[m.conversation_id] = (unreadByConv[m.conversation_id]||0)+1);

  clientRows = clients.map(c=>{
    const progsOfUser = programsByUser[c.id] || [];
    const prog = progsOfUser[0] || null;
    const last = lastActivityByUser[c.id] || null;

    let badgeLine = '', badgeChip = '';
    try{ if(typeof HSBadges !== 'undefined'){ const bres = HSBadges.compute({ sessions: sessionsByUser[c.id] || [], revoked: revs.filter(r => r.user_id === c.id) }); badgeLine = HSBadges.summaryLine(bres); badgeChip = HSBadges.chip(bres, c.featured_badge); } }catch(e){}
    return { client:c, prog, progs: progsOfUser, last, convId, unread, badgeLine, badgeChip };
  });
  clientRows.sort((a,b)=>{
    if(a.unread !== b.unread) return b.unread - a.unread;

    return tb - ta;
  });
  clientSearchQ = ''; clientFilter = 'all';
  pendingEditReqs = editReqs;
  document.getElementById('tabBody').innerHTML = coachesBoxHtml(clients) + `
    <div id="editReqBox"></div>
    <div class="field"><label>Chercher un client</label><input id="clientSearch" type="text" placeholder="Nom ou email…" oninput="filterClientsTab(this.value)"></div>
    <div id="clientFilters">${clientFilterBar()}</div>
    <div id="clientsList" class="clients-grid"></div>
  `;
  renderEditRequests();
  renderClientRows(clientRows.filter(clientFilterOk));
  try{ loadRanks(clients); }catch(e){ console.error(e); }
}
let clientFilter = 'all';
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }
function clientFilterOk(r){
  if(clientFilter === 'unread') return r.unread > 0;
  if(clientFilter === 'idle') { const d = daysSince(r.last); return d === null || d >= 7; }
  if(clientFilter === 'noprog') return !r.progs.length;
  return true;
}
function setClientFilter(f){ clientFilter = f; filterClientsTab(document.getElementById('clientSearch')?.value || ''); }
function clientFilterBar(){

    idle: clientRows.filter(r=>{ const d = daysSince(r.last); return d === null || d >= 7; }).length,
    noprog: clientRows.filter(r=>!r.progs.length).length };

  if(ms <= 2000) return '';

  return h ? `${h} h ${String(m).padStart(2,'0')} min` : (m ? `${m} min ${String(sec).padStart(2,'0')} s` : `${sec} s`);

async function addClientSet(btn){
  const box = btn.closest('.cs-logs'), exId = btn.dataset.ex;

  if(!mine.length) return;
  const last = mine.reduce((m, l) => l.set_number > m.set_number ? l : m, mine[0]);
  const body = { session_id: last.session_id, exercise_id: exId, set_number: last.set_number + 1, reps: last.reps, charge: last.charge, duration_seconds: last.duration_seconds };

    const r = await api('/rest/v1/session_logs?select=id,session_id,exercise_id,set_number,reps,charge,duration_seconds,exercises(name)', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify(body) });

    renderClientLogs(box, box._logs); toast('Série ajoutée (copie de la précédente, corrige puis Enregistrer)');

async function removeClientSet(btn){
  const row = btn.closest('.cs-edit'), box = btn.closest('.cs-logs');
  const l = (box._logs || []).find(x => String(x.id) === row.dataset.id); if(!l) return;
  const sameEx = box._logs.filter(x => x.exercise_id === l.exercise_id);
  if(sameEx.length <= 1){ toast('Dernière série de cet exercice : supprime plutôt la séance'); return; }
  if(!confirm('Retirer la série ' + l.set_number + ' de « ' + ((l.exercises && l.exercises.name) || 'cet exercice') + ' » ?')) return;
  btn.disabled = true;
  try{
    await api(`/rest/v1/session_logs?id=eq.${l.id}`, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    box._logs = box._logs.filter(x => x !== l);
    const rest = box._logs.filter(x => x.exercise_id === l.exercise_id).sort((x, y) => x.set_number - y.set_number);
    for(let i = 0; i < rest.length; i++){
      if(rest[i].set_number !== i + 1){ await api(`/rest/v1/session_logs?id=eq.${rest[i].id}`, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body: JSON.stringify({ set_number: i + 1 }) }); rest[i].set_number = i + 1; }
    }
    renderClientLogs(box, box._logs); toast('Série retirée');
  }catch(e){ console.error(e); toast('Suppression impossible, réessaie'); btn.disabled = false; }
}
async function saveClientLog(btn){

async function toggleClientSession(card, sessionId){

    }

  let rec = 0, recIdx = -1; ses.forEach((x,i)=>{ if(x.max > rec){ rec = x.max; recIdx = i; } });

function cpDetailHtml(e){

  const bestRm = ses.reduce((m,x)=> x.rm > m.v ? { v:x.rm, date:x.date } : m, { v:0, date:null });
  const cut = cpPeriod ? Date.now() - cpPeriod*864e5 : 0;
  const inWin = cut ? ses.filter(x => new Date(x.date).getTime() >= cut) : ses;
  const before = cut ? ses.filter(x => new Date(x.date).getTime() < cut) : [];
  const base = before.length ? before[before.length-1] : inWin[0];
  const lastS = ses[ses.length-1];
  const okP = inWin.length && base && base !== lastS;
  const sinceD = okP ? Math.round((lastS.max - base.max) * 10) / 10 : 0;

  return `<div class="card"><h3>${escapeHtml(e.name)}</h3>${stag}
    ${per(cpPeriod,'cpSetPeriod')}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">
      ${tile('📈 ' + lbl, okP ? (sinceD > 0 ? '+' : '') + sinceD + ' kg' : (ses.length > 1 ? '–' : '1ère séance'), okP ? base.max + ' → ' + lastS.max + ' kg' : (ses.length > 1 ? 'pas assez de séances' : ses[0].max + ' kg'))}
      ${tile('🏅 Record', st.rec + ' kg', d(recS.date))}
      ${tile('💪 1RM estimé', bestRm.v ? Math.round(bestRm.v) + ' kg' : '–', ses.length > 1 && bestRm.v ? (rmD > 0 ? '+' : '') + rmD + ' kg depuis le début' : '')}

    </div>

}

let progsAll = [], progProfById = {}, progFilter = 'all';
// Origine d'un programme : official | coach | client | visitor | unknown
function progOrigin(p){
  if(p.is_official) return 'official';
  if(p.owner_guest_id && !p.owner_user_id) return 'visitor';
  if(!p.owner_user_id) return 'visitor';
  if(p.owner_user_id === MY_ID) return 'draft';
  if(!p.created_by) return 'unknown';
  if(p.created_by === p.owner_user_id) return 'client';
  return 'coach';
}
function progOwnerName(p){
  const pr = progProfById[p.owner_user_id];
  return pr ? (pr.full_name || pr.email || 'Client') : 'Client';
}
function progOriginHtml(p){
  const o = progOrigin(p);
  const pill = (cls, txt) => `<span class="origin-pill ${cls}">${txt}</span>`;
  if(o === 'official') return pill('official', '⭐ Programme officiel') + '<span class="origin-for">visible par tous les visiteurs</span>';
  if(o === 'visitor') return pill('visitor', '👻 Créé par un visiteur');
  if(o === 'draft') return pill('coach', '📝 À affecter') + '<span class="origin-for">visible par toi seul, à donner à un client plus tard</span>';
  const O = escapeHtml(progOwnerName(p));
  if(o === 'client') return pill('client', `👤 Créé par ${O}`);
  if(o === 'coach') return pill('coach', '🧑‍🏫 Créé par toi') + `<span class="origin-for">pour ${O}</span>`;
  return pill('unknown', '❔ Créateur inconnu') + `<span class="origin-for">programme de ${O}</span>`;
}
function setProgFilter(f){ progFilter = f; paintProgList(); }
function paintProgList(){
  const counts = { all: progsAll.length };
  progsAll.forEach(p => { const o = progOrigin(p); counts[o] = (counts[o]||0) + 1; });
  const chips = [['all','Tous'],['official','Officiels'],['draft','À affecter'],['coach','Créés par moi'],['client','Clients'],['visitor','Visiteurs'],['unknown','Inconnus']]
    .filter(([k]) => k === 'all' || counts[k])
    .map(([k,l]) => `<button type="button" class="fchip ${progFilter===k?'active':''}" onclick="setProgFilter('${k}')">${l} <span>${counts[k]||0}</span></button>`).join('');
  const list = progFilter === 'all' ? progsAll : progsAll.filter(p => progOrigin(p) === progFilter);
  document.getElementById('progList').innerHTML = `<div class="fchips">${chips}</div>` + (list.length ? list.map(p=>`
    <div class="card">
      <div onclick="renderProgramForm('${p.id}')" style="cursor:pointer;">
        <div class="origin-row">${progOriginHtml(p)}</div>
        <h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p>
      </div>
      <div class="row-actions" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="duplicateProgram('${p.id}')">Dupliquer</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucun programme dans cette catégorie.</div>');
}

const PEC_ORDER = ["Bas des pectoraux","Milieu des pectoraux","Haut des pectoraux"];

let pickGroup = 'Tous', pickMuscle = null;
function pickMatchesGroup(ex, group){ return group === 'Tous' || (ex.primary_muscles||[]).some(m => MUSCLE_GROUP_OF[m] === group); }
function pickPecRegion(ex){
  const n = (ex.name||'').toLowerCase();
  if(n.includes('incliné') || n.includes('incline')) return 'Haut des pectoraux';
  if(n.includes('décliné') || n.includes('decline')) return 'Bas des pectoraux';
  return 'Milieu des pectoraux';
}
function pickMuscleLabels(ex, group){
  if(group === 'Pectoraux') return pickMatchesGroup(ex, 'Pectoraux') ? [pickPecRegion(ex)] : [];
  const labels = new Set();
  (ex.primary_muscles||[]).forEach(m=>{ if(MUSCLE_GROUP_OF[m] === group){ const l = MUSCLE_PUBLIC_LABEL[m]; if(l) labels.add(l); } });
  return [...labels];
}
function setPickGroup(g){ pickGroup = g; pickMuscle = null; renderPickChips(); filterExPicker(); }
function setPickMuscle(m){ pickMuscle = (m === '' ? null : m); renderPickChips(); filterExPicker(); }
function renderPickChips(){
  const box = document.getElementById('pfChips'), sub = document.getElementById('pfSubchips');
  if(!box || !sub) return;
  box.innerHTML = ['Tous', ...GROUPS].map(g => `<button type="button" class="fchip ${g===pickGroup?'active':''}" data-g="${g}" onclick="setPickGroup(this.dataset.g)">${g}</button>`).join('');
  if(pickGroup === 'Tous'){ sub.innerHTML = ''; sub.style.display = 'none'; return; }
  const counts = {};
  exercises.filter(ex => pickMatchesGroup(ex, pickGroup)).forEach(ex => pickMuscleLabels(ex, pickGroup).forEach(l => counts[l] = (counts[l]||0) + 1));
  let ms = Object.keys(counts).sort((a,b)=> counts[b]-counts[a]);
  if(pickGroup === 'Pectoraux') ms = PEC_ORDER.filter(m => counts[m]);
  if(!ms.length){ sub.innerHTML = ''; sub.style.display = 'none'; return; }
  sub.style.display = '';
  sub.innerHTML = ['Tous', ...ms].map(m => `<button type="button" class="fchip ${(m==='Tous' ? pickMuscle===null : pickMuscle===m)?'active':''}" data-m="${m==='Tous'?'':m}" onclick="setPickMuscle(this.dataset.m)">${m}</button>`).join('');
}
