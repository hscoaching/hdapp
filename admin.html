<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  :root{
    --bg:#0b0b0c; --surface:#16171a; --surface-2:#1f2024; --line:#2c2c30;
    --ink:#f5f5f5; --ink-muted:#9a9a9e; --accent:#ffffff; --accent-ink:#0b0b0c;
    --ok:#ffffff; --warn:#f5f5f5; --radius:14px; box-sizing:border-box; color-scheme:dark;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em; line-height:.95;}
  a{color:inherit;} button{font-family:inherit;}
  .wrap{max-width:960px; margin:0 auto; padding:0 20px;}
  header.top{position:sticky; top:0; z-index:20; background:rgba(11,11,12,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
  .top-inner{display:flex; align-items:center; gap:14px; padding:14px 20px; max-width:960px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; font-family:'Bebas Neue'; font-size:19px; color:var(--accent-ink);}
  .brand .b1{font-size:15px; font-weight:700;} .brand .b2{font-size:12px; color:var(--ink-muted);}
  main{padding:28px 0 80px;}
  .center-msg{max-width:420px; margin:80px auto; text-align:center;}
  .center-msg p{color:var(--ink-muted); font-size:14px; margin-top:10px;}
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .tab{padding:12px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--ink); border-color:var(--accent);}
  .subtabs{display:flex; gap:8px; margin-bottom:16px;}
  .subtab{font-size:12.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:7px 14px; border-radius:999px; cursor:pointer;}
  .subtab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn{display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:999px; border:none; cursor:pointer;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}
  .reps-mode-btn.active{border-color:var(--accent); color:var(--accent); background:var(--surface);}
  .pick-ex-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; max-height:340px; overflow-y:auto; padding:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:8px 0 12px;}
  .pick-ex-card{display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px; padding:6px; cursor:pointer; text-align:center; font-family:inherit; font-size:11px; color:var(--ink);}
  .pick-ex-card .pick-ex-img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; background:var(--surface);}
  .pick-ex-card .pick-ex-noimg{width:100%; aspect-ratio:1/1; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); font-size:9px; text-transform:uppercase; letter-spacing:.05em; padding:4px;}
  .pick-ex-card span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2;}
  .pick-ex-card.selected{border-color:var(--accent); background:var(--surface);}
  .ex-mini.in-ss{border-left:3px solid var(--accent); padding-left:10px;}
  .ex-mini button.on{border-color:var(--accent); color:var(--accent);}
  .ex-mini button:disabled{opacity:.35; cursor:default;}
  .ss-chip{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; padding:2px 7px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); vertical-align:middle;}
  .draft-var{font-size:12px; color:var(--ink-muted); margin-top:3px;}
  .rm-var{background:none !important; border:none !important; color:var(--ink-muted); cursor:pointer; font-size:12px; padding:0 4px; width:auto !important; height:auto !important;}
  .day-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 8px;}
  .day-chip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .day-chip.active{background:var(--surface-2); border-color:var(--accent); color:var(--accent);}
  .day-chip.add{border-style:dashed;}
  .pf-field{display:flex; flex-direction:column; gap:3px;}
  .pf-field label{font-size:10.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em;}
  .btn-danger{background:none; border:1px dashed var(--ink-muted); color:var(--ink);}
  .row-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:16px;}
  .stat-tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center;}
  .stat-num{font-family:'Bebas Neue'; font-size:28px; color:var(--accent); line-height:1;}
  .stat-label{font-size:11px; color:var(--ink-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.03em; line-height:1.3;}
  @media (max-width:480px){ .stats-row{grid-template-columns:repeat(2,1fr);} .stat-tile{padding:10px 4px;} .stat-num{font-size:22px;} .stat-label{font-size:10px;} }
  .set-rows{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .set-row{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:13.5px; border-bottom:1px solid var(--line);}
  .set-row:last-child{border-bottom:none;}
  .set-row-num{color:var(--ink-muted);}
  .set-row-val{font-weight:600;}
  .origin-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .origin-pill{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2);}
  .origin-pill.coach{color:#7ee0a0; border-color:rgba(126,224,160,.4); background:rgba(126,224,160,.1);}
  .origin-pill.client{color:#8ab4ff; border-color:rgba(138,180,255,.4); background:rgba(138,180,255,.1);}
  .origin-pill.visitor{color:#ffb86b; border-color:rgba(255,184,107,.4); background:rgba(255,184,107,.1);}
  .origin-pill.official{color:var(--ink); }
  .origin-pill.unknown{color:var(--ink-muted); border-style:dashed;}
  .origin-for{font-size:12.5px; color:var(--ink-muted);}
  .fchips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .fchip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .fchip span{opacity:.7; margin-left:3px;}
  .fchip.active{background:var(--accent); color:var(--accent-ink,#0b0b0c); border-color:var(--accent);}
  .ex-card{display:flex; gap:12px; align-items:center;}
  .ex-thumb{flex:none; width:84px; height:84px; border-radius:10px; overflow:hidden; background:var(--surface-2); display:flex; align-items:center; justify-content:center;}
  .ex-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .ex-thumb-empty{font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); text-align:center; padding:4px;}
  .ex-card-text{min-width:0; flex:1;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px; cursor:pointer;}
  .card:hover{border-color:var(--accent);}
  .card .tag{font-size:10.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.07em;}
  .card h3{font-family:'Inter'; font-weight:700; font-size:15px; margin-top:3px; letter-spacing:0; color:var(--ink);}
  .card p{color:var(--ink-muted); font-size:12.5px; margin-top:4px;}
  .badge{display:inline-block; background:var(--accent); color:var(--accent-ink); font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px; margin-left:8px;}
  .empty{color:var(--ink-muted); font-size:13.5px; padding:16px 0;}
  .field{margin-top:12px;}
  .field label{font-size:12px; color:var(--ink-muted); display:block; margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 12px; font-size:13.5px; font-family:inherit;}
  .field textarea{min-height:70px; resize:vertical;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px;}
  .backlink{font-size:13px; color:var(--ink-muted); display:inline-block; margin-bottom:14px; cursor:pointer;}
  .backlink:hover{color:var(--accent);}
  .chat-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; height:420px; display:flex; flex-direction:column;}
  .chat-msgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:75%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.4;}
  .msg.coach{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
  .msg.user{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px;}
  .chat-input{display:flex; border-top:1px solid var(--line); padding:10px;}
  .chat-input input{flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:14px; padding:8px; font-family:inherit;}
  .chat-input button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer;}
  .ex-mini{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); font-size:13px; gap:10px;}
  .ex-mini > span:first-child{flex:1;}
  .ex-mini > span:last-child{display:flex; gap:8px;}
  .ex-mini button{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink-muted); cursor:pointer; font-size:15px; width:36px; height:36px; flex:none;}
  .visits-section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-muted); margin:16px 0 4px; display:flex; align-items:center; gap:7px;}
  .visits-toggle{cursor:pointer;}
  .visits-count{background:var(--surface-2); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--ink); font-weight:700;}
  .visit-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line);}
  .visit-avatar{flex:none; width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .visit-avatar-anon{background:var(--surface-2); color:var(--ink-muted);}
  .visit-info{flex:1; min-width:0;}
  .visit-name{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .visit-sub{font-size:11.5px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .visit-badge{background:var(--surface-2); border-radius:999px; padding:1px 7px; font-size:9.5px; color:var(--accent); font-weight:700; text-transform:uppercase;}
  .visit-when{flex:none; font-size:11.5px; color:var(--ink-muted); display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .visit-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .picker{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .picker select, .picker input{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:9px; font-family:inherit; font-size:13px;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line); padding:12px 20px; border-radius:999px; font-size:13.5px; z-index:80; display:none;}
  .install-banner{position:fixed; left:12px; right:12px; bottom:12px; z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .install-banner.show{display:flex;}
  .install-banner p{flex:1; font-size:13px; color:var(--ink); margin:0; line-height:1.4;}
  .install-banner .btn-row{display:flex; gap:8px; flex:none; align-items:center;}
  .qr-overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center;}
  .qr-overlay.open{display:flex;}
  .qr-sheet{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center; max-width:320px;}
  .qr-sheet .box{background:#fff; padding:12px; border-radius:10px; display:inline-block; margin:16px 0;}
  .ex-overlay{position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:16px;}
  .ex-overlay.open{display:flex;}
  .ex-modal{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto;}
  .ex-modal h3{font-family:Inter; font-weight:700; font-size:16px; margin-bottom:14px;}
  @media print{
    body *{visibility:hidden;}
    #printAreaAdmin, #printAreaAdmin *{visibility:visible;}
    #printAreaAdmin{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#fff;}
    #printAreaAdmin .box{background:#fff;}
    #printAreaAdmin h3{font-family:'Bebas Neue'; font-size:34px; color:#000;}
    #printClientArea, #printClientArea *{visibility:visible;}
    #printClientArea{display:block; position:fixed; inset:0; background:#fff; padding:40px; overflow:visible;}
    #printClientArea h1{font-family:'Bebas Neue',sans-serif; font-size:32px; color:#000; margin:0 0 2px;}
    #printClientArea .pmeta{color:#777; font-size:12px; margin-bottom:22px; text-transform:uppercase; letter-spacing:.5px;}
    #printClientArea h2{font-family:Inter; font-size:16px; color:#000; margin:22px 0 10px; border-bottom:1px solid #ccc; padding-bottom:6px;}
    #printClientArea .pex{border-top:1px solid #eee; padding:8px 0; color:#000; font-size:13px; display:flex; justify-content:space-between;}
    #printClientArea .sess-row{border-top:1px solid #eee; padding:8px 0; color:#000; font-size:13px; display:flex; justify-content:space-between;}
    #printClientArea .empty-print{color:#777; font-size:13px; font-style:italic;}
  }
  .navrow{display:flex; gap:8px; max-width:960px; margin:0 auto; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:1; text-align:center; font-size:13.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:10px 14px; border-radius:999px; white-space:nowrap; text-decoration:none;}
  .navrow a.active{background:var(--ink); border-color:var(--ink); color:var(--bg);}

  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
    .picker{ flex-direction:column; align-items:stretch; }
    .picker select, .picker input{ width:100% !important; }
  }
</style>
</head>

<script>
String.prototype.fold = function(){ return this.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }; // recherche sans accents
const SUPABASE_URL = "https://rvftqdbdibfylauartii.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZnRxZGJkaWJmeWxhdWFydGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjEzMjIsImV4cCI6MjEwNjA5NzMyMn0._WLJkWncu1fwMnlakuPFuJr_I-uvgr_TwvMect8E-a0";
const app = document.getElementById('app');
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(window._t); window._t=setTimeout(()=>t.style.display='none',2200); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getSession(){ try{ return JSON.parse(localStorage.getItem('hs_session')||'null'); }catch(e){ return null; } }
async function refreshIfNeeded(){
  const s = getSession();
  if(!s || !s.refresh_token) return;
  const exp = (s.expires_at || 0) * 1000;
  if(exp && Date.now() < exp - 60000) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const data = await res.json();
    if(res.ok && data.access_token) localStorage.setItem('hs_session', JSON.stringify(data)); else localStorage.removeItem('hs_session');
  }catch(e){}
}
async function api(path, opts={}){
  await refreshIfNeeded();
  const s = getSession();
  const res = await fetch(`${SUPABASE_URL}${path}`, { cache:'no-store', ...opts, headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s?.access_token}`, 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if(!res.ok){ console.error(await res.text()); throw new Error('api_error'); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let exercises = []; let exercisesById = {};

function libraryUrl(){ return location.origin + location.pathname.replace(/admin\.html$/, 'index.html'); }
function openEntranceQr(){
  document.getElementById('entranceQrBox').innerHTML = '';
  new QRCode(document.getElementById('entranceQrBox'), { text: libraryUrl(), width:160, height:160, colorDark:"#0b0b0c", colorLight:"#ffffff" });
  document.getElementById('qrOverlay').classList.add('open');
}
function printEntranceQr(){
  const area = document.getElementById('printAreaAdmin');
  area.innerHTML = `<h3>HS Coaching</h3><div class="box" id="entranceQrPrint"></div><p style="font-family:Inter;font-size:13px;color:#000;">Scanne pour accéder à la bibliothèque d'exercices</p>`;
  new QRCode(document.getElementById('entranceQrPrint'), { text: libraryUrl(), width:220, height:220, colorDark:"#0b0b0c", colorLight:"#ffffff" });
  area.style.display = 'flex';
  window.print();
  setTimeout(()=> area.style.display='none', 300);
}

async function boot(){

async function renderCoachStats(){
  const el = document.getElementById('coachStats');
  if(!el) return;
  try{
    const now = new Date();
    const day = (now.getDay()+6)%7; // lundi=0
    const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
    const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
    const [weekSessions, allClients, recentSessions, unread, visits] = await Promise.all([
      api(`/rest/v1/sessions?select=id&started_at=gte.${monday.toISOString()}`),
      api('/rest/v1/profiles?select=id&role=eq.client'),
      api(`/rest/v1/sessions?select=user_id&started_at=gte.${weekAgo.toISOString()}`),
      api('/rest/v1/messages?select=id&sender=eq.user&read=eq.false'),
      api('/rest/v1/app_visits?select=user_id')
    ]);
    const clientIds = new Set(allClients.map(c=>c.id));
    const activeClients = new Set(recentSessions.map(s=>s.user_id).filter(id=>id && clientIds.has(id))).size;
    // Un compte utilisé sur plusieurs appareils ne compte qu'une fois
    const withAccount = new Set(visits.filter(v=>v.user_id).map(v=>v.user_id)).size;
    const anonymous = visits.filter(v=>!v.user_id).length;
    const totalVisitors = withAccount + anonymous;
    if(!document.getElementById('coachStats')) return; // l'utilisateur a changé de page pendant le chargement
    el.innerHTML = `
      <div class="stat-tile"><div class="stat-num">${weekSessions.length}</div><div class="stat-label">Séances cette semaine</div></div>
      <div class="stat-tile"><div class="stat-num">${activeClients}/${allClients.length}</div><div class="stat-label">Clients ayant fait une séance (7 derniers jours)</div></div>
      <div class="stat-tile"><div class="stat-num">${unread.length}</div><div class="stat-label">Messages non lus</div></div>
      <div class="stat-tile" style="cursor:pointer;" onclick="openVisitsModal()"><div class="stat-num">${totalVisitors}</div><div class="stat-label">Visiteurs de l'appli (${withAccount} comptes, ${anonymous} invités)</div></div>
    `;
  }catch(e){
    console.error(e);
    if(el) el.innerHTML = '<div class="empty">Statistiques indisponibles.</div>';
  }
}
let visitsAccounts = [];
let visitsAnon = [];
async function openVisitsModal(){
  document.getElementById('visitsOverlay').classList.add('open');
  const body = document.getElementById('visitsBody');
  body.innerHTML = '<div class="empty">Chargement…</div>';
  try{
    const visits = await api('/rest/v1/app_visits?select=user_id,first_seen,last_seen&order=last_seen.desc');
    const userIds = [...new Set(visits.map(v=>v.user_id).filter(Boolean))];
    let profilesById = {};
    if(userIds.length){
      const profs = await api(`/rest/v1/profiles?select=id,full_name,email,role&id=in.(${userIds.join(',')})`);
      profilesById = Object.fromEntries(profs.map(p=>[p.id,p]));
    }
    // Un même compte peut avoir visité depuis plusieurs appareils (téléphone, ordi, navigation privée...),
    // ce qui crée une ligne par appareil : on les fusionne ici pour n'afficher le compte qu'une fois.
    const grouped = {};
    visits.filter(v=>v.user_id).forEach(v=>{
      const g = grouped[v.user_id] || (grouped[v.user_id] = { user_id: v.user_id, first_seen: v.first_seen, last_seen: v.last_seen, devices: 0 });
      g.devices++;
      if(new Date(v.first_seen) < new Date(g.first_seen)) g.first_seen = v.first_seen;
      if(new Date(v.last_seen) > new Date(g.last_seen)) g.last_seen = v.last_seen;
    });
    visitsAccounts = Object.values(grouped)
      .map(g=>({ visit:g, profile: profilesById[g.user_id] || {} }))
      .sort((a,b)=> new Date(b.visit.last_seen) - new Date(a.visit.last_seen));
    visitsAnon = visits.filter(v=>!v.user_id);
    body.innerHTML = `
      <div class="field" style="margin-bottom:8px;"><input id="visitsSearch" type="text" placeholder="Chercher un nom ou email…" oninput="renderVisitsList()"></div>
      <div class="visits-section-title">Comptes <span class="visits-count">${visitsAccounts.length}</span></div>
      <div id="visitsAccountsList"></div>

      <div id="visitsAnonList" style="display:none;"></div>
    `;
    renderVisitsList();
  }catch(e){
    console.error(e);
    body.innerHTML = '<div class="empty">Impossible de charger les visites.</div>';
  }
}

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return "à l'instant";
  if(min < 60) return `il y a ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `il y a ${h} h`;
  const days = Math.floor(h/24);
  if(days === 1) return 'hier';
  if(days < 7) return `il y a ${days} j`;
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase() || '?';
}
function accountRowHtml(v, p){
  const name = p.full_name || p.email || 'Compte';

  const dotColor = ageMs < 24*3600*1000 ? '#4caf7d' : (ageMs < 7*24*3600*1000 ? '#e0a94c' : 'var(--ink-muted)');
  return `<div class="visit-row">
    <div class="visit-avatar">${initials(name)}</div>
    <div class="visit-info">
      <div class="visit-name">${name}${p.role==='admin' ? ' <span class="visit-badge">coach</span>' : ''}</div>
      <div class="visit-sub">${p.email||''}${v.devices>1?` · ${v.devices} appareils`:''}</div>
    </div>
    <div class="visit-when"><span class="visit-dot" style="background:${dotColor};"></span>${timeAgo(v.last_seen)}</div>
  </div>`;
}
function anonRowHtml(v){
  const first = new Date(v.first_seen).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
  return `<div class="visit-row">

      <div class="visit-name">Invité anonyme</div>
      <div class="visit-sub">Première visite : ${first}</div>
    </div>
    <div class="visit-when">${timeAgo(v.last_seen)}</div>
  </div>`;
}

let clientRows = [];

async function renderClientsTab(){
  document.getElementById('tabBody').innerHTML = '<div class="empty">Chargement…</div>';
  let clients, progs, sessions, convs, unreadMsgs;
  try{
    clients = await api('/rest/v1/profiles?select=id,full_name,email&role=eq.client&order=full_name');
    if(!clients.length){ document.getElementById('tabBody').innerHTML = '<div class="empty">Aucun client pour le moment.</div>'; return; }
    const idList = clients.map(c=>c.id).join(',');
    [progs, sessions, convs, unreadMsgs] = await Promise.all([
      api(`/rest/v1/programs?select=id,name,owner_user_id,created_at&owner_user_id=in.(${idList})&is_official=eq.false&order=created_at.desc`),
      api(`/rest/v1/sessions?select=id,user_id,started_at,completed_at&user_id=in.(${idList})&order=started_at.desc&limit=5000`),
      api(`/rest/v1/conversations?select=id,user_id&user_id=in.(${idList})`),
      api('/rest/v1/messages?select=conversation_id&sender=eq.user&read=eq.false')
    ]);
  }catch(e){
    console.error(e);
    document.getElementById('tabBody').innerHTML = '<div class="empty">Impossible de charger les clients. Réessaie.</div>';
    return;
  }
  const programsByUser = {};
  progs.forEach(p=>{ (programsByUser[p.owner_user_id] = programsByUser[p.owner_user_id] || []).push(p); });
  const lastActivityByUser = {};
  const sessionsByUser = {};
  sessions.forEach(s=>{
    if(s.user_id && !lastActivityByUser[s.user_id]) lastActivityByUser[s.user_id] = s.started_at;
    if(s.user_id) (sessionsByUser[s.user_id] = sessionsByUser[s.user_id] || []).push(s);
  });
  const convByUser = {}; convs.forEach(c=> convByUser[c.user_id] = c.id);
  const unreadByConv = {}; unreadMsgs.forEach(m=> unreadByConv[m.conversation_id] = (unreadByConv[m.conversation_id]||0)+1);

  clientRows = clients.map(c=>{
    const progsOfUser = programsByUser[c.id] || [];
    const prog = progsOfUser[0] || null;
    const last = lastActivityByUser[c.id] || null;
    const convId = convByUser[c.id] || null;
    const unread = convId ? (unreadByConv[convId]||0) : 0;
    let badgeLine = '';
    try{ if(typeof HSBadges !== 'undefined') badgeLine = HSBadges.summaryLine(HSBadges.compute({ sessions: sessionsByUser[c.id] || [] })); }catch(e){}
    return { client:c, prog, progs: progsOfUser, last, convId, unread, badgeLine };
  });
  clientRows.sort((a,b)=>{
    if(a.unread !== b.unread) return b.unread - a.unread;
    const ta = a.last ? new Date(a.last).getTime() : 0;
    const tb = b.last ? new Date(b.last).getTime() : 0;
    return tb - ta;
  });
  clientSearchQ = '';
  document.getElementById('tabBody').innerHTML = `
    <div class="field"><label>Chercher un client</label><input id="clientSearch" type="text" placeholder="Nom ou email…" oninput="filterClientsTab(this.value)"></div>
    <div id="clientsList"></div>
  `;
  renderClientRows(clientRows);
}
function filterClientsTab(q){
  clientSearchQ = q.trim().fold();
  const matches = !clientSearchQ ? clientRows : clientRows.filter(r=>
    (r.client.full_name||'').fold().includes(clientSearchQ) || (r.client.email||'').fold().includes(clientSearchQ)
  );
  renderClientRows(matches);
}

let csClient = null, csSessions = [], csShowAll = false;
function fmtSessDuration(s){
  if(!s.completed_at) return '';
  const ms = new Date(s.completed_at) - new Date(s.started_at);
  if(ms <= 2000) return '';
  const tot = Math.round(ms/1000), h = Math.floor(tot/3600), m = Math.floor((tot%3600)/60), sec = tot%60;
  return h ? `${h} h ${String(m).padStart(2,'0')} min` : (m ? `${m} min ${String(sec).padStart(2,'0')} s` : `${sec} s`);
}
async function openClientSessions(clientId, name){

      </div>`;
    }).join('') : '<div class="empty">Aucune séance enregistrée pour ce client.</div>'}</div>

async function toggleClientSession(card, sessionId){
  const box = card.querySelector('.cs-logs');
  if(box.style.display === 'block'){ box.style.display = 'none'; return; }
  box.style.display = 'block';
  if(box.dataset.loaded) return;
  box.innerHTML = '<div class="empty" style="padding:6px 0;">Chargement…</div>';
  try{
    const logs = await api(`/rest/v1/session_logs?select=set_number,reps,charge,exercises(name)&session_id=eq.${sessionId}&order=set_number`);
    if(!logs.length){ box.innerHTML = '<div class="empty" style="padding:6px 0;">Aucune série enregistrée pour cette séance.</div>'; box.dataset.loaded = '1'; return; }
    const byEx = {}; let vol = 0;
    logs.forEach(l=>{
      const n = (l.exercises && l.exercises.name) || 'Exercice';
      (byEx[n] = byEx[n] || []).push(l);
      if(l.reps && l.charge) vol += l.reps * l.charge;
    });
    box.innerHTML = Object.entries(byEx).map(([n, sets])=>{
      const filled = sets.filter(x => x.reps != null || x.charge != null);
      const body = filled.length
        ? `<div class="set-rows">${filled.map(x=>`<div class="set-row"><span class="set-row-num">Série ${x.set_number}</span><span class="set-row-val">${x.reps!=null ? x.reps+' reps' : '–'}${x.charge!=null ? ' · '+x.charge+' kg' : ''}</span></div>`).join('')}</div>`
        : '<div style="font-size:13px;color:var(--ink-muted);">Rien noté pour cet exercice.</div>';
      return `<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:14px;margin-bottom:6px;">${escapeHtml(n)}</div>${body}</div>`;
    }).join('') + (vol ? `<div style="border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;display:flex;justify-content:space-between;"><span>Poids total soulevé</span><b>${Math.round(vol).toLocaleString('fr-FR')} kg</b></div>` : '');
    box.dataset.loaded = '1';
  }catch(e){
    console.error(e);
    box.innerHTML = '<div class="empty" style="padding:6px 0;">Impossible de charger le détail.</div>';
  }
}

async function printClientReport(clientId){
  const row = clientRows.find(r=> r.client.id === clientId);
  if(!row){ toast('Client introuvable'); return; }
  const { client } = row; const progList = row.progs || [];
  const name = client.full_name || client.email || 'Client';
  let exByProg = {};
  if(progList.length){
    try{
      const all = await api(`/rest/v1/program_exercises?select=*,exercises(name)&program_id=in.(${progList.map(p=>p.id).join(',')})&order=order_index`);
      all.forEach(it=>{ (exByProg[it.program_id] = exByProg[it.program_id] || []).push(it); });
    }catch(e){}
  }
  let sessions = [];
  try{ sessions = await api(`/rest/v1/sessions?select=id,started_at,completed_at&user_id=eq.${clientId}&order=started_at.desc&limit=15`); }catch(e){ sessions = []; }
  let logsBySession = {};
  if(sessions.length){
    try{
      const idList = sessions.map(s=>s.id).join(',');
      const logs = await api(`/rest/v1/session_logs?select=session_id,reps,charge&session_id=in.(${idList})`);
      logs.forEach(l=>{
        if(l.reps==null || l.charge==null) return;
        logsBySession[l.session_id] = (logsBySession[l.session_id]||0) + l.reps*l.charge;
      });
    }catch(e){}
  }
  const pexHtml = it=> `<div class="pex"><b>${it.superset_group!=null?'[Superset] ':''}${escapeHtml(it.exercises?.name||'Exercice')}${it.variant_exercise_id && exercisesById[it.variant_exercise_id] ? ' (variante : '+escapeHtml(exercisesById[it.variant_exercise_id].name)+')' : ''}</b><span>${escapeHtml(it.sets||'-')}×${escapeHtml(it.reps||'-')} · repos ${escapeHtml(it.rest_seconds||'-')}s</span></div>`;
  const progBlock = p=>{
    const exItems = exByProg[p.id] || [];
    const dayLabels = [...new Set(exItems.map(it=>it.day_label||'Séance 1'))];
    const body = !exItems.length ? '<div class="empty-print">Programme vide.</div>'
      : (dayLabels.length > 1
          ? dayLabels.map(l=>`<div style="font-weight:700;margin:12px 0 4px;">${escapeHtml(l)}</div>` + exItems.filter(it=>(it.day_label||'Séance 1')===l).map(pexHtml).join('')).join('')
          : exItems.map(pexHtml).join(''));
    return `<h2>Programme — ${escapeHtml(p.name)}</h2>${body}`;
  };
  const exRows = progList.length ? progList.map(progBlock).join('') : '<h2>Programme assigné</h2><div class="empty-print">Aucun programme assigné.</div>';
  const sessRows = sessions.length ? sessions.map(s=>{
    const d = new Date(s.started_at);
    let duree = '';
    if(s.completed_at && (new Date(s.completed_at)-d) > 2000){ const min = Math.max(1, Math.round((new Date(s.completed_at)-d)/60000)); duree = ` · ${min} min`; }
    const vol = logsBySession[s.id] ? ` · ${Math.round(logsBySession[s.id]).toLocaleString('fr-FR')} kg soulevés` : '';
    return `<div class="sess-row"><span>${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</span><span>${duree}${vol}</span></div>`;
  }).join('') : '<div class="empty-print">Aucune séance enregistrée.</div>';
  document.getElementById('printClientArea').innerHTML = `
    <h1>${escapeHtml(name)}</h1>
    <div class="pmeta">${escapeHtml(client.email||'')} · Fiche coach — HS Coaching</div>
    ${exRows}
    <h2>Historique des séances (15 dernières)</h2>
    ${sessRows}
  `;
  window.print();
}
// Le coach peut écrire à un client même si celui-ci n'a jamais envoyé de message :
// on crée la discussion à la volée (ou on réutilise celle qui existe déjà).
async function startConversationWith(clientId, name, btn){
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  try{
    let rows = await api(`/rest/v1/conversations?select=id&user_id=eq.${clientId}&limit=1`);
    let convId = rows && rows[0] && rows[0].id;
    if(!convId){
      const created = await api('/rest/v1/conversations', { method:'POST', headers:{ Prefer:'return=representation' }, body: JSON.stringify({ user_id: clientId }) });
      convId = Array.isArray(created) ? created[0].id : created.id;
    }
    const row = clientRows.find(r=> r.client.id === clientId);
    if(row) row.convId = convId;
    await goToClientConversation(convId, name);
  }catch(e){
    console.error(e);
    toast("Impossible d'ouvrir la discussion. Réessaie.");
    if(btn) btn.disabled = false;
  }
}
async function goToClientConversation(convId, name){
  currentTab = 'messages'; msgSub = 'conversations'; paint();
  document.getElementById('tabBody').innerHTML = `
    <div class="subtabs">
      <div class="subtab active" data-s="conversations">Discussions clients</div>
      <div class="subtab" data-s="contacts">Demandes de contact</div>
    </div>
    <div id="msgBody"><div class="empty">Chargement…</div></div>
  `;
  [...document.querySelectorAll('.subtab')].forEach(t=> t.addEventListener('click', ()=>{ msgSub=t.dataset.s; paintSub(); loadSub(); }));
  await openConversation(convId, name);
}

}

let msgSub = 'conversations';
async function renderMessages(){

function paintSub(){ [...document.querySelectorAll('.subtab')].forEach(t=> t.classList.toggle('active', t.dataset.s===msgSub)); }
function loadSub(){ if(msgSub==='conversations') loadConversations(); else loadContacts(); }

async function loadConversations(){
  let convs, profs, unread;
  try{
    convs = await api('/rest/v1/conversations?select=*&order=created_at.desc');
    if(!convs.length){ document.getElementById('msgBody').innerHTML = '<div class="empty">Aucune discussion pour le moment.</div>'; return; }
    const ids = [...new Set(convs.map(c=>c.user_id))];
    profs = await api(`/rest/v1/profiles?select=id,full_name,email&id=in.(${ids.join(',')})`);
    unread = await api(`/rest/v1/messages?select=conversation_id&sender=eq.user&read=eq.false`);
  }catch(e){
    console.error(e);
    document.getElementById('msgBody').innerHTML = '<div class="empty">Impossible de charger les discussions. Réessaie.</div>';
    return;
  }
  const profById = Object.fromEntries(profs.map(p=>[p.id,p]));
  const unreadCount = {}; unread.forEach(m=> unreadCount[m.conversation_id] = (unreadCount[m.conversation_id]||0)+1);
  document.getElementById('msgBody').innerHTML = convs.map(c=>{
    const p = profById[c.user_id] || {};
    const n = unreadCount[c.id];
    return `<div class="card" onclick="openConversation('${c.id}','${escapeHtml(p.full_name||p.email||'Client').replace(/'/g,"\\'")}')">
      <h3>${escapeHtml(p.full_name || p.email || 'Client')} ${n?`<span class="badge">${n}</span>`:''}</h3>
      <p>${escapeHtml(p.email||'')}</p>
    </div>`;
  }).join('');
}
async function openConversation(convId, name){
  document.getElementById('msgBody').innerHTML = `
    <a class="backlink" onclick="loadConversations()">← Toutes les discussions</a>
    <h3 style="font-family:Inter; font-weight:700; margin-bottom:10px;">${escapeHtml(name)}</h3>
    <div class="chat-box"><div class="chat-msgs" id="cMsgs"><div class="empty">Chargement…</div></div>
      <div class="chat-input"><input id="cInput" type="text" placeholder="Répondre…" onkeydown="if(event.key==='Enter')sendCoachMsg('${convId}')"><button onclick="sendCoachMsg('${convId}')">Envoyer</button></div></div>
  `;
  await api(`/rest/v1/messages?conversation_id=eq.${convId}&sender=eq.user&read=eq.false`, { method:'PATCH', body: JSON.stringify({ read:true }) });
  const msgs = await api(`/rest/v1/messages?select=*&conversation_id=eq.${convId}&order=created_at`);
  document.getElementById('cMsgs').innerHTML = msgs.map(m=>`<div class="msg ${m.sender}">${escapeHtml(m.content)}</div>`).join('') || '<div class="empty">Pas encore de message.</div>';
  document.getElementById('cMsgs').scrollTop = 999999;
}
async function sendCoachMsg(convId){
  const input = document.getElementById('cInput'); const content = input.value.trim();
  if(!content) return; input.value='';
  const box = document.getElementById('cMsgs');
  const tmp = document.createElement('div');
  tmp.className = 'msg coach'; tmp.textContent = content;
  box.appendChild(tmp);
  box.scrollTop = 999999;
  try{
    await api('/rest/v1/messages', { method:'POST', body: JSON.stringify({ conversation_id: convId, sender:'coach', content }) });
    const msgs = await api(`/rest/v1/messages?select=*&conversation_id=eq.${convId}&order=created_at`);
    box.innerHTML = msgs.map(m=>`<div class="msg ${m.sender}">${escapeHtml(m.content)}</div>`).join('');
    box.scrollTop = 999999;
  }catch(e){
    tmp.style.opacity = '0.5';
    tmp.title = 'Échec de l\'envoi — réessaie.';
    input.value = content;
    alert("Le message n'a pas pu être envoyé. Réessaie.");
  }
}
async function loadContacts(){
  let reqs;
  try{
    reqs = await api('/rest/v1/coach_contact_requests?select=*&order=created_at.desc');
  }catch(e){
    console.error(e);
    document.getElementById('msgBody').innerHTML = '<div class="empty">Impossible de charger les demandes. Réessaie.</div>';

async function markContact(id){

let progsAll = [], progProfById = {}, progFilter = 'all';
// Origine d'un programme : official | coach | client | visitor | unknown
function progOrigin(p){
  if(p.is_official) return 'official';
  if(p.owner_guest_id && !p.owner_user_id) return 'visitor';
  if(!p.owner_user_id) return 'visitor';
  if(!p.created_by) return 'unknown';
  if(p.created_by === p.owner_user_id) return 'client';
  return 'coach';
}
function progOwnerName(p){
  const pr = progProfById[p.owner_user_id];
  return pr ? (pr.full_name || pr.email || 'Client') : 'Client';
}
function progOriginHtml(p){
  const o = progOrigin(p);
  const pill = (cls, txt) => `<span class="origin-pill ${cls}">${txt}</span>`;
  if(o === 'official') return pill('official', '⭐ Programme officiel') + '<span class="origin-for">visible par tous les visiteurs</span>';
  if(o === 'visitor') return pill('visitor', '👻 Créé par un visiteur');
  const O = escapeHtml(progOwnerName(p));
  if(o === 'client') return pill('client', `👤 Créé par ${O}`);
  if(o === 'coach') return pill('coach', '🧑‍🏫 Créé par toi') + `<span class="origin-for">pour ${O}</span>`;
  return pill('unknown', '❔ Créateur inconnu') + `<span class="origin-for">programme de ${O}</span>`;
}
function setProgFilter(f){ progFilter = f; paintProgList(); }
function paintProgList(){
  const counts = { all: progsAll.length };
  progsAll.forEach(p => { const o = progOrigin(p); counts[o] = (counts[o]||0) + 1; });
  const chips = [['all','Tous'],['official','Officiels'],['coach','Créés par moi'],['client','Clients'],['visitor','Visiteurs'],['unknown','Inconnus']]
    .filter(([k]) => k === 'all' || counts[k])
    .map(([k,l]) => `<button type="button" class="fchip ${progFilter===k?'active':''}" onclick="setProgFilter('${k}')">${l} <span>${counts[k]||0}</span></button>`).join('');
  const list = progFilter === 'all' ? progsAll : progsAll.filter(p => progOrigin(p) === progFilter);
  document.getElementById('progList').innerHTML = `<div class="fchips">${chips}</div>` + (list.length ? list.map(p=>`
    <div class="card">
      <div onclick="renderProgramForm('${p.id}')" style="cursor:pointer;">
        <div class="origin-row">${progOriginHtml(p)}</div>
        <h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p>
      </div>
      <div class="row-actions" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="duplicateProgram('${p.id}')">Dupliquer</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucun programme dans cette catégorie.</div>');
}
async function renderProgramsTab(){
  document.getElementById('tabBody').innerHTML = `
    <div class="row-actions"><button class="btn btn-accent" onclick="renderProgramForm()">+ Nouveau programme</button></div>
    <div id="progList" style="margin-top:16px;"><div class="empty">Chargement…</div></div>
  `;
  try{
    progsAll = await api('/rest/v1/programs?select=*&order=is_official.desc,created_at.desc');
    progProfById = {};
    const ids = [...new Set(progsAll.flatMap(p=>[p.owner_user_id, p.created_by]).filter(Boolean))];
    if(ids.length){
      const profs = await api(`/rest/v1/profiles?select=id,full_name,email,role&id=in.(${ids.join(',')})`);
      progProfById = Object.fromEntries(profs.map(p=>[p.id,p]));
    }
  }catch(e){
    console.error(e);
    document.getElementById('progList').innerHTML = '<div class="empty">Impossible de charger les programmes. Réessaie.</div>';
    return;
  }
  progFilter = 'all';
  paintProgList();
}

let draftItems = [];
let draftDays = ['Séance 1'];
let activeDayIdx = 0;

async function renderProgramForm(programId, prefill){
  let program = null;

  pfRepsMode = 'reps';
  if(programId){
    program = (await api(`/rest/v1/programs?select=*&id=eq.${programId}`))[0];
    const items = await api(`/rest/v1/program_exercises?select=*&program_id=eq.${programId}&order=order_index`);
    draftItems = items.map((it,i)=>({ exercise_id: it.exercise_id, sets: it.sets, reps: it.reps, rest_seconds: it.rest_seconds, day: it.day_label || 'Séance 1',
      linkPrev: i > 0 && it.superset_group != null && items[i-1].superset_group === it.superset_group && (items[i-1].day_label||'Séance 1') === (it.day_label||'Séance 1'),
      variant_id: it.variant_exercise_id || null }));
  } else if(prefill){
    program = { name: prefill.name, description: prefill.description, is_official: prefill.is_official, owner_user_id: prefill.owner_user_id };
    draftItems = prefill.items.map(it=>({ linkPrev:false, variant_id:null, ...it, day: it.day || 'Séance 1'}));
  }
  draftDays = [...new Set(draftItems.map(x=>x.day))];
  if(!draftDays.length) draftDays = ['Séance 1'];
  activeDayIdx = 0;
  const clients = await api('/rest/v1/profiles?select=id,full_name,email&role=eq.client&order=full_name');
  const clientOptions = clients.map(c=>`<option value="${c.id}" ${program?.owner_user_id===c.id?'selected':''}>${c.full_name||c.email}</option>`).join('');
  document.getElementById('tabBody').innerHTML = `
    <a class="backlink" onclick="renderProgramsTab()">← Tous les programmes</a>

      <div class="field"><label>Nom du programme</label><input id="pfName" value="${program?.name||''}"></div>
      <div class="field"><label>Description</label><textarea id="pfDesc">${program?.description||''}</textarea></div>
      <div class="field"><label>Destinataire</label>
        <select id="pfTarget">
          <option value="official" ${program?.is_official!==false?'selected':''}>Officiel — visible par tous les visiteurs</option>
          <option value="client" ${(program && !program.is_official)?'selected':''}>Un client en particulier</option>
        </select>
      </div>
      <div class="field" id="pfClientWrap" style="${(program && !program.is_official) ? '' : 'display:none;'}">
        <label>Client</label><select id="pfClient">${clientOptions}</select>
      </div>
      <div class="row-actions">
        <button class="btn btn-accent" id="pfSaveBtn" onclick="saveProgramForm('${programId||''}')">${programId?'Enregistrer':'Créer le programme'}</button>
        ${programId ? `<button class="btn btn-danger" onclick="deleteProgramForm('${programId}')">Supprimer le programme</button>` : ''}
      </div>
    </div>
    <div class="panel">
      <h3 style="font-family:Inter; font-weight:700; font-size:15px; margin-bottom:4px;">Séances</h3>
      <p class="empty" style="padding:0 0 4px; text-align:left;">Un programme peut contenir plusieurs séances : la personne choisit celle qu'elle veut faire.</p>
      <div id="pfDayTabs" class="day-tabs"></div>
      <div class="row-actions" style="margin-bottom:12px;">
        <button class="btn btn-ghost btn-sm" type="button" onclick="renameDay()">✏️ Renommer</button>
        <button class="btn btn-ghost btn-sm" type="button" onclick="deleteDay()">🗑 Supprimer cette séance</button>
      </div>
      <h3 id="pfDayTitle" style="font-family:Inter; font-weight:700; font-size:15px; margin-bottom:8px;">Exercices</h3>
      <div id="pfExList"></div>
      <div class="field"><label>Chercher un exercice</label><input id="pfSearch" type="text" placeholder="Nom, catégorie, muscle…" oninput="filterExPicker()"></div>
      <input type="hidden" id="pfPickEx" value="">
      <div id="pfPickGrid" class="pick-ex-grid"></div>
      <div class="picker" style="flex-wrap:wrap;">
        <button class="btn btn-ghost" type="button" onclick="newExerciseFromBuilder()" title="Créer une nouvelle fiche exercice sans quitter le programme">➕ Nouvelle fiche</button>
        <button class="btn btn-ghost" type="button" onclick="editSelectedPickerEx()" title="Modifier la fiche de l'exercice sélectionné">✏️ Modifier la fiche</button>
        <div class="pf-field"><label for="pfSets">Séries</label><input id="pfSets" type="number" placeholder="Séries" value="3" style="width:70px;"></div>

    </div>

// Image(s) d'un exercice (animée si départ + position finale existent)
function pickImgTag(ex){
  const a = ex.image_start_url, b = ex.image_peak_url || ex.image_url;
  if(a && b && a!==b) return `<img class="pick-ex-img anim-img" data-a="${a}" data-b="${b}" data-t="0" src="${a}" alt="" loading="lazy" onerror="this.classList.remove('anim-img'); this.remove();">`;
  const single = b || a;
  return single ? `<img class="pick-ex-img" src="${single}" alt="" loading="lazy" onerror="this.remove()">` : '';
}
setInterval(()=>{
  document.querySelectorAll('.anim-img').forEach(img=>{
    const t = img.dataset.t === '0' ? '1' : '0';
    img.dataset.t = t;
    img.src = t === '0' ? img.dataset.a : img.dataset.b;
  });
}, 700);
function selectPickEx(exId){
  const h = document.getElementById('pfPickEx'); if(h) h.value = exId;
  [...document.querySelectorAll('#pfPickGrid .pick-ex-card')].forEach(c=> c.classList.toggle('selected', c.dataset.id===exId));
}
function filterExPicker(){
  const grid = document.getElementById('pfPickGrid');
  if(!grid) return;
  const q = (document.getElementById('pfSearch').value || '').trim().fold();
  const matches = !q ? exercises : exercises.filter(e=>
    (e.name||'').fold().includes(q)
    || (e.category||'').fold().includes(q)
    || (e.primary_muscles||[]).some(m=>(m||'').fold().includes(q))
    || (e.secondary_muscles||[]).some(m=>(m||'').fold().includes(q))
  );
  const selected = document.getElementById('pfPickEx').value;
  grid.innerHTML = matches.length ? matches.map(e=>`
    <button type="button" class="pick-ex-card ${e.id===selected?'selected':''}" data-id="${e.id}" onclick="selectPickEx('${e.id}')">
      ${pickImgTag(e) || '<span class="pick-ex-noimg">'+escapeHtml(e.category||'')+'</span>'}
      <span>${escapeHtml(e.name)}</span>
    </button>`).join('') : '<div class="empty" style="grid-column:1/-1;padding:20px 0;">Aucun résultat.</div>';
}
function editSelectedPickerEx(){
  const exId = document.getElementById('pfPickEx').value;
  if(!exId){ toast('Choisis une fiche à modifier'); return; }
  openExerciseModal(exId);
}

function renderDayTabs(){
  const box = document.getElementById('pfDayTabs');
  if(!box) return;
  box.innerHTML = draftDays.map((d,i)=>{
    const n = draftItems.filter(x=>x.day===d).length;
    return `<button type="button" class="day-chip ${i===activeDayIdx?'active':''}" onclick="selectDay(${i})">${escapeHtml(d)} (${n})</button>`;
  }).join('') + `<button type="button" class="day-chip add" onclick="addDay()">+ Séance</button>`;
}
function selectDay(i){ activeDayIdx = i; renderDraftList(); }
function addDay(){
  let n = draftDays.length + 1, name = `Séance ${n}`;
  while(draftDays.includes(name)){ n++; name = `Séance ${n}`; }
  draftDays.push(name);
  activeDayIdx = draftDays.length - 1;
  renderDraftList();
}
function renameDay(){
  const old = draftDays[activeDayIdx];
  const val = prompt('Nom de la séance :', old);
  if(val === null) return;
  const name = val.trim();
  if(!name){ toast('Le nom ne peut pas être vide'); return; }
  if(name !== old && draftDays.includes(name)){ toast('Une séance porte déjà ce nom'); return; }
  draftItems.forEach(x=>{ if(x.day===old) x.day = name; });
  draftDays[activeDayIdx] = name;
  renderDraftList();
}
function deleteDay(){
  if(draftDays.length <= 1){ toast('Un programme doit avoir au moins une séance'); return; }
  const name = draftDays[activeDayIdx];
  const n = draftItems.filter(x=>x.day===name).length;
  if(!confirm(n ? `Supprimer « ${name} » et ses ${n} exercice${n>1?'s':''} ?` : `Supprimer « ${name} » ?`)) return;
  draftItems = draftItems.filter(x=>x.day!==name);
  draftDays.splice(activeDayIdx,1);
  activeDayIdx = Math.max(0, activeDayIdx-1);
  renderDraftList();
}
function renderDraftList(){
  renderDayTabs();
  const day = draftDays[activeDayIdx];
  const title = document.getElementById('pfDayTitle');
  if(title) title.textContent = draftDays.length > 1 ? `Exercices de « ${day} »` : 'Exercices';
  const rows = draftItems.map((it,i)=>({it,i})).filter(x=>x.it.day===day);
  const tags = []; let letter = -1, pos = 0;
  rows.forEach(({it},idx)=>{
    const next = rows[idx+1];
    const inChain = (idx > 0 && it.linkPrev) || (next && next.it.linkPrev);
    if(!inChain){ tags.push(null); return; }
    if(idx > 0 && it.linkPrev){ pos++; } else { letter++; pos = 1; }
    tags.push(String.fromCharCode(65+letter) + pos);
  });
  document.getElementById('pfExList').innerHTML = rows.length ? rows.map(({it,i},idx)=>{
    const ex = exercisesById[it.exercise_id];
    const vex = it.variant_id ? exercisesById[it.variant_id] : null;
    return `<div class="ex-mini ${tags[idx]?'in-ss':''}">
      <span>${tags[idx]?`<span class="ss-chip">SUPERSET ${tags[idx]}</span> `:''}${escapeHtml(ex?ex.name:'Exercice')} — ${it.sets||'-'}×${escapeHtml(it.reps||'-')} (repos ${it.rest_seconds||'-'}s)
        ${vex?`<div class="draft-var">↔ Variante : ${escapeHtml(vex.name)} <button type="button" class="rm-var" title="Retirer la variante" onclick="clearVariant(${i})">✕</button></div>`:''}</span>
      <span style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        <button onclick="openExerciseModal('${it.exercise_id}')" title="Modifier la fiche">✏️</button>
        <button onclick="moveDraft(${i},-1)" title="Monter">↑</button>
        <button onclick="moveDraft(${i},1)" title="Descendre">↓</button>
        <button class="${it.linkPrev?'on':''}" ${idx>0?'':'disabled'} onclick="toggleLink(${i})" title="Enchaîner avec l'exercice du dessus (superset)">🔗</button>
        <button onclick="setVariant(${i})" title="Variante : utilise l'exercice sélectionné dans la grille">↔</button>
        <button onclick="removeDraftEx(${i})" title="Retirer">✕</button>
      </span>
    </div>`;
  }).join('') + `<p class="empty" style="padding:8px 0 0;text-align:left;">🔗 enchaîne avec l'exercice du dessus (superset) · ↔ ajoute comme variante l'exercice sélectionné dans la grille</p>` : '<div class="empty">Aucun exercice pour l\'instant — ajoute-en un ci-dessous.</div>';
}
function toggleLink(i){
  const day = draftItems[i].day;
  if(!draftItems.slice(0,i).some(x=>x.day===day)){ toast('Il faut un exercice au-dessus pour créer un superset'); return; }
  draftItems[i].linkPrev = !draftItems[i].linkPrev;
  renderDraftList();
}
function setVariant(i){
  const exId = document.getElementById('pfPickEx').value;
  if(!exId){ toast('Choisis d\'abord l\'exercice variante dans la grille'); return; }
  if(exId === draftItems[i].exercise_id){ toast('La variante doit être un autre exercice'); return; }
  draftItems[i].variant_id = exId;
  renderDraftList();
}
function clearVariant(i){ draftItems[i].variant_id = null; renderDraftList(); }
let pfRepsMode = 'reps';
function setPfRepsMode(mode){
  pfRepsMode = mode;
  [...document.querySelectorAll('.reps-mode-btn')].forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
  const repsInput = document.getElementById('pfReps');
  if(mode==='time'){ repsInput.type='number'; repsInput.placeholder='Secondes'; repsInput.value=''; }
  else { repsInput.type='text'; repsInput.placeholder='Reps'; repsInput.value='10-12'; }
}
function addDraftEx(){
  const exId = document.getElementById('pfPickEx').value;
  if(!exId){ toast('Choisis un exercice'); return; }
  const sets = parseInt(document.getElementById('pfSets').value)||3;
  const repsRaw = document.getElementById('pfReps').value.trim();
  const reps = pfRepsMode==='time' ? `${repsRaw || '30'}s` : (repsRaw || '10-12');
  const rest = parseInt(document.getElementById('pfRest').value)||90;
  draftItems.push({ exercise_id: exId, sets, reps, rest_seconds: rest, day: draftDays[activeDayIdx], linkPrev: false, variant_id: null });
  renderDraftList();
}
function moveDraft(i, dir){
  // on échange avec le voisin le plus proche appartenant à la même séance
  let j = i+dir;
  while(j>=0 && j<draftItems.length && draftItems[j].day !== draftItems[i].day) j += dir;
  if(j<0 || j>=draftItems.length) return;
  const tmp = draftItems[i]; draftItems[i] = draftItems[j]; draftItems[j] = tmp;
  draftItems[i].linkPrev = false; draftItems[j].linkPrev = false; // à relier ensuite si besoin
  renderDraftList();
}
function removeDraftEx(i){
  const ex = exercisesById[draftItems[i]?.exercise_id];
  if(!confirm(`Retirer "${ex?ex.name:'cet exercice'}" du programme ?`)) return;
  draftItems.splice(i,1);
  renderDraftList();
}

async function saveProgramForm(programId){
  const name = document.getElementById('pfName').value.trim();
  const desc = document.getElementById('pfDesc').value.trim();
  const target = document.getElementById('pfTarget').value;
  const clientId = target==='client' ? document.getElementById('pfClient').value : null;
  if(!name){ toast('Donne un nom au programme'); return; }
  if(!draftItems.length){ toast('Ajoute au moins un exercice à la liste'); return; }
  const emptyDay = draftDays.find(d=> !draftItems.some(x=>x.day===d));
  if(emptyDay){ toast(`« ${emptyDay} » est vide : ajoute-y un exercice ou supprime-la`); return; }
  const btn = document.getElementById('pfSaveBtn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Enregistrement...'; }
  try{
    const body = { name, description: desc||null, is_official: target==='official', owner_user_id: clientId };
    let pid = programId;
    if(pid){
      await api(`/rest/v1/programs?id=eq.${pid}`, { method:'PATCH', body: JSON.stringify(body) });
      await api(`/rest/v1/program_exercises?program_id=eq.${pid}`, { method:'DELETE' });
    } else {
      const created = await api('/rest/v1/programs', { method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify(body) });
      pid = created[0].id;
    }
    const single = draftDays.length === 1;
    const ordered = [];
    let gid = 0;
    draftDays.forEach(day=> draftItems.filter(x=>x.day===day).forEach((x,idx)=>{
      const item = { ...x, day_label: single ? null : day, superset_group: null };
      if(idx > 0 && x.linkPrev){
        const prev = ordered[ordered.length-1];
        if(prev.superset_group == null){ gid++; prev.superset_group = gid; }
        item.superset_group = prev.superset_group;
      }
      ordered.push(item);
    }));
    const rows = ordered.map((it,i)=>({ program_id: pid, exercise_id: it.exercise_id, order_index: i+1, sets: it.sets, reps: it.reps, rest_seconds: it.rest_seconds, day_label: it.day_label, superset_group: it.superset_group, variant_exercise_id: it.variant_id || null }));
    await api('/rest/v1/program_exercises', { method:'POST', body: JSON.stringify(rows) });
    toast(programId ? 'Programme mis à jour' : 'Programme créé');
    renderProgramForm(pid);
  }catch(e){
    console.error(e);
    toast('Erreur, impossible d\'enregistrer. Réessaie.');
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}
async function deleteProgramForm(programId){
  if(!confirm('Supprimer ce programme ?')) return;
  await api(`/rest/v1/programs?id=eq.${programId}`, { method:'DELETE' });
  toast('Programme supprimé'); renderProgramsTab();
}
async function duplicateProgram(programId){
  const program = (await api(`/rest/v1/programs?select=*&id=eq.${programId}`))[0];
  const items = await api(`/rest/v1/program_exercises?select=*&program_id=eq.${programId}&order=order_index`);
  renderProgramForm(null, {
    name: program.name,
    description: program.description,
    is_official: program.is_official,
    owner_user_id: program.owner_user_id,
    items: items.map((it,i)=>({ exercise_id: it.exercise_id, sets: it.sets, reps: it.reps, rest_seconds: it.rest_seconds, day: it.day_label || 'Séance 1', variant_id: it.variant_exercise_id || null,
      linkPrev: i > 0 && it.superset_group != null && items[i-1].superset_group === it.superset_group && (items[i-1].day_label||'Séance 1') === (it.day_label||'Séance 1') }))
  });
}

// ================= EXERCICES =================
let exSearchQ = '';
async function renderExercisesTab(){
  document.getElementById('tabBody').innerHTML = `
    <div class="row-actions"><button class="btn btn-accent" onclick="openExerciseModal()">+ Nouvel exercice</button></div>
    <div class="field" style="margin-top:12px;"><label>Chercher une fiche</label><input id="exSearch" type="text" placeholder="Nom, categorie, muscle..." value="${exSearchQ.replace(/"/g,'&quot;')}" oninput="filterExercisesTab(this.value)"></div>
    <div id="exList" style="margin-top:16px;"></div>
  `;
  filterExercisesTab(exSearchQ);
  document.getElementById('exSearch').focus();
}
function filterExercisesTab(q){
  exSearchQ = q || '';
  const qq = exSearchQ.trim().fold();
  const list = !qq ? exercises : exercises.filter(e=>
    (e.name||'').fold().includes(qq)
    || (e.category||'').fold().includes(qq)
    || (e.short_description||'').fold().includes(qq)
    || (e.primary_muscles||[]).some(m=>(m||'').fold().includes(qq))
    || (e.secondary_muscles||[]).some(m=>(m||'').fold().includes(qq))
  );
  renderExList(list);
}
// Miniature d'un exercice (animée si image de départ + position finale)
function listThumbTag(ex){
  const a = ex.image_start_url, b = ex.image_peak_url || ex.image_url;
  if(a && b && a!==b) return `<img class="anim-img" data-a="${a}" data-b="${b}" data-t="0" src="${a}" alt="" loading="lazy" onerror="this.classList.remove('anim-img'); this.remove();">`;
  const single = b || a;
  return single ? `<img src="${single}" alt="" loading="lazy" onerror="this.remove()">` : '';
}
function renderExList(list){
  const box = document.getElementById('exList');
  if(!box) return;
  box.innerHTML = list.length ? list.map(e=>`
    <div class="card ex-card" onclick="openExerciseModal('${e.id}')">
      <div class="ex-thumb">${listThumbTag(e) || `<span class="ex-thumb-empty">${escapeHtml(e.category||'')}</span>`}</div>
      <div class="ex-card-text"><div class="tag">${escapeHtml(e.category||'')}</div><h3>${escapeHtml(e.name||'')}</h3><p>${escapeHtml(e.short_description||'')}</p></div>
    </div>
  `).join('') : '<div class="empty">Aucune fiche ne correspond a cette recherche.</div>';
}
function exerciseFormHtml(exId){
  const ex = exId ? exercisesById[exId] : null;
  return `
    <div class="field"><label>Nom</label><input id="efName" value="${(ex?.name||'').replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>Categorie</label>
      <select id="efCat">${["Jambes","Dos","Pectoraux","Épaules","Bras","Abdos"].map(c=>`<option ${ex?.category===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Description courte</label><input id="efShort" value="${(ex?.short_description||'').replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>Image (URL)</label><input id="efImg" value="${(ex?.image_url||'').replace(/"/g,'&quot;')}" placeholder="https://...">
      ${ex?.image_url?`<img src="${ex.image_url}" style="width:100%;max-width:220px;border-radius:8px;margin-top:8px;" onerror="this.style.display='none'">`:''}
    </div>
    <div class="field"><label>Consigne</label><textarea id="efInstr">${ex?.instructions||''}</textarea></div>
    <div class="field"><label>Points techniques (un par ligne)</label><textarea id="efPoints">${(ex?.technique_points||[]).join('\n')}</textarea></div>
    <div class="row-actions">
      <button class="btn btn-accent" onclick="saveExercise('${exId||''}')">${exId?'Enregistrer':'Creer la fiche'}</button>
      ${exId?`<button class="btn btn-danger" onclick="deleteExercise('${exId}')">Supprimer</button>`:''}
      <button class="btn btn-ghost" onclick="closeExerciseModal()">Annuler</button>
    </div>
  `;
}
function newExerciseFromBuilder(){
  openExerciseModal();
  // pré-remplit le nom avec ce qui a été tapé dans la recherche (si aucun exercice ne correspondait)
  const q = (document.getElementById('pfSearch')?.value || '').trim();
  const n = document.getElementById('efName');
  if(n && q) n.value = q;
}
function openExerciseModal(exId){
  document.getElementById('exModalTitle').textContent = exId ? 'Modifier la fiche' : 'Nouvelle fiche';
  document.getElementById('exModalBody').innerHTML = exerciseFormHtml(exId);
  document.getElementById('exModalOverlay').classList.add('open');
}
function closeExerciseModal(){
  document.getElementById('exModalOverlay').classList.remove('open');
}
async function saveExercise(exId){
  const name = document.getElementById('efName').value.trim();
  if(!name){ toast('Nom requis'); return; }
  const slug = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  const body = {
    name, slug, category: document.getElementById('efCat').value,
    short_description: document.getElementById('efShort').value.trim(),
    image_url: document.getElementById('efImg').value.trim() || null,
    instructions: document.getElementById('efInstr').value.trim(),
    technique_points: document.getElementById('efPoints').value.split('\n').map(s=>s.trim()).filter(Boolean)
  };
  let savedId = exId;
  try{
    if(exId){
      await api(`/rest/v1/exercises?id=eq.${exId}`, { method:'PATCH', body: JSON.stringify(body) });
    } else {
      const created = await api('/rest/v1/exercises', { method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify(body) });
      savedId = created[0].id;
    }
  }catch(e){ toast("Impossible d'enregistrer la fiche."); return; }
  toast('Fiche enregistrée');
  exercises = await api('/rest/v1/exercises?select=*&order=category,name');
  exercisesById = Object.fromEntries(exercises.map(e=>[e.id,e]));
  closeExerciseModal();
  if(document.getElementById('exList')) filterExercisesTab(exSearchQ);
  if(document.getElementById('pfPickEx')){
    if(savedId){
      document.getElementById('pfPickEx').value = savedId;
      if(!exId){ const ps = document.getElementById('pfSearch'); if(ps) ps.value = ''; }
    }
    filterExPicker();
    if(savedId && !exId) document.querySelector(`#pfPickGrid .pick-ex-card[data-id="${savedId}"]`)?.scrollIntoView({block:'center'});
    renderDraftList();
  }
}
async function deleteExercise(exId){
  if(!confirm('Supprimer cette fiche ? (impossible si elle est utilisée dans un programme)')) return;
  try{
    await api(`/rest/v1/exercises?id=eq.${exId}`, { method:'DELETE' });
    toast('Fiche supprimée');
    exercises = exercises.filter(e=>e.id!==exId); exercisesById = Object.fromEntries(exercises.map(e=>[e.id,e]));
    closeExerciseModal();
    if(document.getElementById('exList')) filterExercisesTab(exSearchQ);
    if(document.getElementById('pfPickEx')){ if(document.getElementById('pfPickEx').value===exId) document.getElementById('pfPickEx').value=''; filterExPicker(); renderDraftList(); }
  }catch(e){ toast('Cette fiche est utilisée dans un programme, retire-la d\'abord.'); }
}

function showFatal(msg){
  app.innerHTML = '<div class="center-msg"><h1>Oups</h1><p>Une erreur empêche l\'affichage de l\'espace admin.</p><p style="font-size:12px;word-break:break-word;">'+String(msg)+'</p><div class="row-actions" style="justify-content:center;"><a class="btn btn-accent" href="compte.html">Retour à Mon compte</a></div></div>';
}
window.addEventListener('unhandledrejection', e=> showFatal(e.reason && e.reason.message ? e.reason.message : e.reason));
window.addEventListener('error', e=> showFatal(e.message));
boot().catch(showFatal);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(function(){
  const KEY = 'hs_install_dismissed_v1';
  if (localStorage.getItem(KEY)) return;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;

  function showBanner(html, onInstall){
    const bar = document.createElement('div');
    bar.className = 'install-banner show';
    bar.innerHTML = html;
    document.body.appendChild(bar);
    document.body.classList.add('has-install-banner');
    const closeBtn = bar.querySelector('.installClose');
    if (closeBtn) closeBtn.addEventListener('click', ()=>{ localStorage.setItem(KEY,'1'); bar.remove(); document.body.classList.remove('has-install-banner'); });
    const installBtn = bar.querySelector('.installGo');
    if (installBtn && onInstall) installBtn.addEventListener('click', onInstall);
  }

  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (isIos) {
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isSafari) {
      showBanner(`
        <p>Installe cette app sur ton écran d'accueil : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);
    }
  } else {
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      deferredPrompt = e;
      showBanner(`
        <p>Installe HS Coaching sur ton appareil pour un accès rapide, même hors-ligne.</p>
        <div class="btn-row">
          <button class="installGo" style="background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;">Installer</button>
          <button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
      `, async ()=>{
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        localStorage.setItem(KEY,'1');
        const el = document.querySelector('.install-banner'); if (el) el.remove();
        document.body.classList.remove('has-install-banner');
      });
    });
  }
})();
</script>
