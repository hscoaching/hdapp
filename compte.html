function getDeviceToken(){
  let t = localStorage.getItem('hs_device_token');
  if(!t){ t = crypto.randomUUID(); localStorage.setItem('hs_device_token', t); }
  return t;
}
function getSession(){
  try{ return JSON.parse(localStorage.getItem('hs_session') || 'null'); }catch(e){ return null; }
}
function setSession(s){ localStorage.setItem('hs_session', JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem('hs_session'); localStorage.removeItem('hs_role'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function authFetch(path, opts={}){
  return fetch(`${SUPABASE_URL}${path}`, {
    cache: 'no-store',
    ...opts,
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
}
async function refreshIfNeeded(){
  const s = getSession();
  if(!s || !s.refresh_token) return;
  const exp = (s.expires_at || 0) * 1000;
  if(exp && Date.now() < exp - 60000) return;
  try{
    const res = await authFetch('/auth/v1/token?grant_type=refresh_token', { method:'POST', body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const data = await res.json();
    if(res.ok && data.access_token) setSession(data); else clearSession();
  }catch(e){}
}
async function apiFetch(path, opts={}){
  await refreshIfNeeded();
  const s = getSession();
  return fetch(`${SUPABASE_URL}${path}`, {
    cache: 'no-store',
    ...opts,
    headers: { apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${s?.access_token}`, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
}
async function rpcAuth(fn, params){
  const res = await apiFetch(`/rest/v1/rpc/${fn}`, { method:'POST', body: JSON.stringify(params) });
  if(!res.ok) return Promise.reject(await res.text());
  const txt = await res.text(); try{ return txt ? JSON.parse(txt) : null; }catch(e){ return null; }
}

function renderForgotPassword(){

  app.innerHTML = `
    <div class="eyebrow">MON COMPTE</div>

async function submitForgotPassword(){
  const email = document.getElementById('fpEmail').value.trim();
  const errEl = document.getElementById('fpError');

  try{
    const res = await authFetch(`/auth/v1/recover`, { method:'POST', body: JSON.stringify({ email, redirect_to: location.origin + location.pathname }) });
    if(!res.ok){ const data = await res.json().catch(()=>({})); throw new Error(data.error_description || data.msg || 'Erreur lors de l\'envoi.'); }

// ---------- Transfert d'une personne « sans appli » vers son vrai compte ----------
let TRF = null;
async function openTransfer(name){
  const sessions = HIST.filter(s => histWho(s) === name);
  if(!sessions.length) return;
  const groups = [], idx = {};
  sessions.forEach(s => { const k = s.program_id || '_none'; if(idx[k] == null){ idx[k] = groups.length; groups.push({ k, pid: s.program_id || null, name: (s.programs && s.programs.name) || 'Séance libre', items: [] }); } groups[idx[k]].items.push(s); });
  TRF = { name, groups, clients: [] };
  const ov = document.createElement('div'); ov.id = 'trfOv';
  ov.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.onclick = e => { if(e.target === ov) closeTransfer(); };
  ov.innerHTML = '<div style="max-width:520px;width:100%;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);padding:18px;"><div class="empty">Chargement…</div></div>';
  document.body.appendChild(ov);
  try{
    const r = await apiFetch('/rest/v1/profiles?select=id,full_name,email,role&role=in.(client,coach,admin)&order=full_name');
    TRF.clients = r.ok ? await r.json() : [];
  }catch(e){ TRF.clients = []; }
  const myId = getSession().user.id;
  TRF.clients = (TRF.clients || []).filter(p => p.id !== myId && (p.role === 'client' || window.__isAdmin));
  const optOf = p => `<option value="${p.id}">${escapeHtml(p.full_name || p.email || 'Sans nom')}${p.email && p.full_name ? ' — ' + escapeHtml(p.email) : ''}</option>`;
  const cl = TRF.clients.filter(p => p.role === 'client'), co = TRF.clients.filter(p => p.role !== 'client');
  const opts = co.length ? `<optgroup label="Clients">${cl.map(optOf).join('')}</optgroup><optgroup label="Coachs">${co.map(optOf).join('')}</optgroup>` : cl.map(optOf).join('');
  const dt = s => s.date_unknown ? 'Date ?' : new Date(s.started_at).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
  const grp = groups.map((g, gi) => `<div style="border:1px solid var(--line);padding:10px 12px;margin-bottom:10px;">
      <label style="display:flex;gap:10px;align-items:center;cursor:pointer;"><input type="checkbox" id="trfG${gi}" checked onchange="trfGroup(${gi},this.checked)" style="width:20px;height:20px;"><span><b>${escapeHtml(g.name)}</b><br><span style="font-size:12px;color:var(--ink-muted)">${g.items.length} séance${g.items.length > 1 ? 's' : ''}${g.pid ? ' · le programme suit' : ''}</span></span></label>
      <details style="margin-top:8px;"><summary style="font-size:12.5px;color:var(--ink-muted);cursor:pointer;">Choisir les séances une par une</summary>
        ${g.items.map(s => `<label style="display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;cursor:pointer;"><input type="checkbox" class="trfS" data-g="${gi}" value="${s.id}" checked onchange="trfCount()" style="width:18px;height:18px;">${escapeHtml(dt(s))} · ${escapeHtml(s.day_label || 'Séance')}</label>`).join('')}
      </details></div>`).join('');
  ov.firstElementChild.innerHTML = `<h2 style="margin:0 0 6px;font-size:19px;">Transférer ${escapeHtml(name)}</h2>
    <p id="trfHelp" style="margin:0 0 12px;font-size:13px;color:var(--ink-muted);line-height:1.45;"></p>
    ${TRF.clients.length ? `<label style="font-size:12px;color:var(--ink-muted);">Compte qui reçoit</label><select id="trfTo" onchange="trfHelp()" style="width:100%;margin:4px 0 14px;padding:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-size:14px;">${opts}</select>` : '<div class="empty" style="margin-bottom:14px;">Aucun compte client à toi pour le moment. Elle doit d\'abord créer son compte et être rattachée à toi.</div>'}
    <div style="display:flex;gap:8px;margin-bottom:12px;"><label style="flex:1;display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);cursor:pointer;font-size:13.5px;"><input type="radio" name="trfMode" value="move" checked onchange="trfHelp()"> Déplacer</label><label style="flex:1;display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);cursor:pointer;font-size:13.5px;"><input type="radio" name="trfMode" value="copy" onchange="trfHelp()"> Copier</label></div>
    ${grp}
    <div id="trfMsg" style="font-size:13px;margin:4px 0 12px;min-height:18px;"></div>
    <div style="display:flex;gap:8px;"><button type="button" class="btn btn-ghost" style="flex:1;margin:0;" onclick="closeTransfer()">Annuler</button><button type="button" class="btn btn-primary" id="trfGo" style="flex:2;margin:0;" onclick="doTransfer()" ${TRF.clients.length ? '' : 'disabled'}>Transférer</button></div>`;
  trfCount(); trfHelp();
}
function trfMode(){ const r = document.querySelector('input[name=trfMode]:checked'); return r ? r.value : 'move'; }
function trfIsCoach(){ const sel = document.getElementById('trfTo'); const p = sel && TRF.clients.find(x => x.id === sel.value); return !!p && p.role !== 'client'; }
function trfHelp(){
  const h = document.getElementById('trfHelp'); if(!h || !TRF) return;
  const coach = trfIsCoach(), copy = trfMode() === 'copy';
  h.textContent = (copy ? 'Le compte choisi reçoit une copie, tu gardes tes séances. ' : 'Les séances cochées et leurs programmes passent sur le compte choisi et disparaissent de ton historique. ') + (coach ? 'Chez un coach, elles restent rangées au nom de ' + TRF.name + ' pour qu\'il retrouve ses anciens entraînements.' : 'Elles comptent pour son historique et son rang, pas pour ses badges de régularité.');
  trfCount();
}
function closeTransfer(){ const o = document.getElementById('trfOv'); if(o) o.remove(); TRF = null; }
function trfGroup(gi, on){ document.querySelectorAll(`.trfS[data-g="${gi}"]`).forEach(x => x.checked = on); trfCount(); }
function trfCount(){
  const n = document.querySelectorAll('.trfS:checked').length, b = document.getElementById('trfGo');
  if(!b) return; b.textContent = n ? `${trfMode() === 'copy' ? 'Copier' : 'Transférer'} ${n} séance${n > 1 ? 's' : ''}` : 'Rien de coché'; b.disabled = !n || !TRF.clients.length;
  TRF.groups.forEach((g, gi) => { const all = document.querySelectorAll(`.trfS[data-g="${gi}"]`), on = document.querySelectorAll(`.trfS[data-g="${gi}"]:checked`); const cb = document.getElementById('trfG' + gi); if(cb){ cb.checked = on.length === all.length; cb.indeterminate = on.length > 0 && on.length < all.length; } });
}
async function doTransfer(){
  if(!TRF) return;
  const to = document.getElementById('trfTo').value, who = document.getElementById('trfTo').selectedOptions[0].textContent.split(' — ')[0];
  const sids = [...document.querySelectorAll('.trfS:checked')].map(x => x.value);
  const pids = [...new Set(TRF.groups.filter((g, gi) => g.pid && document.getElementById('trfG' + gi).checked).map(g => g.pid))];
  if(!sids.length) return;
  const copy = trfMode() === 'copy';
  if(!confirm(`${copy ? 'Copier' : 'Transférer'} ${sids.length} séance${sids.length > 1 ? 's' : ''}${pids.length ? ' et ' + pids.length + ' programme' + (pids.length > 1 ? 's' : '') : ''} vers le compte de ${who} ?\n\n${copy ? 'Tu gardes tes séances.' : 'Elles disparaîtront de ton historique. Cette action ne peut pas être annulée d\'un clic.'}`)) return;
  const b = document.getElementById('trfGo'), m = document.getElementById('trfMsg'); b.disabled = true; b.textContent = 'Transfert…'; m.textContent = '';
  try{
    const r = await rpcAuth('transfer_to_client', { p_to: to, p_session_ids: sids, p_program_ids: pids, p_mode: copy ? 'copy' : 'move' });
    closeTransfer();
    if(window.HSHistory && HSHistory.toast) HSHistory.toast(`${r && r.sessions != null ? r.sessions : sids.length} séance(s) ${copy ? 'copiée(s) chez' : 'transférée(s) à'} ${who} ✓`);
    loadHistorique();
  }catch(e){
    const t = String(e || '');
    m.style.color = '#e5806f';
    m.textContent = /PGRST202|Could not find the function|404/.test(t) ? "Le script SQL « add-transfert2.sql » n'a pas encore été lancé dans Supabase." : (/interdit/.test(t) ? "Ce compte n'est pas un de tes clients." : 'Impossible de transférer pour le moment. Réessaie.');
    b.disabled = false; trfCount();
  }
}

}
function askEditSession(id){

const EDITNOW = new Set();
function isEditing(s){ return !!s.edit_unlocked || (window.__isAdmin && EDITNOW.has(s.id)); }
function startAdminEdit(id){ EDITNOW.add(id); const c = document.querySelector(`.card[data-sid="${id}"]`) || [...document.querySelectorAll('.card')].find(x => (x.getAttribute('onclick')||'').includes(id)); if(c) reloadSessionLogs(c.querySelector('.logs'), id); }
function stopAdminEdit(id){ EDITNOW.delete(id); const c = [...document.querySelectorAll('.card')].find(x => (x.getAttribute('onclick')||'').includes(id)); if(c) reloadSessionLogs(c.querySelector('.logs'), id); }
function histEditHtml(s){
  if(window.__isAdmin){
    return EDITNOW.has(s.id)
      ? `<button type="button" class="btn btn-accent btn-block" style="margin-top:12px;" onclick="stopAdminEdit('${s.id}')">Terminer les modifications</button>`
      : `<button type="button" class="btn btn-ghost" style="margin-top:12px;" onclick="startAdminEdit('${s.id}')">✏️ Modifier la séance</button>`;
  }
  const r = HISTREQ[s.id];
  if(s.edit_unlocked) return `<div style="border:1px solid var(--accent); border-radius:10px; padding:12px; margin-top:12px; font-size:13.5px;">✏️ Ton coach a autorisé la modification. Corrige tes séries puis valide.<button type="button" class="btn btn-accent btn-block" style="margin-top:10px;" onclick="finishEditSession('${s.id}')">Terminer les modifications</button></div>`;
  if(r && r.status === 'pending') return `<div style="font-size:13px; color:var(--ink-muted); margin-top:12px;">⏳ Demande de modification envoyée, en attente de ton coach.</div>`;
  const note = r && r.status === 'rejected' ? `<div style="font-size:13px; color:var(--ink-muted); margin-top:12px;">Ta dernière demande a été refusée par ton coach.</div>` : '';
  return note + `<button type="button" class="btn btn-ghost" style="margin-top:12px;" onclick="askEditSession('${s.id}')">✏️ Demander une modification</button>`;
}

async function saveLogEdit(inp){

function reloadSessionLogs(btn, sid){
  const card = btn.closest('.card'); if(!card) return;
  const box = card.querySelector('.logs'); box.style.display = 'none'; toggleSessionLogs(card, sid);
}
async function addLogSet(btn){
  const ex = btn.dataset.ex, sid = btn.dataset.sid;
  const rows = [...btn.parentElement.querySelectorAll('.edit-row')].filter(r => r.dataset.ex === ex);
  if(!rows.length) return;
  const last = rows.reduce((m, r) => (+r.dataset.set > +m.dataset.set ? r : m), rows[0]);
  const num = v => v === '' || v == null ? null : Number(v);
  btn.disabled = true;
  try{
    await histReq('/rest/v1/session_logs', { method:'POST', headers:{ Prefer:'return=minimal' }, body: JSON.stringify({ session_id: sid, exercise_id: ex, set_number: +last.dataset.set + 1, reps: num(last.dataset.reps), charge: num(last.dataset.charge), duration_seconds: num(last.dataset.dur) }) });
    HSHistory.toast('Série ajoutée : corrige les valeurs si besoin');
    reloadSessionLogs(btn, sid);
  }catch(e){ console.error(e); HSHistory.toast('Ajout impossible. Réessaie.'); btn.disabled = false; }
}
async function removeLogSet(btn){
  const row = btn.closest('.edit-row'), ex = row.dataset.ex, sid = row.dataset.sid;
  const same = [...row.parentElement.querySelectorAll('.edit-row')].filter(r => r.dataset.ex === ex);
  if(same.length <= 1){ HSHistory.toast('Il faut garder au moins une série'); return; }
  if(!confirm('Retirer la série ' + row.dataset.set + ' ?')) return;
  btn.disabled = true;
  try{
    await histReq(`/rest/v1/session_logs?id=eq.${row.dataset.id}`, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const rest = same.filter(r => r !== row).sort((a, b) => +a.dataset.set - +b.dataset.set);
    for(let i = 0; i < rest.length; i++) if(+rest[i].dataset.set !== i + 1) await histReq(`/rest/v1/session_logs?id=eq.${rest[i].dataset.id}`, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body: JSON.stringify({ set_number: i + 1 }) });
    HSHistory.toast('Série retirée');
    reloadSessionLogs(btn, sid);
  }catch(e){ console.error(e); HSHistory.toast('Suppression impossible. Réessaie.'); btn.disabled = false; }
}
async function toggleSessionLogs(card, sessionId){
  const box = card.querySelector('.logs');
  if(box.style.display==='block'){ box.style.display='none'; return; }
  const s = HIST.find(x => x.id === sessionId) || {};
  box.style.display='block';
  box.innerHTML = '<div class="empty" style="padding:6px 0;">Chargement…</div>';
  let logs;
  try{
    try{ logs = await histReq(`/rest/v1/session_logs?select=id,session_id,exercise_id,set_number,reps,charge,duration_seconds,distance_km,exercises(name)&session_id=eq.${sessionId}&order=set_number`); }
    catch(e0){ logs = await histReq(`/rest/v1/session_logs?select=id,session_id,exercise_id,set_number,reps,charge,duration_seconds,exercises(name)&session_id=eq.${sessionId}&order=set_number`); }
  }catch(e){ console.error(e); box.innerHTML = '<div class="empty">Impossible de charger le détail.</div>'; return; }
  const editBlock = s.completed_at ? histEditHtml(s) : '';
  if(!logs.length){ box.innerHTML = '<div class="empty">Pas de détail pour cette séance.</div>' + editBlock; return; }
  // lignes vides en double (anciens doublons neutralisés) : on les masque
  const keyOf = x => (x.exercises?.name || '') + '|' + x.set_number;
  const hasValue = new Set(logs.filter(x => x.reps != null || x.charge != null || x.duration_seconds).map(keyOf));
  logs = logs.filter(x => x.reps != null || x.charge != null || x.duration_seconds || !hasValue.has(keyOf(x)));
  const byExercise = {};
  let totalVolume = 0;
  logs.forEach(l=>{
    const name = l.exercises?.name || 'Exercice';
    if(!byExercise[name]) byExercise[name] = [];
    byExercise[name].push(l);
    if(!l.duration_seconds && l.reps && l.charge) totalVolume += l.reps * l.charge;
  });
  const editing = isEditing(s);
  const rows = Object.entries(byExercise).map(([name, sets])=>{
    let body;
    if(editing){
      body = `<div class="set-rows">${sets.map(x =>
        `<div class="set-row edit-row" data-id="${x.id}" data-ex="${x.exercise_id}" data-set="${x.set_number}" data-sid="${x.session_id}" data-reps="${x.reps ?? ''}" data-charge="${x.charge ?? ''}" data-dur="${x.duration_seconds ?? ''}"><span class="set-row-num">Série ${x.set_number}</span><span class="set-row-val"><input class="e-reps" type="number" inputmode="numeric" value="${x.reps ?? ''}" placeholder="reps" style="width:64px;" onchange="saveLogEdit(this)"> × <input class="e-charge" type="number" inputmode="decimal" step="0.5" value="${x.charge ?? ''}" placeholder="kg" style="width:72px;" onchange="saveLogEdit(this)"> kg <button type="button" class="btn btn-ghost btn-sm" aria-label="Retirer cette série" style="margin-left:6px;" onclick="removeLogSet(this)">🗑</button></span></div>`
      ).join('')}</div><button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" data-ex="${sets[0].exercise_id}" data-sid="${sets[0].session_id}" onclick="addLogSet(this)">+ Ajouter une série</button>`;
    } else {
      const filled = sets.filter(x => x.reps!=null || x.charge!=null || x.duration_seconds);
      body = !filled.length ? `<div class="set-rows-empty">Rien noté pour cet exercice.</div>` :
        `<div class="set-rows">${filled.map(x =>
          `<div class="set-row"><span class="set-row-num">Série ${x.set_number}</span><span class="set-row-val">${HSExport.setTxt(x)}</span></div>`
        ).join('')}</div>`;
    }
    return `<div style="margin-bottom:16px;"><div style="font-weight:700;font-size:15px;margin-bottom:6px;">${escapeHtml(name)}</div>${body}</div>`;
  }).join('');
  const volumeLine = totalVolume ? `<div class="log-line" style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px;"><span>Poids total soulevé pendant la séance</span><b>${Math.round(totalVolume).toLocaleString('fr-FR')} kg</b></div>` : '';
  box.innerHTML = (window.__isCoach ? forBlockHtml(s) : '') + (editing && window.__isAdmin ? adminMetaHtml(s) : '') + rows + volumeLine + editBlock;
}
function forBlockHtml(s){
  const names = [...new Set(HIST.map(histWho).filter(Boolean))];
  const st = 'background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:8px;font:inherit;font-size:15px;min-width:0;flex:1 1 140px';
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px"><div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px">Séance d'une cliente sans appli ? Elle sort de tes stats et de tes badges.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="forName" list="forNames" value="${escapeHtml(histWho(s))}" placeholder="Prénom (vide = ma séance)" style="${st}"><datalist id="forNames">${names.map(n => `<option value="${escapeHtml(n)}">`).join('')}</datalist><button type="button" class="btn btn-ghost btn-sm" onclick="saveForName('${s.id}')">OK</button></div></div>`;

function adminMetaHtml(s){
  const d = new Date(s.started_at), pad = n => String(n).padStart(2,'0');
  const loc = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const tot = s.declared_seconds != null ? Math.round(s.declared_seconds/60) : (s.completed_at ? Math.round((new Date(s.completed_at)-d)/60000) : '');
  const st = 'background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:8px;font:inherit;font-size:15px';
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">
    <label style="font-size:12px;color:var(--ink-muted)">Date et heure<br><input id="amDate" type="datetime-local" value="${loc}" style="${st}"></label>
    <label style="font-size:12px;color:var(--ink-muted)">Durée<br><span style="display:flex;gap:6px;align-items:center"><input id="amH" type="number" min="0" inputmode="numeric" value="${tot===''?'':Math.floor(tot/60)}" placeholder="0" style="${st};width:64px"> h <input id="amM" type="number" min="0" max="59" inputmode="numeric" value="${tot===''?'':tot%60}" placeholder="0" style="${st};width:64px"> min</span></label>
    <button type="button" class="btn btn-ghost btn-sm" onclick="saveAdminMeta('${s.id}')">Enregistrer</button></div>`;
}
async function saveAdminMeta(id){
  const dv = document.getElementById('amDate').value, hv = document.getElementById('amH').value, mn = document.getElementById('amM').value, mv = (hv === '' && mn === '') ? '' : String((parseFloat(hv)||0)*60 + (parseFloat(mn)||0));
  const body = {};
  if(dv){ const d = new Date(dv); body.started_at = d.toISOString(); }
  if(mv !== ''){ const sec = Math.max(0, Math.round(parseFloat(mv)*60)); body.declared_seconds = sec; if(dv) body.completed_at = new Date(new Date(dv).getTime() + sec*1000).toISOString(); }
  try{
    await histReq(`/rest/v1/sessions?id=eq.${id}`, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body: JSON.stringify(body) });
    HSHistory.toast('Enregistré'); EDITNOW.add(id); await loadHistorique();
  }catch(e){ console.error(e); HSHistory.toast('Modification refusée. Réessaie.'); }
}

async function loadProgression(){
  document.getElementById('tabBody').innerHTML = '<div class="empty">Chargement…</div>';
  let sessions = [], rows = [];
  try{
    // Toujours filtrer sur MON compte : un compte coach a le droit de lire les données de tous les clients.
    const myId = encodeURIComponent(getSession().user.id);
    const q = async (p, f) => { let r = await apiFetch(p + f); if(!r.ok) r = await apiFetch(p); return r.json(); };
    sessions = await q(`/rest/v1/sessions?select=id,started_at,date_unknown&user_id=eq.${myId}&order=started_at`, '&for_name=is.null');
    rows = await q(`/rest/v1/session_logs?select=exercise_id,set_number,charge,reps,duration_seconds,session_id,sessions!inner(started_at,date_unknown),exercises(name,category,image_url,image_start_url,image_peak_url)&sessions.user_id=eq.${myId}&limit=10000`, '&sessions.for_name=is.null');
  }catch(e){ document.getElementById('tabBody').innerHTML = '<div class="empty">Impossible de charger ta progression pour le moment.</div>'; return; }
  if(!Array.isArray(sessions) || !sessions.length){
    document.getElementById('tabBody').innerHTML = '<div class="empty">Pas encore de séance enregistrée. Ton suivi apparaîtra ici dès ta première séance.</div>';
    return;
  }

  const byEx = {};
  rows.forEach(r=>{
    if(r.charge==null || !r.sessions || !r.sessions.started_at) return;
    const key = r.exercise_id;
    if(!byEx[key]) byEx[key] = { id: key, ex: r.exercises || {}, name: (r.exercises && r.exercises.name) || 'Exercice', bySession:{} };
    const cur = byEx[key].bySession[r.session_id];
    if(!cur || r.charge > cur.charge) byEx[key].bySession[r.session_id] = { date: r.sessions.started_at, charge: r.charge };
  });
  const cards = Object.values(byEx)
    .map(ex => ({ id: ex.id, ex: ex.ex, name: ex.name, points: Object.values(ex.bySession).sort((a,b)=> new Date(a.date)-new Date(b.date)) }))
    .filter(ex => ex.points.length)
    .sort((a,b)=> b.points.length - a.points.length);

  pgSessions = sessions;
  let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px"><button class="btn btn-ghost btn-sm" onclick="pgReportPdf(this)">📄 Rapport PDF</button><select id="pgRepPer" style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:6px 10px;font:inherit;font-size:14px"><option value="30">1 mois</option><option value="90">3 mois</option><option value="180">6 mois</option><option value="0" selected>Tout</option></select></div>` + highlightsCardHtml(cards, rows) + frequencyCardHtml(sessions) + volumeCardHtml(rows);
  pgCards = cards; pgRows = rows; pgOpen = false; pgSel = null;
  cards.forEach(c => { const f = c.points[0].charge, l = c.points[c.points.length-1].charge; c.gain = f > 0 ? (l-f)/f : 0; });
  if(cards.length){
    const cats = [...new Set(cards.map(c => c.ex.category).filter(Boolean))];
    html += `<div style="display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap"><input id="pgQ" type="text" placeholder="🔍 Rechercher un exercice…" onfocus="pgOpen=true;pgRender()" oninput="pgOpen=true;pgSel=null;pgRender()" style="flex:2 1 160px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:11px;font:inherit;font-size:16px">${cats.length > 1 ? `<select id="pgCat" onchange="pgOpen=true;pgSel=null;pgRender()" style="flex:1 1 130px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:inherit;padding:11px;font:inherit;font-size:16px"><option value="">Tous les muscles</option>${cats.map(c => `<option>${escapeHtml(c)}</option>`).join('')}</select>` : ''}</div><div id="pgList"></div>`;
  } else html += '<div class="empty">Pas encore de charges enregistrées par exercice. Elles apparaîtront ici dès ta première séance où tu notes des poids.</div>';
  document.getElementById('tabBody').innerHTML = html;

function pgStats(id){

function pgDetailHtml(c){

  const hist = ses.slice().reverse().map(x => `<details style="border-top:1px solid var(--line);padding:8px 0"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px"><span>${d(x.date)}</span><span style="opacity:.8">${x.max} kg max</span></summary><div style="margin:6px 0 0 4px;font-size:13px;color:var(--ink-muted)">${x.sets.slice().sort((a,b)=>(a.set_number||0)-(b.set_number||0)).map(r => r.duration_seconds ? Math.round(r.duration_seconds)+' s' : (r.reps||'?')+'×'+(r.charge==null?'?':r.charge)+' kg').join(' · ')}</div></details>`).join('');
  const base = progressionCardHtml(c).replace(/<p style="margin-top:8px[^]*?<\/p>/, '');

    ${isNew ? '<div style="border:1px solid var(--accent);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:14px">🎉 <b>Nouveau record !</b> ' + ses[ses.length-1].max + ' kg à ta dernière séance.</div>' : ''}
    ${per(pgPeriod,'pgSetPeriod')}

      ${tile('🏅 Record', rec + ' kg', d(ses[ri].date))}
      ${tile('💪 1RM estimé', rm ? Math.round(rm) + ' kg' : '–', ses.length > 1 && rm ? (rmD > 0 ? '+' : '') + rmD + ' kg depuis le début' : '')}

    </div>

    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--accent);font-weight:600">Historique des séances</summary>${hist}</details></div>`;

function highlightsCardHtml(cards, rows){
  // Plus grosse progression : gain relatif de charge max (1re -> dernière séance), au moins 2 séances
  let best = null;
  cards.forEach(ex=>{
    if(ex.points.length < 2) return;
    const a = ex.points[0].charge, b = ex.points[ex.points.length-1].charge;
    if(!(a > 0) || b <= a) return;
    const pct = (b - a) / a * 100;
    if(!best || pct > best.pct) best = { name: ex.name, a, b, pct, n: ex.points.length };
  });
  // Exercice préféré : celui que tu fais dans le plus de séances différentes
  const cnt = {};
  (rows||[]).forEach(r=>{
    if(!r.session_id || !r.exercises || !r.exercises.name) return;
    const k = r.exercise_id; (cnt[k] = cnt[k] || { name: r.exercises.name, ss: new Set() }).ss.add(r.session_id);
  });
  let fav = null;
  Object.values(cnt).forEach(c=>{ if(!fav || c.ss.size > fav.n) fav = { name: c.name, n: c.ss.size }; });
  if(!best && !(fav && fav.n >= 2)) return '';
  const tile = (emoji, label, title, sub) => `<div style="flex:1 1 150px;min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)">
    <div style="font-size:12px;opacity:.7">${emoji} ${label}</div>
    <div style="font-weight:700;font-size:16px;margin:4px 0 2px;overflow-wrap:anywhere">${escapeHtml(title)}</div>
    <div style="font-size:13px;opacity:.8">${sub}</div></div>`;
  return `<div class="card progress-card"><h3>Tes points forts</h3><div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">
    ${best ? tile('🚀','Plus grosse progression', best.name, `+${Math.round((best.b-best.a)*10)/10} kg (+${Math.round(best.pct)} %) · ${best.a} → ${best.b} kg`) : ''}
    ${fav && fav.n >= 2 ? tile('❤️','Exercice préféré', fav.name, `Fait dans ${fav.n} séances`) : ''}
  </div></div>`;
}
function weekKey(d){
  const date = new Date(d);
  const day = (date.getDay()+6)%7; // lundi=0
  date.setDate(date.getDate()-day);
  date.setHours(0,0,0,0);
  return date.toISOString().slice(0,10);
}
function frequencyCardHtml(sessions){
  const weeks = [];
  const today = new Date();
  for(let i=7;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i*7);
    weeks.push(weekKey(d));
  }
  const counts = {};
  weeks.forEach(w=> counts[w]=0);
  sessions.forEach(s=>{
    if(s.date_unknown) return;
    const wk = weekKey(s.started_at);
    if(wk in counts) counts[wk]++;
  });
  const max = Math.max(1, ...Object.values(counts));
  const barW = 24, gap = 10, h = 70;
  const bars = weeks.map((w,i)=>{
    const c = counts[w];
    const bh = Math.max(Math.round((c/max) * (h-16)), c>0?3:0);
    const x = i*(barW+gap);
    return `<rect x="${x}" y="${h-bh}" width="${barW}" height="${bh}" rx="4" style="fill:var(--accent);"/>
      <text x="${x+barW/2}" y="${h+14}" text-anchor="middle" style="font-size:9px; fill:var(--ink-muted);">${c}</text>`;
  }).join('');
  const totalW = weeks.length*(barW+gap)-gap;
  const thisWeekCount = counts[weeks[weeks.length-1]];
  return `<div class="card progress-card">
    <h3>Fréquence des séances</h3>
    <p>${sessions.length} séance${sessions.length>1?'s':''} au total · ${thisWeekCount} cette semaine</p>
    <svg width="${totalW}" height="${h+20}" viewBox="0 0 ${totalW} ${h+20}">${bars}</svg>
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">8 dernières semaines</p>
  </div>`;
}
function volumeCardHtml(rows){
  const bySession = {};
  rows.forEach(r=>{
    if(r.duration_seconds || (r.sessions && r.sessions.date_unknown) || r.reps==null || r.charge==null || !r.sessions || !r.sessions.started_at) return;
    if(!bySession[r.session_id]) bySession[r.session_id] = { date: r.sessions.started_at, vol:0 };
    bySession[r.session_id].vol += r.reps * r.charge;
  });
  const points = Object.values(bySession).sort((a,b)=> new Date(a.date)-new Date(b.date)).slice(-10);
  if(!points.length){
    return `<div class="card progress-card"><h3>Volume total</h3><p>Pas encore assez de données (poids ET répétitions notés sur une même séance) pour calculer ton volume d'entraînement.</p></div>`;
  }
  const w = 280, h = 64, pad = 8;
  const vols = points.map(p=>p.vol);
  const max = Math.max(...vols) || 1;
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = points.length>1 ? pad+i*stepX : w/2;
    const y = h-pad-(p.vol/max)*(h-2*pad);
    return [x,y];
  });
  const poly = coords.map(c=> c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" style="fill:var(--accent);"/>`).join('');
  const last = points[points.length-1].vol;
  const first = points[0].vol;
  const delta = Math.round(last-first);
  let deltaTxt;
  if(points.length < 2) deltaTxt = `1 séance avec volume calculé`;
  else if(delta > 0) deltaTxt = `+${delta} kg de volume depuis ta première séance notée ici`;
  else if(delta < 0) deltaTxt = `${delta} kg de volume depuis ta première séance notée ici`;
  else deltaTxt = `Volume stable depuis ta première séance notée ici`;
  return `<div class="card progress-card">
    <h3>Volume total</h3>
    <p>${deltaTxt}</p>
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${poly}" style="fill:none; stroke:var(--accent); stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">Volume = répétitions × charge, cumulé sur toutes les séries d'une séance · ${points.length} dernière${points.length>1?'s':''} séance${points.length>1?'s':''} avec données complètes.</p>
  </div>`;
}
function progressionCardHtml(ex){
  const pts = ex.points;
  const last = pts[pts.length-1].charge;
  const first = pts[0].charge;
  const delta = Math.round((last-first)*10)/10;
  let deltaTxt;
  if(pts.length < 2) deltaTxt = `1 séance enregistrée`;
  else if(delta > 0) deltaTxt = `+${delta} kg depuis ta première séance notée`;
  else if(delta < 0) deltaTxt = `${delta} kg depuis ta première séance notée`;
  else deltaTxt = `Charge stable depuis ta première séance notée`;

  let svg = '';
  if(pts.length > 1){
    const w = 280, h = 64, pad = 8;
    const charges = pts.map(p=>p.charge);
    const min = Math.min(...charges), max = Math.max(...charges);
    const range = (max - min) || 1;
    const stepX = (w - 2*pad) / (pts.length - 1);
    const coords = pts.map((p,i)=>{
      const x = pad + i*stepX;
      const y = h - pad - ((p.charge - min) / range) * (h - 2*pad);
      return [x, y];
    });
    const poly = coords.map(c=> c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" style="fill:var(--accent);"/>`).join('');
    svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${poly}" style="fill:none; stroke:var(--accent); stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  }
  return `<div class="card progress-card">
    <h3>${escapeHtml(ex.name)}</h3>
    <p>${deltaTxt}</p>
    ${svg}
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">Dernière charge notée : ${last} kg · ${pts.length} séance${pts.length>1?'s':''} suivie${pts.length>1?'s':''}</p>
  </div>`;
}

  renderPoidsTab();
}
function pzCss(){ if(document.getElementById('pzCss')) return; const st = document.createElement('style'); st.id = 'pzCss'; st.textContent = '.pz-seg{font-family:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-muted);cursor:pointer}.pz-seg.on{background:var(--accent);color:var(--accent-ink,#0b0b0c);border-color:var(--accent)}'; document.head.appendChild(st); }
function renderPoidsTab(){
  pzCss();
  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <h3>Nouvelle pesée</h3>
      <div class="field"><label>Poids (kg)</label><input id="newWeight" type="number" step="0.1" inputmode="decimal" placeholder="Ex : 78.5"></div>
      <button class="btn btn-accent" style="margin-top:4px;" onclick="addBodyLog()">Enregistrer</button>
    </div>
    ${goalCardHtml()}
    ${weightChartHtml(bodyLogs)}
    ${bodyLogsListHtml(bodyLogs)}
  `;
}
function weightChartHtml(logs){
  const key = 'weight_kg', unit = 'kg', goal = bodyGoal.weight_kg;
  const all = logs.filter(l => l[key] != null);
  const cutoff = poidsRange ? Date.now() - poidsRange * 864e5 : 0;
  const pts = all.filter(l => new Date(l.logged_at).getTime() >= cutoff);
  const seg = (k, lab) => `<button type="button" class="pz-seg ${poidsRange === k ? 'on' : ''}" onclick="poidsRange=${k};renderPoidsTab()">${lab}</button>`;
  const head = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span style="flex:1"></span>${seg(30,'30 j')}${seg(90,'3 mois')}${seg(0,'Tout')}</div>`;
  if(pts.length < 2){
    return `<div class="card progress-card"><h3>Évolution</h3>${head}<p>${all.length < 2 ? 'Ajoute au moins deux mesures pour voir ta courbe.' : 'Pas assez de mesures sur cette période : choisis « Tout ».'}</p></div>`;
  }
  const W = 320, H = 190, L = 38, R = 12, T = 14, B = 26;
  const vals = pts.map(p => Number(p[key]));
  let lo = Math.min(...vals, goal != null ? Number(goal) : Infinity), hi = Math.max(...vals, goal != null ? Number(goal) : -Infinity);
  const padv = (hi - lo) * 0.15 || 1; lo -= padv; hi += padv;
  const t0 = new Date(pts[0].logged_at).getTime(), t1 = new Date(pts[pts.length - 1].logged_at).getTime(), span = (t1 - t0) || 1;
  const X = t => L + (t - t0) / span * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const fmt = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
  const coords = pts.map(p => [X(new Date(p.logged_at).getTime()), Y(Number(p[key])), p]);
  const poly = coords.map(c => c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = `${L},${H - B} ${poly} ${coords[coords.length - 1][0].toFixed(1)},${H - B}`;
  const ticks = [lo + padv, (lo + hi) / 2, hi - padv].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:var(--line);stroke-width:1"/><text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" style="fill:var(--ink-muted);font-size:10px">${fmt(v)}</text>`).join('');
  const dFmt = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
  const xl = `<text x="${L}" y="${H - 8}" style="fill:var(--ink-muted);font-size:10px">${dFmt(t0)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" style="fill:var(--ink-muted);font-size:10px">${dFmt(t1)}</text>`;
  const gl = goal != null ? `<line x1="${L}" x2="${W - R}" y1="${Y(Number(goal)).toFixed(1)}" y2="${Y(Number(goal)).toFixed(1)}" style="stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4"/><text x="${L + 4}" y="${(Y(Number(goal)) - 5).toFixed(1)}" text-anchor="start" style="fill:var(--accent);font-size:10px;font-weight:700">Objectif ${fmt(Number(goal))} ${unit}</text>` : '';
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.2" style="fill:var(--accent)"><title>${dFmt(new Date(c[2].logged_at).getTime())} : ${fmt(Number(c[2][key]))} ${unit}</title></circle>`).join('');
  const first = vals[0], last = vals[vals.length - 1], delta = Math.round((last - first) * 10) / 10;
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const deltaTxt = delta === 0 ? 'Stable sur la période' : (delta > 0 ? '+' : '') + fmt(delta) + ' ' + unit + ' sur la période';
  return `<div class="card progress-card"><h3>Évolution</h3>${head}
    <div style="font-size:26px;font-weight:800;line-height:1.1">${fmt(last)} ${unit}</div><p style="margin:2px 0 8px">${deltaTxt}</p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Courbe d'évolution">${ticks}<polygon points="${area}" style="fill:var(--accent);opacity:.1"/><polyline points="${poly}" style="fill:none;stroke:var(--accent);stroke-width:2.2" stroke-linecap="round" stroke-linejoin="round"/>${gl}${dots}${xl}</svg>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-muted)"><span>Min <b style="color:var(--ink)">${fmt(Math.min(...vals))}</b></span><span>Moyenne <b style="color:var(--ink)">${fmt(avg)}</b></span><span>Max <b style="color:var(--ink)">${fmt(Math.max(...vals))}</b></span><span>${pts.length} mesures</span></div></div>`;
}
function goalCardHtml(){
  const g = bodyGoal || {}, wl = bodyLogs.filter(l => l.weight_kg != null);
  let prog = '';
  if(g.weight_kg != null && wl.length){
    const start = Number(wl[0].weight_kg), now = Number(wl[wl.length - 1].weight_kg), goal = Number(g.weight_kg);
    const total = Math.abs(goal - start), done = Math.max(0, Math.min(total, total - Math.abs(goal - now)));
    const pct = total ? Math.round(done / total * 100) : 100, left = Math.round(Math.abs(goal - now) * 10) / 10;
    prog = left < 0.1 ? `<div class="end-sub" style="margin-top:8px">🎯 Objectif atteint, bravo !</div>` : `<div style="height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px"><i style="display:block;height:100%;width:${pct}%;background:var(--accent);border-radius:99px"></i></div><div style="font-size:12.5px;color:var(--ink-muted);margin-top:6px">Départ ${String(start).replace('.', ',')} kg · actuel <b style="color:var(--ink)">${String(now).replace('.', ',')} kg</b> · encore <b style="color:var(--ink)">${String(left).replace('.', ',')} kg</b> (${pct} %)</div>`;
  }
  return `<div class="card"><h3>🎯 Mon objectif</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><div class="field" style="flex:1;min-width:120px;margin:0"><label>Poids visé (kg)</label><input id="goalWeight" type="number" step="0.1" inputmode="decimal" value="${g.weight_kg ?? ''}" placeholder="Ex : 75"></div>
</div>
    <button class="btn btn-ghost" style="margin-top:10px" onclick="saveBodyGoal(this)">Enregistrer l'objectif</button>${prog}</div>`;
}
async function saveBodyGoal(btn){
  const v = id => { const x = document.getElementById(id).value; return x === '' ? null : parseFloat(x); };
  const row = { user_id: getSession().user.id, weight_kg: v('goalWeight'), updated_at: new Date().toISOString() };
  btn.disabled = true;
  try{
    const res = await apiFetch('/rest/v1/body_goals?on_conflict=user_id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(row) });
    if(!res.ok) throw new Error(await res.text());
    bodyGoal = row; renderPoidsTab();
  }catch(e){ console.error(e); btn.disabled = false; alert('Objectif non enregistré : vérifie les valeurs (entre 20 et 400 kg).'); }
}
function bodyLogsListHtml(logs){
  if(!logs.length) return '<div class="empty">Aucune pesée enregistrée pour l\'instant.</div>';
  const rows = [...logs].reverse().map(l=>{
    const d = new Date(l.logged_at);
    const parts = [];
    if(l.weight_kg!=null) parts.push(`${l.weight_kg} kg`);
    return `<div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <div><div class="tag">${d.toLocaleDateString('fr-FR', {day:'numeric',month:'long',year:'numeric'})}</div>
      <h3 style="margin-top:4px;">${parts.join(' · ') || '—'}</h3></div>
      <button class="btn btn-ghost btn-sm" onclick="deleteBodyLog('${l.id}')">Supprimer</button>
    </div>`;
  }).join('');
  return `<div class="section"><h2>Historique</h2>${rows}</div>`;
}
async function addBodyLog(){
  const weightEl = document.getElementById('newWeight');
  const weight = weightEl.value ? parseFloat(weightEl.value) : null;
  if(weight==null){ alert('Renseigne ton poids.'); return; }
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  try{
    const res = await apiFetch(`/rest/v1/body_logs`, {
      method:'POST',
      headers:{ Prefer:'return=representation' },
      body: JSON.stringify({ user_id: getSession().user.id, weight_kg: weight })
    });
    if(!res.ok) throw new Error(await res.text());
    const [created] = await res.json();
    bodyLogs.push(created);
    renderPoidsTab();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Enregistrer';
    alert('Impossible d\'enregistrer la pesée, réessaie.');
  }
}
async function deleteBodyLog(id){
  if(!confirm('Supprimer cette pesée ?')) return;
  try{
    await apiFetch(`/rest/v1/body_logs?id=eq.${id}`, { method:'DELETE' });
    bodyLogs = bodyLogs.filter(l=>l.id!==id);
    renderPoidsTab();
  }catch(e){ alert('Impossible de supprimer cette pesée.'); }
}

let chatPoll = null; let conversationId = null;
async function loadChat(){
  document.getElementById('tabBody').innerHTML = '<div id="coachBar"></div>' + `<div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="empty">Chargement…</div></div>
    <div class="chat-input"><input id="chatInput" type="text" placeholder="Écris un message…" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Envoyer</button></div></div>`;
  let convs = await (await apiFetch(`/rest/v1/conversations?select=id&limit=1`)).json();
  if(!convs.length){
    convs = await (await apiFetch(`/rest/v1/conversations`, { method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify({ user_id: getSession().user.id }) })).json();
  }
  conversationId = convs[0].id;
  showCoachBar();
  await refreshMessages();
  apiFetch(`/rest/v1/messages?conversation_id=eq.${conversationId}&sender=eq.coach&read=eq.false`, { method:'PATCH', body: JSON.stringify({ read:true }) }).catch(()=>{});
  clearInterval(chatPoll);
  chatPoll = setInterval(()=>{ if(currentTab==='chat') refreshMessages(); }, 5000);
}
async function showCoachBar(){
  try{
    const uid = getSession().user.id;
    const me = ((await (await apiFetch(`/rest/v1/profiles?select=coach_id&id=eq.${uid}`)).json()) || [])[0] || {};
    let name = '';
    if(me.coach_id){ const cp = ((await (await apiFetch(`/rest/v1/coach_profiles?select=display_name&user_id=eq.${me.coach_id}`)).json()) || [])[0]; name = cp ? cp.display_name : 'ton coach'; }
    const bar = document.getElementById('coachBar'); if(!bar) return;
    bar.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px">
      <div style="font-size:14px">${me.coach_id ? 'Ton coach : <b>' + escapeHtml(name) + '</b>' : 'Tu discutes avec le coach principal.'}</div>
      <button class="btn btn-ghost btn-sm" onclick="openCoachDirectory()">${me.coach_id ? 'Voir les coachs' : 'Choisir un coach'}</button></div>`;
  }catch(e){}
}
function openCoachDirectory(){
  if(typeof HSCoaches === 'undefined') return;
  HSCoaches.openDirectory({ fetcher: apiFetch, loggedIn: true, onSent: c => alert(c ? 'Demande envoyée à ' + c.display_name + ' !' : 'Demande envoyée !') });
}
async function refreshMessages(){
  const res = await apiFetch(`/rest/v1/messages?select=*&conversation_id=eq.${conversationId}&order=created_at`);
  const msgs = await res.json();
  const box = document.getElementById('chatMsgs');
  if(!box) return;
  box.innerHTML = msgs.length ? msgs.map(m=>`<div class="msg ${m.sender}">${escapeHtml(m.content)}</div>`).join('') : '<div class="empty">Dis bonjour à ton coach 👋</div>';
  box.scrollTop = box.scrollHeight;
}
async function sendMessage(){
  const input = document.getElementById('chatInput');
  const content = input.value.trim();
  if(!content) return;
  input.value = '';
  const box = document.getElementById('chatMsgs');
  let tmp = null;
  if(box){
    const empty = box.querySelector('.empty');
    if(empty) empty.remove();
    tmp = document.createElement('div');
    tmp.className = 'msg user'; tmp.textContent = content;
    box.appendChild(tmp);
    box.scrollTop = box.scrollHeight;
  }
  try{
    const res = await apiFetch(`/rest/v1/messages`, { method:'POST', body: JSON.stringify({ conversation_id: conversationId, sender:'user', content }) });
    if(!res.ok) throw new Error('send_failed');
    await refreshMessages();
  }catch(e){
    if(tmp){ tmp.style.opacity = '0.5'; tmp.title = "Échec de l'envoi — réessaie."; }
    input.value = content;
    alert("Ton message n'a pas pu être envoyé. Réessaie.");
  }
}

async function loadProfil(){
  const s = getSession();
  const res = await apiFetch(`/rest/v1/profiles?select=*&id=eq.${s.user.id}`);
  const profiles = await res.json();
  const p = profiles[0] || {};
  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="profile-row"><span>Nom</span><b>${escapeHtml(p.full_name || '—')}${NAME_CHIP}</b></div>
      <div class="profile-row"><span>Email</span><b>${escapeHtml(s.user.email)}</b></div>
      <div class="profile-row"><span>Statut</span><b>${p.role==='admin' ? 'Coach (admin)' : (p.role==='coach' ? 'Coach' : 'Client')}</b></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="logout()">Se déconnecter</button>
    ${p.role === 'client' ? '<button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="openMyData()">🔐 Mes données &amp; suppression du compte</button>' : ''}
  `;
  window.__myName = p.full_name || '';
}
async function openMyData(){
  if(typeof HSAccount === 'undefined'){ alert('Indisponible hors connexion. Réessaie.'); return; }
  try{ await apiFetch('/rest/v1/profiles?select=id&limit=1'); }catch(e){}
  HSAccount.open({ fetcher: apiFetch, session: getSession(), baseUrl: SUPABASE_URL, anonKey: SUPABASE_ANON_KEY, name: window.__myName, onDeleted: () => { clearSession(); location.href = 'index.html'; } });
}

// ---------- Boot ----------
(function boot(){
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  if(hashParams.get('type') === 'recovery' && hashParams.get('access_token')){
    renderResetPassword(hashParams.get('access_token'));
    return;
  }
  const s = getSession();
  if(s && s.access_token){ renderDashboard(); } else { renderAuth(); }
})();

function trackVisit(){
  try{
    let vid = localStorage.getItem('hs_visitor_id');
    if(!vid){ vid = crypto.randomUUID(); localStorage.setItem('hs_visitor_id', vid); }
    let uid = null;
    try{ const s = JSON.parse(localStorage.getItem('hs_session')||'null'); if(s && s.user && s.user.id) uid = s.user.id; }catch(e){}
    fetch(`${SUPABASE_URL}/rest/v1/rpc/track_visit`, {
      method:'POST',
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: vid, p_user_id: uid })
    }).catch(()=>{});
  }catch(e){}
}
trackVisit();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(function(){
  const KEY = 'hs_install_dismissed_v1';
  try{ const t = +localStorage.getItem(KEY); if(t && Date.now() - t < 14*864e5) return; }catch(e){}
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;

  function showBanner(html, onInstall){
    const bar = document.createElement('div');
    bar.className = 'install-banner show';
    bar.innerHTML = html;
    document.body.appendChild(bar);
    document.body.classList.add('has-install-banner');
    const closeBtn = bar.querySelector('.installClose');
    if (closeBtn) closeBtn.addEventListener('click', ()=>{ localStorage.setItem(KEY, String(Date.now())); bar.remove(); document.body.classList.remove('has-install-banner'); });
    const installBtn = bar.querySelector('.installGo');
    if (installBtn && onInstall) installBtn.addEventListener('click', onInstall);
    setTimeout(()=>{ if(!bar.isConnected) return; try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} bar.style.transition='opacity .4s'; bar.style.opacity='0'; setTimeout(()=>{ bar.remove(); document.body.classList.remove('has-install-banner'); }, 400); }, 7000);
  }

  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (isIos) {
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isSafari) {
      showBanner(`
        <p>Installe cette app sur ton écran d'accueil : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);    } else {
      showBanner(`
        <p>Pour installer l'app sur iPhone, ouvre ce site dans <strong>Safari</strong>, puis <strong>Partager</strong> › <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);
    }
  } else {
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      deferredPrompt = e;
      showBanner(`
        <p>Installe HS Coaching sur ton appareil pour un accès rapide, même hors-ligne.</p>
        <div class="btn-row">
          <button class="installGo" style="background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;">Installer</button>
          <button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
      `, async ()=>{
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        localStorage.setItem(KEY, String(Date.now()));
        const el = document.querySelector('.install-banner'); if (el) el.remove();
        document.body.classList.remove('has-install-banner');
      });
    });
  }
})();
</script>
