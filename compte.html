<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>HS Coaching — Mon compte</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --surface:#16171a; --surface-2:#1f2024; --line:#2c2c30;
    --ink:#f5f5f5; --ink-muted:#9a9a9e; --accent:#ffffff; --accent-ink:#0b0b0c;
    --ok:#ffffff; --radius:14px; box-sizing:border-box; color-scheme:dark;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em; line-height:.95;}
  a{color:inherit;}
  button{font-family:inherit;}
  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}

  header.top{position:sticky; top:0; z-index:20; background:rgba(11,11,12,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
  .top-inner{display:flex; align-items:center; gap:14px; padding:14px 20px; max-width:760px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center;
    flex:none; font-family:'Bebas Neue'; font-size:19px; color:var(--accent-ink);}
  .brand{flex:1;}
  .brand .b1{font-size:15px; font-weight:700;}
  .brand .b2{font-size:12px; color:var(--ink-muted);}
  .nav-link{font-size:14px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:8px 14px; border-radius:999px;}
  .nav-link:hover{color:var(--ink); border-color:var(--accent);}

  main{padding:32px 0 90px;}
  .eyebrow{color:var(--accent); font-weight:700; font-size:13px; margin-bottom:6px;}
  h1.page{font-size:clamp(32px,7vw,48px); margin-bottom:10px;}
  .subtitle{color:var(--ink-muted); font-size:14px; max-width:52ch; margin-bottom:20px;}

  .field{margin-top:14px;}
  .field label{font-size:12.5px; color:var(--ink-muted); display:block; margin-bottom:6px; font-weight:600;}
  .field input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:12px 14px; font-size:14px; font-family:inherit;}
  .btn{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; padding:12px 20px; border-radius:999px; border:none; cursor:pointer;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-block{width:100%; justify-content:center; margin-top:18px;}
  .switch-mode{margin-top:16px; font-size:13px; color:var(--ink-muted); text-align:center;}
  .switch-mode a{color:var(--accent); font-weight:600; cursor:pointer;}
  .error-msg{color:#ff8a65; font-size:13px; margin-top:10px; display:none; font-weight:600; border-left:2px solid #ff8a65; padding-left:10px; background:rgba(255,138,101,.08); padding:8px 10px; border-radius:0 8px 8px 0;}
  .info-msg{color:var(--ink-muted); font-size:13px; margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
  .tab{padding:12px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tab.active{color:var(--ink); border-color:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:10px;}
  .card .tag{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.08em;}
  .card h3{font-family:'Inter'; font-size:16px; font-weight:700; margin-top:4px; letter-spacing:0; color:var(--ink);}
  .card p{color:var(--ink-muted); font-size:13px; margin-top:6px;}
  .empty{color:var(--ink-muted); font-size:13.5px; padding:14px 0;}

  .log-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--line); color:var(--ink-muted);}
  .set-rows{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .set-row{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; font-size:14px; border-bottom:1px solid var(--line);}
  .set-row:last-child{border-bottom:none;}
  .set-row-num{color:var(--ink-muted); font-weight:500;}
  .set-row-val{color:var(--ink); font-weight:600;}
  .set-rows-empty{font-size:13px; color:var(--ink-muted); padding:4px 0;}
  .log-line b{color:var(--ink); font-weight:600;}

  .chat-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; height:400px; display:flex; flex-direction:column;}
  .chat-msgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:75%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.4;}
  .msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
  .msg.coach{align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:4px;}
  .chat-input{display:flex; border-top:1px solid var(--line); padding:10px;}
  .chat-input input{flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:14px; padding:8px; font-family:inherit;}
  .chat-input button{background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer;}

  .profile-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line); font-size:14px;}
  .profile-row:first-child{border-top:none;}

  footer{border-top:1px solid var(--line); padding:26px 0; text-align:center; color:var(--ink-muted); font-size:12.5px; margin-top:40px;}

  .navrow{display:flex; gap:8px; max-width:960px; margin:0 auto; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:1; text-align:center; font-size:13.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:10px 14px; border-radius:999px; white-space:nowrap; text-decoration:none;}
  .navrow a.active{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .navrow a{position:relative;}
  .nav-dot{position:absolute; top:5px; right:10px; width:8px; height:8px; border-radius:50%; background:#ff5a4e; border:1.5px solid var(--bg);}

  .install-banner{position:fixed; left:12px; right:12px; bottom:12px; z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .install-banner.show{display:flex;}
  .install-banner p{flex:1; font-size:13px; color:var(--ink); margin:0; line-height:1.4;}
  .install-banner .btn-row{display:flex; gap:8px; flex:none; align-items:center;}
  .progress-card svg{display:block; margin-top:10px;}

  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
    .picker{ flex-direction:column; align-items:stretch; }
    .picker select, .picker input{ width:100% !important; }
  }
</style>
</head>

<script>
const SUPABASE_URL = "https://rvftqdbdibfylauartii.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZnRxZGJkaWJmeWxhdWFydGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjEzMjIsImV4cCI6MjEwNjA5NzMyMn0._WLJkWncu1fwMnlakuPFuJr_I-uvgr_TwvMect8E-a0";
const app = document.getElementById('app');

function getDeviceToken(){
  let t = localStorage.getItem('hs_device_token');
  if(!t){ t = crypto.randomUUID(); localStorage.setItem('hs_device_token', t); }
  return t;
}
function getSession(){
  try{ return JSON.parse(localStorage.getItem('hs_session') || 'null'); }catch(e){ return null; }
}
function setSession(s){ localStorage.setItem('hs_session', JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem('hs_session'); localStorage.removeItem('hs_role'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function authFetch(path, opts={}){
  return fetch(`${SUPABASE_URL}${path}`, {
    cache: 'no-store',
    ...opts,
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
}
async function refreshIfNeeded(){
  const s = getSession();
  if(!s || !s.refresh_token) return;
  const exp = (s.expires_at || 0) * 1000;
  if(exp && Date.now() < exp - 60000) return;
  try{
    const res = await authFetch('/auth/v1/token?grant_type=refresh_token', { method:'POST', body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const data = await res.json();
    if(res.ok && data.access_token) setSession(data); else clearSession();
  }catch(e){}
}
async function apiFetch(path, opts={}){
  await refreshIfNeeded();
  const s = getSession();
  return fetch(`${SUPABASE_URL}${path}`, {
    cache: 'no-store',
    ...opts,
    headers: { apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${s?.access_token}`, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
}
async function rpcAuth(fn, params){
  const res = await apiFetch(`/rest/v1/rpc/${fn}`, { method:'POST', body: JSON.stringify(params) });
  return res.ok ? res.json() : Promise.reject(await res.text());
}

// ---------- Auth ----------
let authMode = 'login';
function renderAuth(){
  app.innerHTML = `
    <div class="eyebrow">MON COMPTE</div>
    <h1 class="page">${authMode==='login' ? 'Connexion' : 'Créer un compte'}</h1>
    <p class="subtitle">${authMode==='login' ? 'Retrouve tes séances et tes programmes sur n\'importe quel appareil.' : 'Tes programmes et séances créés sur cet appareil seront automatiquement rattachés à ton compte.'}</p>
    ${authMode==='signup' ? `<div class="field"><label>Prénom</label><input id="aName" type="text" placeholder="Ton prénom"></div>` : ''}
    <div class="field"><label>Email</label><input id="aEmail" type="email" placeholder="toi@email.com"></div>
    <div class="field"><label>Mot de passe</label><input id="aPass" type="password" placeholder="6 caractères minimum"></div>
    <div class="error-msg" id="aError"></div>
    <button class="btn btn-accent btn-block" id="aSubmit" onclick="submitAuth()">${authMode==='login' ? 'Se connecter' : 'Créer mon compte'}</button>
    <div class="switch-mode">
      ${authMode==='login' ? `Pas encore de compte ? <a onclick="authMode='signup'; renderAuth();">Créer un compte</a>`
                            : `Déjà un compte ? <a onclick="authMode='login'; renderAuth();">Se connecter</a>`}
    </div>
    ${authMode==='login' ? `<div class="switch-mode"><a onclick="renderForgotPassword()">Mot de passe oublié ?</a></div>` : ''}
  `;
}
function renderForgotPassword(){
  const prefill = (document.getElementById('aEmail')?.value || '').trim();
  app.innerHTML = `
    <div class="eyebrow">MON COMPTE</div>
    <h1 class="page">Mot de passe oublié</h1>
    <p class="subtitle">Indique ton email, on t'envoie un lien pour en choisir un nouveau.</p>
    <div class="field"><label>Email</label><input id="fpEmail" type="email" value="${prefill}" placeholder="toi@email.com"></div>
    <div class="error-msg" id="fpError"></div>
    <button class="btn btn-accent btn-block" id="fpSubmit" onclick="submitForgotPassword()">Envoyer le lien</button>
    <div class="switch-mode"><a onclick="authMode='login'; renderAuth();">← Retour à la connexion</a></div>
  `;
}
async function submitForgotPassword(){
  const email = document.getElementById('fpEmail').value.trim();
  const errEl = document.getElementById('fpError');
  errEl.style.display = 'none';
  if(!email){ errEl.textContent = 'Entre un email valide.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('fpSubmit'); btn.disabled = true; btn.textContent = 'Envoi…';
  try{
    const res = await authFetch(`/auth/v1/recover`, { method:'POST', body: JSON.stringify({ email, redirect_to: location.origin + location.pathname }) });
    if(!res.ok){ const data = await res.json().catch(()=>({})); throw new Error(data.error_description || data.msg || 'Erreur lors de l\'envoi.'); }
    app.innerHTML = `<div class="eyebrow">MON COMPTE</div><h1 class="page">Email envoyé</h1>
      <p class="subtitle">Si un compte existe avec cette adresse, un lien pour choisir un nouveau mot de passe vient d'être envoyé.</p>
      <button class="btn btn-ghost" onclick="authMode='login'; renderAuth();">Retour à la connexion</button>`;
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Envoyer le lien';
  }
}
function renderResetPassword(recoveryToken){
  app.innerHTML = `
    <div class="eyebrow">MON COMPTE</div>
    <h1 class="page">Nouveau mot de passe</h1>
    <p class="subtitle">Choisis ton nouveau mot de passe (6 caractères minimum).</p>
    <div class="field"><label>Nouveau mot de passe</label><input id="rpPass" type="password" placeholder="6 caractères minimum"></div>
    <div class="error-msg" id="rpError"></div>
    <button class="btn btn-accent btn-block" id="rpSubmit" onclick="submitResetPassword('${recoveryToken}')">Valider</button>
  `;
}
async function submitResetPassword(recoveryToken){
  const pass = document.getElementById('rpPass').value;
  const errEl = document.getElementById('rpError');
  errEl.style.display = 'none';
  if(pass.length < 6){ errEl.textContent = 'Le mot de passe doit faire 6 caractères minimum.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('rpSubmit'); btn.disabled = true; btn.textContent = 'Patiente…';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { method:'PUT', headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${recoveryToken}`, 'Content-Type':'application/json' }, body: JSON.stringify({ password: pass }) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || 'Erreur lors de la mise à jour.');
    history.replaceState(null, '', location.pathname);
    app.innerHTML = `<div class="eyebrow">MON COMPTE</div><h1 class="page">Mot de passe mis à jour</h1>
      <p class="subtitle">Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
      <button class="btn btn-accent btn-block" onclick="authMode='login'; renderAuth();">Se connecter</button>`;
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Valider';
  }
}
async function submitAuth(){
  const email = document.getElementById('aEmail').value.trim();
  const pass = document.getElementById('aPass').value;
  const errEl = document.getElementById('aError');
  errEl.style.display = 'none';
  if(!email || pass.length < 6){ errEl.textContent = 'Email valide et mot de passe (6+ caractères) requis.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('aSubmit'); btn.disabled = true; btn.textContent = 'Patiente…';
  try{
    if(authMode==='signup'){
      const fullName = document.getElementById('aName').value.trim();
      const res = await authFetch(`/auth/v1/signup?redirect_to=${encodeURIComponent(location.origin + location.pathname)}`, { method:'POST', body: JSON.stringify({ email, password: pass, data:{ full_name: fullName } }) });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error_description || data.msg || 'Erreur lors de la création du compte.');
      if(data.access_token){
        setSession(data);
        await afterLogin();
      } else {
        app.innerHTML = `<div class="eyebrow">MON COMPTE</div><h1 class="page">Vérifie ta boîte mail</h1>
          <p class="subtitle">Un email de confirmation vient de t'être envoyé. Confirme ton adresse puis reviens te connecter.</p>
          <button class="btn btn-ghost" onclick="authMode='login'; renderAuth();">Retour à la connexion</button>`;
      }
    } else {
      const res = await authFetch('/auth/v1/token?grant_type=password', { method:'POST', body: JSON.stringify({ email, password: pass }) });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error_description || data.msg || 'Email ou mot de passe incorrect.');
      setSession(data);
      await afterLogin();
    }
  }catch(e){
    errEl.textContent = e.message; errEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = authMode==='login' ? 'Se connecter' : 'Créer mon compte';
}
async function afterLogin(){
  try{ await rpcAuth('link_guest_to_user', { p_token: getDeviceToken() }); }catch(e){ console.error(e); }
  renderDashboard();
}
function logout(){ clearSession(); authMode='login'; renderAuth(); }

// ---------- Dashboard ----------
let currentTab = 'programmes';
async function syncRole(){
  try{
    const s = getSession();
    const res = await apiFetch(`/rest/v1/profiles?select=role&id=eq.${s.user.id}`);
    const rows = await res.json();
    const role = rows[0] && rows[0].role;
    if(role){ localStorage.setItem('hs_role', role); }
    const n = document.querySelector('.navrow');
    if(role==='admin' && n && !n.querySelector('[href="admin.html"]')) n.insertAdjacentHTML('beforeend','<a href="admin.html">Espace coach</a>');
    return role;
  }catch(e){ return null; }
}
async function renderDashboard(){
  const role = await syncRole();
  const isCoachAccount = role === 'admin';
  app.innerHTML = `
    <div class="eyebrow">MON COMPTE</div>
    <h1 class="page">Salut 👋</h1>
    <div class="tabs">
      <div class="tab" data-tab="programmes">Mes programmes</div>
      <div class="tab" data-tab="historique">Historique</div>
      <div class="tab" data-tab="progression">Progression</div>
      ${isCoachAccount ? '' : '<div class="tab" data-tab="badges">Badges</div>'}
      ${isCoachAccount ? '' : '<div class="tab" data-tab="poids">Poids</div>'}
      ${isCoachAccount ? '' : '<div class="tab" data-tab="chat">Discussion coach</div>'}
      <div class="tab" data-tab="profil">Profil</div>
    </div>
    <div id="tabBody"><div class="empty">Chargement…</div></div>
  `;
  [...document.querySelectorAll('.tab')].forEach(t=>{
    t.addEventListener('click', ()=>{ currentTab = t.dataset.tab; paintTabs(); loadTab(); });
  });
  paintTabs();
  loadTab();
}
function paintTabs(){
  [...document.querySelectorAll('.tab')].forEach(t=> t.classList.toggle('active', t.dataset.tab===currentTab));
}
function loadTab(){
  if(currentTab==='programmes') loadProgrammes();
  else if(currentTab==='historique') loadHistorique();
  else if(currentTab==='progression') loadProgression();
  else if(currentTab==='badges') loadBadges();
  else if(currentTab==='poids') loadPoids();
  else if(currentTab==='chat') loadChat();
  else loadProfil();
}

async function loadProgrammes(){
  const res = await apiFetch(`/rest/v1/programs?select=*&or=(is_official.eq.true,owner_user_id.eq.${getSession().user.id})&order=is_official.desc,created_at.desc`);
  const programs = await res.json();
  try{
    const seen = new Set(JSON.parse(localStorage.getItem('hs_seen_programs')||'[]'));
    programs.forEach(p=> seen.add(p.id));
    localStorage.setItem('hs_seen_programs', JSON.stringify([...seen]));
  }catch(e){}
  document.getElementById('tabBody').innerHTML = programs.length ? programs.map(p=>`
    <div class="card" style="cursor:pointer" onclick="location.href='programmes.html#programme/${p.id}'"><div class="tag">${p.is_official?'Coach':'Perso'}</div><h3>${p.name}</h3><p>${p.description||''}</p><p style="margin-top:8px;color:var(--ink);font-weight:600;">Ouvrir le programme →</p></div>
  `).join('') : '<div class="empty">Aucun programme pour l\'instant. Crée-en un depuis la page Programmes.</div>';
}

async function loadBadges(){
  const box = document.getElementById('tabBody');
  box.innerHTML = '<div class="empty">Chargement…</div>';
  if(typeof HSBadges === 'undefined'){ box.innerHTML = '<div class="empty">Les badges ne sont pas disponibles pour le moment.</div>'; return; }
  try{
    const getJson = async p => { const r = await apiFetch(p); if(!r.ok) throw new Error('load_failed'); return r.json(); };
    const data = await HSBadges.load(getJson, getSession().user.id);
    if(currentTab !== 'badges') return;
    box.innerHTML = HSBadges.renderFull(HSBadges.compute(data));
  }catch(e){
    console.error(e);
    if(currentTab === 'badges') box.innerHTML = '<div class="empty">Impossible de charger tes badges. Réessaie.</div>';
  }
}
let HIST = [], HISTREQ = {};
async function histReq(path, opts){

function histDurSec(s){
  if(!s.completed_at) return 0;
  if(s.declared_seconds != null) return s.declared_seconds;
  return Math.max(0, Math.round((new Date(s.completed_at) - new Date(s.started_at)) / 1000));
}
function histBadgeNote(s){
  if(!s.completed_at) return '';
  if(s.badge_eligible) return '<div style="font-size:12px; color:var(--accent); margin-top:6px;">🏅 Compte pour les badges</div>';
  if(s.source === 'manual') return '<div style="font-size:12px; color:var(--ink-muted); margin-top:6px;">✍️ Saisie après coup · ne compte pas pour les badges</div>';
  return '<div style="font-size:12px; color:var(--ink-muted); margin-top:6px;">Ne compte pas pour les badges (moins de 4 séries, moins de 10 min, ou déjà une séance comptée ce jour)</div>';

async function loadHistorique(){

  HISTREQ = {};
  try{
    const reqs = await histReq(`/rest/v1/session_edit_requests?select=id,session_id,status,message,created_at&user_id=eq.${uid}&order=created_at.desc`);

        <div class="tag">${d.toLocaleDateString('fr-FR', {day:'numeric',month:'long'})}${duree}</div>
        <button type="button" aria-label="Supprimer cette séance" title="Supprimer" onclick="event.stopPropagation(); askDeleteSession('${s.id}')" style="background:none; border:1px solid var(--line); color:var(--ink-muted); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer;">🗑</button>
      </div>

}

async function toggleSessionLogs(card, sessionId){
  const box = card.querySelector('.logs');
  if(box.style.display==='block'){ box.style.display='none'; return; }
  const s = HIST.find(x => x.id === sessionId) || {};
  box.style.display='block';
  box.innerHTML = '<div class="empty" style="padding:6px 0;">Chargement…</div>';
  let logs;
  try{
    logs = await histReq(`/rest/v1/session_logs?select=id,set_number,reps,charge,exercises(name)&session_id=eq.${sessionId}&order=set_number`);
  }catch(e){ console.error(e); box.innerHTML = '<div class="empty">Impossible de charger le détail.</div>'; return; }
  const editBlock = s.completed_at ? histEditHtml(s) : '';
  if(!logs.length){ box.innerHTML = '<div class="empty">Pas de détail pour cette séance.</div>' + editBlock; return; }
  // lignes vides en double (anciens doublons neutralisés) : on les masque
  const keyOf = x => (x.exercises?.name || '') + '|' + x.set_number;
  const hasValue = new Set(logs.filter(x => x.reps != null || x.charge != null).map(keyOf));
  logs = logs.filter(x => x.reps != null || x.charge != null || !hasValue.has(keyOf(x)));
  const byExercise = {};
  let totalVolume = 0;
  logs.forEach(l=>{
    const name = l.exercises?.name || 'Exercice';
    if(!byExercise[name]) byExercise[name] = [];
    byExercise[name].push(l);
    if(l.reps && l.charge) totalVolume += l.reps * l.charge;
  });
  const editing = !!s.edit_unlocked;
  const rows = Object.entries(byExercise).map(([name, sets])=>{
    let body;
    if(editing){
      body = `<div class="set-rows">${sets.map(x =>
        `<div class="set-row edit-row" data-id="${x.id}"><span class="set-row-num">Série ${x.set_number}</span><span class="set-row-val"><input class="e-reps" type="number" inputmode="numeric" value="${x.reps ?? ''}" placeholder="reps" style="width:64px;" onchange="saveLogEdit(this)"> × <input class="e-charge" type="number" inputmode="decimal" step="0.5" value="${x.charge ?? ''}" placeholder="kg" style="width:72px;" onchange="saveLogEdit(this)"> kg</span></div>`
      ).join('')}</div>`;
    } else {
      const filled = sets.filter(x => x.reps!=null || x.charge!=null);
      body = !filled.length ? `<div class="set-rows-empty">Rien noté pour cet exercice.</div>` :
        `<div class="set-rows">${filled.map(x =>
          `<div class="set-row"><span class="set-row-num">Série ${x.set_number}</span><span class="set-row-val">${x.reps!=null ? x.reps+' reps' : '–'}${x.charge!=null ? ' · '+x.charge+' kg' : ''}</span></div>`
        ).join('')}</div>`;
    }
    return `<div style="margin-bottom:16px;"><div style="font-weight:700;font-size:15px;margin-bottom:6px;">${escapeHtml(name)}</div>${body}</div>`;
  }).join('');
  const volumeLine = totalVolume ? `<div class="log-line" style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:14px;"><span>Poids total soulevé pendant la séance</span><b>${Math.round(totalVolume).toLocaleString('fr-FR')} kg</b></div>` : '';
  box.innerHTML = rows + volumeLine + editBlock;
}

// ---------- Progression ----------
async function loadProgression(){
  document.getElementById('tabBody').innerHTML = '<div class="empty">Chargement…</div>';
  let sessions = [], rows = [];
  try{
    // Toujours filtrer sur MON compte : un compte coach a le droit de lire les données de tous les clients.
    const myId = encodeURIComponent(getSession().user.id);
    sessions = await (await apiFetch(`/rest/v1/sessions?select=id,started_at&user_id=eq.${myId}&order=started_at`)).json();
    rows = await (await apiFetch(`/rest/v1/session_logs?select=exercise_id,charge,reps,session_id,sessions!inner(started_at),exercises(name)&sessions.user_id=eq.${myId}&limit=10000`)).json();
  }catch(e){ document.getElementById('tabBody').innerHTML = '<div class="empty">Impossible de charger ta progression pour le moment.</div>'; return; }
  if(!Array.isArray(sessions) || !sessions.length){
    document.getElementById('tabBody').innerHTML = '<div class="empty">Pas encore de séance enregistrée. Ton suivi apparaîtra ici dès ta première séance.</div>';
    return;
  }

  const byEx = {};
  rows.forEach(r=>{
    if(r.charge==null || !r.sessions || !r.sessions.started_at) return;
    const key = r.exercise_id;
    if(!byEx[key]) byEx[key] = { name: (r.exercises && r.exercises.name) || 'Exercice', bySession:{} };
    const cur = byEx[key].bySession[r.session_id];
    if(!cur || r.charge > cur.charge) byEx[key].bySession[r.session_id] = { date: r.sessions.started_at, charge: r.charge };
  });
  const cards = Object.values(byEx)
    .map(ex => ({ name: ex.name, points: Object.values(ex.bySession).sort((a,b)=> new Date(a.date)-new Date(b.date)) }))
    .filter(ex => ex.points.length)
    .sort((a,b)=> b.points.length - a.points.length);

  let html = frequencyCardHtml(sessions) + volumeCardHtml(rows);
  html += cards.length ? cards.map(progressionCardHtml).join('') : '<div class="empty">Pas encore de charges enregistrées par exercice. Elles apparaîtront ici dès ta première séance où tu notes des poids.</div>';
  document.getElementById('tabBody').innerHTML = html;
}
function weekKey(d){
  const date = new Date(d);
  const day = (date.getDay()+6)%7; // lundi=0
  date.setDate(date.getDate()-day);
  date.setHours(0,0,0,0);
  return date.toISOString().slice(0,10);
}
function frequencyCardHtml(sessions){
  const weeks = [];
  const today = new Date();
  for(let i=7;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i*7);
    weeks.push(weekKey(d));
  }
  const counts = {};
  weeks.forEach(w=> counts[w]=0);
  sessions.forEach(s=>{
    const wk = weekKey(s.started_at);
    if(wk in counts) counts[wk]++;
  });
  const max = Math.max(1, ...Object.values(counts));
  const barW = 24, gap = 10, h = 70;
  const bars = weeks.map((w,i)=>{
    const c = counts[w];
    const bh = Math.max(Math.round((c/max) * (h-16)), c>0?3:0);
    const x = i*(barW+gap);
    return `<rect x="${x}" y="${h-bh}" width="${barW}" height="${bh}" rx="4" style="fill:var(--accent);"/>
      <text x="${x+barW/2}" y="${h+14}" text-anchor="middle" style="font-size:9px; fill:var(--ink-muted);">${c}</text>`;
  }).join('');
  const totalW = weeks.length*(barW+gap)-gap;
  const thisWeekCount = counts[weeks[weeks.length-1]];
  return `<div class="card progress-card">
    <h3>Fréquence des séances</h3>
    <p>${sessions.length} séance${sessions.length>1?'s':''} au total · ${thisWeekCount} cette semaine</p>
    <svg width="${totalW}" height="${h+20}" viewBox="0 0 ${totalW} ${h+20}">${bars}</svg>
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">8 dernières semaines</p>
  </div>`;
}
function volumeCardHtml(rows){
  const bySession = {};
  rows.forEach(r=>{
    if(r.reps==null || r.charge==null || !r.sessions || !r.sessions.started_at) return;
    if(!bySession[r.session_id]) bySession[r.session_id] = { date: r.sessions.started_at, vol:0 };
    bySession[r.session_id].vol += r.reps * r.charge;
  });
  const points = Object.values(bySession).sort((a,b)=> new Date(a.date)-new Date(b.date)).slice(-10);
  if(!points.length){
    return `<div class="card progress-card"><h3>Volume total</h3><p>Pas encore assez de données (poids ET répétitions notés sur une même séance) pour calculer ton volume d'entraînement.</p></div>`;
  }
  const w = 280, h = 64, pad = 8;
  const vols = points.map(p=>p.vol);
  const max = Math.max(...vols) || 1;
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = points.length>1 ? pad+i*stepX : w/2;
    const y = h-pad-(p.vol/max)*(h-2*pad);
    return [x,y];
  });
  const poly = coords.map(c=> c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" style="fill:var(--accent);"/>`).join('');
  const last = points[points.length-1].vol;
  const first = points[0].vol;
  const delta = Math.round(last-first);
  let deltaTxt;
  if(points.length < 2) deltaTxt = `1 séance avec volume calculé`;
  else if(delta > 0) deltaTxt = `+${delta} kg de volume depuis ta première séance notée ici`;
  else if(delta < 0) deltaTxt = `${delta} kg de volume depuis ta première séance notée ici`;
  else deltaTxt = `Volume stable depuis ta première séance notée ici`;
  return `<div class="card progress-card">
    <h3>Volume total</h3>
    <p>${deltaTxt}</p>
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${poly}" style="fill:none; stroke:var(--accent); stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">Volume = répétitions × charge, cumulé sur toutes les séries d'une séance · ${points.length} dernière${points.length>1?'s':''} séance${points.length>1?'s':''} avec données complètes.</p>
  </div>`;
}
function progressionCardHtml(ex){
  const pts = ex.points;
  const last = pts[pts.length-1].charge;
  const first = pts[0].charge;
  const delta = Math.round((last-first)*10)/10;
  let deltaTxt;
  if(pts.length < 2) deltaTxt = `1 séance enregistrée`;
  else if(delta > 0) deltaTxt = `+${delta} kg depuis ta première séance notée`;
  else if(delta < 0) deltaTxt = `${delta} kg depuis ta première séance notée`;
  else deltaTxt = `Charge stable depuis ta première séance notée`;

  let svg = '';
  if(pts.length > 1){
    const w = 280, h = 64, pad = 8;
    const charges = pts.map(p=>p.charge);
    const min = Math.min(...charges), max = Math.max(...charges);
    const range = (max - min) || 1;
    const stepX = (w - 2*pad) / (pts.length - 1);
    const coords = pts.map((p,i)=>{
      const x = pad + i*stepX;
      const y = h - pad - ((p.charge - min) / range) * (h - 2*pad);
      return [x, y];
    });
    const poly = coords.map(c=> c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" style="fill:var(--accent);"/>`).join('');
    svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${poly}" style="fill:none; stroke:var(--accent); stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  }
  return `<div class="card progress-card">
    <h3>${ex.name}</h3>
    <p>${deltaTxt}</p>
    ${svg}
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">Dernière charge notée : ${last} kg · ${pts.length} séance${pts.length>1?'s':''} suivie${pts.length>1?'s':''}</p>
  </div>`;
}

function weightChartHtml(logs){

    return `<div class="card progress-card"><h3>Évolution du poids</h3><p>Ajoute au moins deux pesées pour voir ta courbe d'évolution.</p></div>`;
  }
  const w = 280, h = 64, pad = 8;

  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max-min) || 1;
  const stepX = (w-2*pad)/(pts.length-1);
  const coords = pts.map((p,i)=>{
    const x = pad+i*stepX;
    const y = h-pad-((p.weight_kg-min)/range)*(h-2*pad);
    return [x,y];
  });
  const poly = coords.map(c=> c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=> `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" style="fill:var(--accent);"/>`).join('');
  const first = pts[0].weight_kg, last = pts[pts.length-1].weight_kg;
  const delta = Math.round((last-first)*10)/10;
  let deltaTxt;
  if(delta > 0) deltaTxt = `+${delta} kg depuis ta première pesée affichée`;
  else if(delta < 0) deltaTxt = `${delta} kg depuis ta première pesée affichée`;
  else deltaTxt = `Poids stable depuis ta première pesée affichée`;
  return `<div class="card progress-card">
    <h3>Évolution du poids</h3>
    <p>${deltaTxt}</p>
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline points="${poly}" style="fill:none; stroke:var(--accent); stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <p style="margin-top:8px;color:var(--ink-muted);font-size:12px;">Dernier poids noté : ${last} kg · ${pts.length} pesée${pts.length>1?'s':''} affichée${pts.length>1?'s':''}</p>
  </div>`;
}
function bodyLogsListHtml(logs){
  if(!logs.length) return '<div class="empty">Aucune pesée enregistrée pour l\'instant.</div>';

async function addBodyLog(){
  const weightEl = document.getElementById('newWeight');
  const waistEl = document.getElementById('newWaist');

      body: JSON.stringify({ user_id: getSession().user.id, weight_kg: weight, waist_cm: waist })

async function deleteBodyLog(id){

let chatPoll = null; let conversationId = null;
async function loadChat(){
  document.getElementById('tabBody').innerHTML = `<div class="chat-box"><div class="chat-msgs" id="chatMsgs"><div class="empty">Chargement…</div></div>
    <div class="chat-input"><input id="chatInput" type="text" placeholder="Écris un message…" onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Envoyer</button></div></div>`;
  let convs = await (await apiFetch(`/rest/v1/conversations?select=id&limit=1`)).json();
  if(!convs.length){
    convs = await (await apiFetch(`/rest/v1/conversations`, { method:'POST', headers:{Prefer:'return=representation'}, body: JSON.stringify({ user_id: getSession().user.id }) })).json();
  }
  conversationId = convs[0].id;
  await refreshMessages();
  apiFetch(`/rest/v1/messages?conversation_id=eq.${conversationId}&sender=eq.coach&read=eq.false`, { method:'PATCH', body: JSON.stringify({ read:true }) }).catch(()=>{});
  clearInterval(chatPoll);
  chatPoll = setInterval(()=>{ if(currentTab==='chat') refreshMessages(); }, 5000);
}
async function refreshMessages(){
  const res = await apiFetch(`/rest/v1/messages?select=*&conversation_id=eq.${conversationId}&order=created_at`);
  const msgs = await res.json();
  const box = document.getElementById('chatMsgs');
  if(!box) return;
  box.innerHTML = msgs.length ? msgs.map(m=>`<div class="msg ${m.sender}">${escapeHtml(m.content)}</div>`).join('') : '<div class="empty">Dis bonjour à ton coach 👋</div>';
  box.scrollTop = box.scrollHeight;
}
async function sendMessage(){
  const input = document.getElementById('chatInput');
  const content = input.value.trim();
  if(!content) return;
  input.value = '';
  const box = document.getElementById('chatMsgs');
  let tmp = null;
  if(box){
    const empty = box.querySelector('.empty');
    if(empty) empty.remove();
    tmp = document.createElement('div');
    tmp.className = 'msg user'; tmp.textContent = content;
    box.appendChild(tmp);
    box.scrollTop = box.scrollHeight;
  }
  try{
    const res = await apiFetch(`/rest/v1/messages`, { method:'POST', body: JSON.stringify({ conversation_id: conversationId, sender:'user', content }) });
    if(!res.ok) throw new Error('send_failed');
    await refreshMessages();
  }catch(e){
    if(tmp){ tmp.style.opacity = '0.5'; tmp.title = "Échec de l'envoi — réessaie."; }
    input.value = content;
    alert("Ton message n'a pas pu être envoyé. Réessaie.");
  }
}

async function loadProfil(){
  const s = getSession();
  const res = await apiFetch(`/rest/v1/profiles?select=*&id=eq.${s.user.id}`);
  const profiles = await res.json();
  const p = profiles[0] || {};
  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="profile-row"><span>Nom</span><b>${escapeHtml(p.full_name || '—')}</b></div>
      <div class="profile-row"><span>Email</span><b>${escapeHtml(s.user.email)}</b></div>
      <div class="profile-row"><span>Statut</span><b>${p.role==='admin' ? 'Coach (admin)' : 'Client'}</b></div>
    </div>
    <button class="btn btn-ghost btn-block" onclick="logout()">Se déconnecter</button>
  `;
}

// ---------- Boot ----------
(function boot(){
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  if(hashParams.get('type') === 'recovery' && hashParams.get('access_token')){
    renderResetPassword(hashParams.get('access_token'));
    return;
  }
  const s = getSession();
  if(s && s.access_token){ renderDashboard(); } else { renderAuth(); }
})();

function trackVisit(){
  try{
    let vid = localStorage.getItem('hs_visitor_id');
    if(!vid){ vid = crypto.randomUUID(); localStorage.setItem('hs_visitor_id', vid); }
    let uid = null;
    try{ const s = JSON.parse(localStorage.getItem('hs_session')||'null'); if(s && s.user && s.user.id) uid = s.user.id; }catch(e){}
    fetch(`${SUPABASE_URL}/rest/v1/rpc/track_visit`, {
      method:'POST',
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: vid, p_user_id: uid })
    }).catch(()=>{});
  }catch(e){}
}
trackVisit();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(function(){
  const KEY = 'hs_install_dismissed_v1';
  if (localStorage.getItem(KEY)) return;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;

  function showBanner(html, onInstall){
    const bar = document.createElement('div');
    bar.className = 'install-banner show';
    bar.innerHTML = html;
    document.body.appendChild(bar);
    document.body.classList.add('has-install-banner');
    const closeBtn = bar.querySelector('.installClose');
    if (closeBtn) closeBtn.addEventListener('click', ()=>{ localStorage.setItem(KEY,'1'); bar.remove(); document.body.classList.remove('has-install-banner'); });
    const installBtn = bar.querySelector('.installGo');
    if (installBtn && onInstall) installBtn.addEventListener('click', onInstall);
  }

  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (isIos) {
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isSafari) {
      showBanner(`
        <p>Installe cette app sur ton écran d'accueil : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);
    }
  } else {
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      deferredPrompt = e;
      showBanner(`
        <p>Installe HS Coaching sur ton appareil pour un accès rapide, même hors-ligne.</p>
        <div class="btn-row">
          <button class="installGo" style="background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;">Installer</button>
          <button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
      `, async ()=>{
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        localStorage.setItem(KEY,'1');
        const el = document.querySelector('.install-banner'); if (el) el.remove();
        document.body.classList.remove('has-install-banner');
      });
    });
  }
})();
</script>
