<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>HS Coaching — Programmes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#0b0b0c; --surface:#16171a; --surface-2:#1f2024; --line:#2c2c30;
    --ink:#f5f5f5; --ink-muted:#9a9a9e; --accent:#ffffff; --accent-ink:#0b0b0c;
    --ok:#ffffff; --radius:14px; box-sizing:border-box; color-scheme:dark;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  h1,h2,h3,.display{font-family:'Cinzel',sans-serif; letter-spacing:.02em; line-height:.95;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:900px; margin:0 auto; padding:0 20px;}

  header.top{position:sticky; top:0; z-index:20; background:rgba(11,11,12,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px);}
  .top-inner{display:flex; align-items:center; gap:14px; padding:14px 20px; max-width:900px; margin:0 auto;}
  .mark{width:40px; height:40px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center;
    flex:none; font-family:'Cinzel'; font-size:19px; color:var(--accent-ink);}
  .brand{flex:1; min-width:0;}
  .brand .b1{font-size:15px; font-weight:700;}
  .brand .b2{font-size:12px; color:var(--ink-muted);}
  .nav-link{font-size:14px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:8px 14px; border-radius:999px; white-space:nowrap;}
  .nav-link:hover{color:var(--ink); border-color:var(--accent);}

  main{padding:32px 0 90px;}
  main.wrap{padding:32px 20px 90px;}
  .eyebrow{color:var(--accent); font-weight:700; font-size:13px; margin-bottom:6px;}
  h1.page{font-size:clamp(34px,7vw,52px); margin-bottom:6px;}
  .subtitle{color:var(--ink-muted); font-size:14px; max-width:56ch;}

  .section{margin-top:34px;}
  .section h2{font-size:22px; margin-bottom:14px;}

  .prog-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .prog-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; text-align:left; cursor:pointer;}
  .prog-card:hover{border-color:var(--accent);}
  .prog-card .tag{font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.08em;}
  .prog-card h3{font-size:22px; margin-top:6px; font-family:'Inter'; font-weight:700; letter-spacing:0; color:var(--ink);}
  .prog-card p{color:var(--ink-muted); font-size:13px; margin-top:8px; line-height:1.4;}

  .btn{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; padding:12px 20px; border-radius:999px; border:none; cursor:pointer;}
  .btn-accent{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent);}
  .reps-mode-btn.active{border-color:var(--accent); color:var(--accent); background:var(--surface);}
  .btn-sm{padding:8px 14px; font-size:13px;}
  .btn:disabled{opacity:.5; cursor:default;}

  .actions-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

  .empty{color:var(--ink-muted); font-size:13.5px; padding:16px 0;}
  .promo{margin:34px 0 8px; padding:24px 22px; border-radius:20px; border:1px solid var(--accent); background:linear-gradient(160deg, var(--surface-2,#1f2024), var(--surface,#16171a));}
  .promo .cat{color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.1em; margin-bottom:6px;}
  .promo h2{font-family:'Cinzel'; font-size:30px; line-height:1.05; margin:0 0 10px; letter-spacing:.01em;}
  .promo p{color:var(--ink-muted); font-size:14px; line-height:1.5; margin:0 0 14px;}
  .promo ul{list-style:none; margin:0 0 18px; padding:0; display:grid; gap:8px; font-size:14px;}
  .promo li::before{content:'✓'; color:var(--accent); font-weight:800; margin-right:9px;}
  .promo .btn{width:100%; justify-content:center;}

  #printProgramArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printProgramArea, #printProgramArea *{visibility:visible;}
    #printProgramArea{display:block; position:fixed; inset:0; background:#fff; padding:40px;}
    #printProgramArea h1{font-family:'Cinzel',sans-serif; font-size:34px; color:#000; margin:0 0 6px;}
    #printProgramArea p{color:#333; font-size:14px; margin:0 0 10px;}
    #printProgramArea .pmeta{color:#777; font-size:12px; margin-bottom:18px; text-transform:uppercase; letter-spacing:.5px;}
    #printProgramArea .pex{border-top:1px solid #ccc; padding:12px 0; color:#000;}
    #printProgramArea .pex b{display:block; font-size:16px; margin-bottom:2px;}
    #printProgramArea .pex span{font-size:13px; color:#444;}
  }

  /* Détail programme / séance */
  .backlink{font-size:13px; color:var(--ink-muted); display:inline-block; margin-bottom:16px;}
  .backlink:hover{color:var(--accent);}
  .ex-row{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:10px;}
  .ex-row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ex-name{font-size:17px; font-weight:700; cursor:pointer;}
  .ex-name:hover{color:var(--accent);}
  .ex-meta{color:var(--ink-muted); font-size:12.5px; margin-top:2px;}
  .ex-meta.ss-head{font-weight:700; margin:16px 4px 6px; letter-spacing:.01em;}
  .var-link{display:inline-block; cursor:pointer; padding:6px 0; color:var(--ink);}
  .set-grid{margin-top:12px; display:flex; flex-direction:column; gap:10px;}
  .set-line{display:flex; align-items:center; gap:6px; font-size:13px;}
  .set-line .setnum{width:24px; color:var(--ink-muted); flex:none; font-weight:700;}
  .set-line input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink);
    padding:12px 4px; font-size:16px; font-family:inherit; text-align:center;
  }
  .set-line[data-timed="1"]{flex-wrap:wrap;}
  .set-line .dist-wrap{flex-basis:100%; display:flex; align-items:center; gap:6px; padding-left:30px; font-size:12px; color:var(--ink-muted);}
  .set-line .dist-wrap .pace{margin-left:6px; color:var(--ink); font-weight:600;}
  .set-line .unit{color:var(--ink-muted); font-size:11px; flex:none;}
  .set-line .valid{
    margin-left:4px; width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink-muted); cursor:pointer; flex:none; font-size:17px;
  }
  .set-line .chrono-btn{margin-left:4px; width:42px; height:42px; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; flex:none; font-size:15px;}
  .set-line .chrono-btn.on{background:var(--accent); color:#111;}
  .chrono-row{display:flex; align-items:center; gap:12px; padding:12px 14px; margin:6px 0 4px; border:1px solid var(--accent); border-radius:14px; background:var(--surface-2);}
  .chrono-row .cr-main{flex:1; min-width:0;}
  .chrono-row .cr-time{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05;}
  .chrono-row .cr-sub{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .chrono-row.alarm{animation:crFlash .6s ease-in-out 6; border-color:var(--ok);}
  @keyframes crFlash{0%,100%{background:var(--surface-2);}50%{background:var(--ok); color:#04170c;}}
  .set-line .valid.err{background:#7a1f1f; border-color:#d33; color:#fff;}
  .set-line .valid.done{background:var(--ok); border-color:var(--ok); color:#04170c;}

  .session-bar{position:sticky; bottom:0; padding:14px 0; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg, var(--bg) 60%, transparent); margin-top:10px;}
  body.has-install-banner .session-bar{margin-bottom:70px;}
  .day-block{margin-top:22px; padding-top:6px; border-top:1px solid var(--line);}
  .day-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .day-head h2{font-size:26px;}
  .day-count{font-size:12px; color:var(--ink-muted); flex:none;}
  .day-tabs{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 8px;}
  .day-chip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:999px; padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .day-chip.active{background:var(--surface-2); border-color:var(--accent); color:var(--accent);}
  .day-chip.add{border-style:dashed;}
  .day-tools{display:flex; gap:8px; margin-bottom:12px;}
  .sess-timer{display:flex; align-items:center; gap:8px; margin-bottom:10px; min-height:42px;}
  .sess-elapsed{flex:none; font-size:12.5px; color:var(--ink-muted); font-variant-numeric:tabular-nums; font-weight:600;}
  .rest-chips{display:flex; gap:6px; flex:1; justify-content:flex-end; align-items:center;}
  .rest-label{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; margin-right:2px;}
  .rest-chip{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 11px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; font-variant-numeric:tabular-nums;}
  .rest-run{display:none; flex:1; align-items:center; justify-content:flex-end; gap:12px;}
  .rest-count{font-size:30px; font-weight:800; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
  .rest-stop{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .sess-timer.running .rest-chips{display:none;}
  .sess-timer.running .rest-run{display:flex;}
  .origin-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .origin-pill{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); text-transform:none; letter-spacing:0;}
  .origin-pill.coach{color:#7ee0a0; border-color:rgba(126,224,160,.4); background:rgba(126,224,160,.1);}
  .origin-pill.client{color:#8ab4ff; border-color:rgba(138,180,255,.4); background:rgba(138,180,255,.1);}
  .origin-pill.visitor{color:#ffb86b; border-color:rgba(255,184,107,.4); background:rgba(255,184,107,.1);}
  .origin-pill.unknown{color:var(--ink-muted); border-style:dashed;}
  .origin-for{font-size:12.5px; color:var(--ink-muted);}
  .fchips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .fchip{background:var(--surface); border:1px solid var(--line); color:var(--ink-muted); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .fchip span{opacity:.7; margin-left:3px;}
  .fchip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .resume-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; margin-bottom:16px;}
  .resume-banner .rb-text b{display:block; font-size:14px;}
  .resume-banner .rb-text span{display:block; font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  .resume-banner .rb-actions{display:flex; gap:8px;}
  .man-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 14px;}
  .man-meta .field{margin:0;}
  @media (max-width:420px){ .man-meta{grid-template-columns:1fr;} }
  .fin-overlay{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:16px;}
  .fin-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .fin-card h3{font-size:18px; margin-bottom:12px;}
  .fin-hint{font-size:12.5px; color:var(--ink-muted); margin:8px 0 14px; line-height:1.4;}
  .fin-actions{display:flex; flex-direction:column; gap:8px;}
  .sess-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:18px 0 22px;}
  .sess-summary > div{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 10px; text-align:center;}
  .sess-summary b{display:block; font-size:26px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
  .sess-summary span{display:block; font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}

  /* Formulaire création programme */
  .field{margin-top:14px;}
  .field label{font-size:12.5px; color:var(--ink-muted); display:block; margin-bottom:6px; font-weight:600;}
  .field input, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--ink);
    padding:12px 14px; font-size:14px; font-family:inherit;
  }
  .field textarea{min-height:70px; resize:vertical;}
  .picker{display:flex; gap:8px; margin-top:10px;}
  .picker select{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px; font-family:inherit;}
  .pick-ex-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px;
    max-height:300px; overflow-y:auto; padding:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-top:8px;
  }
  .pick-ex-card{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:10px;
    padding:6px; cursor:pointer; text-align:center; font-family:inherit; font-size:10.5px; color:var(--ink);
  }
  .pick-ex-card .pick-ex-img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; background:var(--surface);}
  .pick-ex-card .pick-ex-noimg{width:100%; aspect-ratio:1/1; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-muted); font-size:9px; text-transform:uppercase; letter-spacing:.05em; padding:4px;}
  .pick-ex-card span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.2;}
  .pick-ex-card.selected{border-color:var(--accent); background:var(--surface);}
  .draft-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-top:8px; font-size:13.5px;}
  .draft-row{flex-wrap:wrap;}
  .draft-main{flex:1; min-width:140px; line-height:1.35;}
  .draft-actions{display:flex; gap:6px; align-items:center; margin-left:auto;}
  .draft-var{font-size:12px; color:var(--ink-muted); margin-top:3px;}
  .rm-var{background:none; border:none; color:var(--ink-muted); cursor:pointer; font-size:12px; padding:0 4px;}
  .mini-btn{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-muted); cursor:pointer; font-size:14px; font-family:inherit;}
  .mini-btn.on{border-color:var(--accent); color:var(--accent);}
  .mini-btn:disabled{opacity:.35; cursor:default;}
  .draft-row.in-ss, .ex-row.in-ss{border-left:3px solid var(--accent);}
  .ss-chip{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.06em; padding:2px 7px; border-radius:999px; border:1px solid var(--accent); color:var(--accent); vertical-align:middle;}
  .ss-block{border-left:3px solid var(--accent);}
  .ss-tag{font-size:12.5px; color:var(--ink-muted); margin-bottom:6px;}
  .ss-round{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin-top:8px;}
  .ss-cap{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; font-weight:700; margin-top:2px;}
  .ss-cap-name{cursor:pointer;}
  .var-btn{flex:none; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:7px 11px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; max-width:48%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .draft-row .rm{margin-left:0; color:var(--ink-muted); cursor:pointer; background:none; border:none; font-size:16px;}

  /* Overlay générique (fiche exo / contact / création) */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.72); display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{width:100%; max-width:620px; max-height:92vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-top-left-radius:22px; border-top-right-radius:22px; padding:26px 24px calc(28px + env(safe-area-inset-bottom,0px));}
  @media(min-width:700px){.overlay{align-items:center;} .sheet{border-radius:22px; max-height:86vh;}}
  .sheet-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .closeBtn{flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:17px; cursor:pointer;}
  .cat{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.08em;}
  .sheet h2{font-size:34px; margin-top:6px;}
  .sheet p.lede{color:var(--ink-muted); margin-top:10px; font-size:14px;}
  .block{margin-top:20px;}
  .block h4{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); font-weight:700; margin-bottom:8px;}
  .points{list-style:none;}
  .points li{font-size:14px; padding:9px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-start;}
  .points li:before{content:"→"; color:var(--accent); font-weight:700;}
  .muscle-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .muscle-tag{font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--ink-muted); background:var(--surface-2);}
  .muscle-tag.primary{background:var(--ink); border-color:var(--ink); color:var(--bg);}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line);
    padding:12px 20px; border-radius:999px; font-size:13.5px; z-index:80; display:none;}
  body:has(.session-bar) .toast{ bottom:calc(24px + 130px + env(safe-area-inset-bottom,0px)); }

  footer{border-top:1px solid var(--line); padding:26px 0; text-align:center; color:var(--ink-muted); font-size:12.5px; margin-top:40px;}

  .navrow{display:flex; gap:8px; max-width:900px; margin:0 auto; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:1; text-align:center; font-size:13.5px; font-weight:600; color:var(--ink-muted); border:1px solid var(--line); padding:10px 14px; border-radius:999px; white-space:nowrap; text-decoration:none;}
  .navrow a.active{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .navrow a{position:relative;}
  .nav-dot{position:absolute; top:5px; right:10px; width:8px; height:8px; border-radius:50%; background:#ff5a4e; border:1.5px solid var(--bg);}

  .install-banner{position:fixed; left:12px; right:12px; bottom:12px; z-index:40; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .install-banner.show{display:flex;}
  .install-banner p{flex:1; font-size:13px; color:var(--ink); margin:0; line-height:1.4;}
  .install-banner .btn-row{display:flex; gap:8px; flex:none; align-items:center;}

  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
    .picker{ flex-direction:column; align-items:stretch; }
    .picker select, .picker input{ width:100% !important; }
  }

function getUserSession(){ try{ return JSON.parse(localStorage.getItem('hs_session')||'null'); }catch(e){ return null; } }
function isLoggedIn(){ const s = getUserSession(); return !!(s && s.access_token); }
async function refreshIfNeeded(){
  const s = getUserSession();
  if(!s || !s.refresh_token) return;
  const exp = (s.expires_at || 0) * 1000;
  if(exp && Date.now() < exp - 60000) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method:'POST', headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const data = await res.json();
    if(res.ok && data.access_token) localStorage.setItem('hs_session', JSON.stringify(data)); else localStorage.removeItem('hs_session');
  }catch(e){}
}
async function authedFetch(path, opts={}){
  await refreshIfNeeded();
  const s = getUserSession();
  return fetch(`${SUPABASE_URL}${path}`, { ...opts, headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s ? s.access_token : ''}`, 'Content-Type':'application/json', ...(opts.headers||{}) } });
}

// Réseau mobile capricieux (salle, tunnel, réveil de l'appli) : on réessaie, puis on retombe sur la dernière copie connue.
async function withRetry(fn, tries, delayMs){
  let err;
  for(let i = 0; i < tries; i++){
    try{ return await fn(); }catch(e){ err = e; if(i < tries - 1) await new Promise(r => setTimeout(r, delayMs * (i + 1))); }
  }
  throw err;
}
function progCacheKey(programId){ return 'hs_prog_items_' + programId; }
async function programExercisesFor(programId){
  const load = async () => {
    if(isLoggedIn()){
      const res = await authedFetch(`/rest/v1/program_exercises?select=*&program_id=eq.${programId}&order=order_index`);
      if(!res.ok) throw new Error('program_exercises_' + res.status);
      const rows = await res.json();
      if(!Array.isArray(rows)) throw new Error('program_exercises_format');
      return rows;
    }
    const rows = await rpc('guest_program_exercises', { p_token: TOKEN, p_program_id: programId });
    // Les lignes "désactivées" (sets=0) lors d'une modification côté invité ne doivent plus s'afficher.
    return rows.filter(r => r.sets !== 0);
  };
  try{
    const rows = await withRetry(load, 3, 700);
    try{ localStorage.setItem(progCacheKey(programId), JSON.stringify(rows)); }catch(e){}
    return rows;
  }catch(e){
    console.error(e);
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(progCacheKey(programId)) || 'null'); }catch(_){}
    if(Array.isArray(cached)){ toast('Connexion instable : programme enregistré sur ton téléphone'); return cached; }
    throw e;
  }
}

// ---------- Séances d'un programme ----------
// Un programme = une ou plusieurs séances. Chaque ligne d'exercice porte un day_label ;
// les lignes sans label (anciens programmes) forment une seule séance.
function groupByDay(items){
  const groups = [];
  const byLabel = {};
  items.forEach(it=>{
    const label = it.day_label || 'Séance 1';
    if(!byLabel[label]){ byLabel[label] = { label, items: [] }; groups.push(byLabel[label]); }
    byLabel[label].items.push(it);
  });
  return groups;
}
// Supersets : des exercices consécutifs qui partagent le même superset_group s'enchaînent sans repos.
// Étiquettes A1, A2, B1… (une lettre par superset, un numéro par exercice).
function supersetTags(items){
  const tags = []; let letter = -1, pos = 0, prevG = null;
  items.forEach(it=>{
    const g = it.superset_group;
    if(g == null){ tags.push(null); prevG = null; return; }
    if(g === prevG){ pos++; } else { letter++; pos = 1; prevG = g; }
    tags.push(String.fromCharCode(65 + letter) + pos);
  });
  return tags;
}
function restLabel(sec){ sec = parseInt(sec) || 0; if(sec <= 0) return ''; if(sec < 60) return sec + 's'; const m = Math.floor(sec/60), s = sec % 60; return s ? `${m} min ${s}s` : `${m} min`; }
// Dans un superset, le repos ne s'affiche qu'une fois : sur le dernier exercice du bloc (repos après le tour)
function showRestAt(list, i){ const it = list[i]; if(!it || it.superset_group == null) return true; const n = list[i+1]; return !(n && n.superset_group === it.superset_group); }
// Un superset = un bloc : séries, reps et repos sont annoncés une seule fois, dans un en-tête de bloc
function ssBlockOf(list, i){ const g = list[i].superset_group; let a = i, b = i; while(a > 0 && list[a-1].superset_group === g) a--; while(b < list.length-1 && list[b+1].superset_group === g) b++; return list.slice(a, b+1); }
function ssBlockInfo(list, i){
  const blk = ssBlockOf(list, i), first = blk[0], last = blk[blk.length-1];
  const sameSets = blk.every(x => x.sets === first.sets), sameReps = blk.every(x => (x.reps||'') === (first.reps||''));
  return { sameSets, sameReps, sets: first.sets, reps: first.reps, rest: last.rest_seconds };
}
function ssHeadText(info, tag){
  const bits = [];
  if(info.sameSets) bits.push(`${info.sets||'-'} séries` + (info.sameReps ? ` × ${info.reps||'-'}` : ''));
  if(restLabel(info.rest)) bits.push(`repos ${restLabel(info.rest)} après chaque tour`);
  return `Superset ${String(tag||'A').charAt(0)}` + (bits.length ? ' · ' + bits.join(' · ') : '');
}

async function checkClientNotifications(){

    const convs = await fetch(`${SUPABASE_URL}/rest/v1/conversations?select=id&user_id=eq.${uid}&limit=1`, { headers }).then(r=>r.json());

    if(!hasNotif){
      const assigned = await fetch(`${SUPABASE_URL}/rest/v1/programs?select=id&owner_user_id=eq.${uid}`, { headers }).then(r=>r.json());

let othersOpen = false;
let FP = null, fpTimer = null;
function fpUid(){ const u = getUserSession(); return (u && u.user && u.user.id) || 'guest'; }
function fpKey(){ return 'hs_prog_folders_' + fpUid(); }
function normFP(v){ v = v || {}; return { folders: Array.isArray(v.folders) ? v.folders.filter(f=>f&&f.id&&f.name) : [], map: (v.map && typeof v.map === 'object') ? v.map : {}, seeded: !!v.seeded }; }
function readLocalFP(){ try{ return JSON.parse(localStorage.getItem(fpKey())||'null'); }catch(e){ return null; } }
function mergeFP(a, b){
  a = normFP(a); b = normFP(b);
  const ids = new Set(a.folders.map(f=>f.id));
  return { folders: a.folders.concat(b.folders.filter(f=>!ids.has(f.id))), map: Object.assign({}, b.map, a.map), seeded: a.seeded || b.seeded };
}
function seedFP(v){
  // Coach : dossier « Coaching » créé une fois pour ranger les programmes faits pour les clients
  if(isCoachView() && !v.seeded){
    if(!v.folders.some(f=>f.id==='coaching')) v.folders.unshift({ id:'coaching', name:'Coaching' });
    try{ const o = JSON.parse(localStorage.getItem('hs_coaching_prefs')||'null'); if(o){ (o.add||[]).forEach(id=>{ if(!v.map[id]) v.map[id]='coaching'; }); (o.rm||[]).forEach(id=>{ if(!v.map[id]) v.map[id]='none'; }); } }catch(e){}
    v.seeded = true;
  }
  return v;
}
function folderPrefs(){ if(!FP) FP = seedFP(normFP(readLocalFP())); return FP; }
async function pushFP(){
  const v = folderPrefs();
  try{
    if(isLoggedIn()){
      const r = await authedFetch('/rest/v1/prog_folders?on_conflict=user_id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: getUserSession().user.id, data: v, updated_at: new Date().toISOString() }) });
      if(!r.ok) throw new Error(await r.text());
    } else {
      await rpc('guest_set_folders', { p_token: TOKEN, p_data: v });
    }
  }catch(e){ console.error('folders sync', e); }
}
function saveFolderPrefs(v){
  FP = v;
  try{ localStorage.setItem(fpKey(), JSON.stringify(v)); }catch(e){}
  clearTimeout(fpTimer); fpTimer = setTimeout(pushFP, 400);
}
async function loadFolderPrefs(){
  FP = null;
  let local = readLocalFP();
  if(!local){ try{ const old = JSON.parse(localStorage.getItem('hs_prog_folders')||'null'); if(old && isCoachView()) local = old; }catch(e){} } // v136
  let remote = null, ok = true;
  try{
    if(isLoggedIn()){
      const r = await authedFetch('/rest/v1/prog_folders?select=data&limit=1');
      if(!r.ok) throw new Error(await r.text());
      const rows = await r.json(); remote = rows && rows[0] ? rows[0].data : null;
      // dossiers créés en visiteur avant la connexion : on les rapatrie dans le compte
      try{
        const g = await rpc('guest_get_folders', { p_token: TOKEN });
        if(g && Array.isArray(g.folders) && g.folders.length){
          remote = mergeFP(remote, g); FP = seedFP(normFP(remote)); await pushFP();
          await rpc('guest_set_folders', { p_token: TOKEN, p_data: { folders:[], map:{} } });
        }
      }catch(e){}
    } else {
      remote = await rpc('guest_get_folders', { p_token: TOKEN });
    }
  }catch(e){ console.error(e); ok = false; }
  if(remote && (remote.folders || remote.map)) FP = seedFP(normFP(remote));
  else FP = seedFP(normFP(local));
  try{ localStorage.setItem(fpKey(), JSON.stringify(FP)); }catch(e){}
  // première synchro ou données locales seulement : on les envoie en base
  if(ok && !(remote && (remote.folders || remote.map)) && (FP.folders.length || Object.keys(FP.map).length)) pushFP();
}
function folderOf(p){
  if(p.is_official) return null;
  const v = folderPrefs(); const m = v.map[p.id];
  if(m === 'none') return null;
  if(m && v.folders.some(f=>f.id===m)) return m;
  const s = getUserSession();
  if(!m && isCoachView() && s && s.user && p.owner_user_id !== s.user.id && progOrigin(p) === 'coach' && v.folders.some(f=>f.id==='coaching')) return 'coaching';
  return null;
}

// ---- Chrono des séries chronométrées (compte vers l'objectif, alerte visuelle + vibration + son) ----
function parseTargetSec(str){
  str = String(str || '');
  const one = t => {
    const m = t.match(/(\d+)\s*min/i), s = t.match(/(\d+)\s*(?:s\b|sec|")/i);
    return (m ? parseInt(m[1]) * 60 : 0) + (s ? parseInt(s[1]) : 0);
  };
  let lo = 0, hi = 0;
  const r = str.match(/(\d+)\s*-\s*(\d+)\s*(min|s\b|sec)/i);
  if(r){ const u = /min/i.test(r[3]) ? 60 : 1; lo = parseInt(r[1]) * u; hi = parseInt(r[2]) * u; }
  else if(/\sà\s/.test(str)){ const [a, b] = str.split(/\sà\s/); lo = one(a); hi = one(b); }
  else { lo = hi = one(str); }
  if(!lo) return null;
  if(hi < lo) hi = lo;
  return { lo, hi };
}
let setChrono = null;
const CHRONO_SOUND = false;   // son du chrono désactivé pour l'instant (passer à true pour le réactiver)
function chronoBeep(ctx){
  try{
    if(!ctx) return;
    [0, .35, .7].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.4, ctx.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + d + .25);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .28); });
  }catch(e){}
}
function chronoAlarm(msg){
  try{ if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]); }catch(e){}
  if(CHRONO_SOUND) chronoBeep(setChrono && setChrono.ctx);
  const row = document.getElementById('chronoRow');
  if(row){ row.classList.remove('alarm'); void row.offsetWidth; row.classList.add('alarm'); }
  toast(msg);
}
function toggleSetChrono(btn){
  const line = btn.closest('.set-line');
  if(setChrono && setChrono.line === line){ stopSetChrono(true); return; }
  if(setChrono) stopSetChrono(true);
  startSetChrono(line, Date.now());
}
function startSetChrono(line, start){
  const lo = parseInt(line.dataset.lo) || 0, hi = parseInt(line.dataset.hi) || lo;
  let ctx = null;
  try{ const AC = CHRONO_SOUND && (window.AudioContext || window.webkitAudioContext); if(AC){ ctx = new AC(); ctx.resume(); } }catch(e){}
  setChrono = { line, start, lo, hi, firedLo: false, firedHi: false, ctx, wake: null, tick: null };
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { if(setChrono) setChrono.wake = w; else w.release(); }).catch(()=>{}); }catch(e){}
  const b = line.querySelector('.chrono-btn'); if(b){ b.classList.add('on'); b.textContent = '■'; b.setAttribute('aria-label','Arrêter le chrono'); }
  const old = document.getElementById('chronoRow'); if(old) old.remove();
  const row = document.createElement('div'); row.className = 'chrono-row'; row.id = 'chronoRow';
  row.innerHTML = `<div class="cr-main"><div class="cr-time" id="crTime">00:00</div><div class="cr-sub" id="crSub"></div></div><button type="button" class="btn btn-accent" onclick="stopSetChrono(true)">■ Terminer</button>`;
  line.after(row);
  try{ localStorage.setItem('hs_set_chrono', JSON.stringify({ slot: line.dataset.slot, set: line.dataset.set, start })); }catch(e){}
  setChrono.tick = setInterval(setChronoTick, 250);
  setChronoTick();
}
function setChronoTick(){
  const c = setChrono; if(!c) return;
  if(!document.body.contains(c.line)){ stopSetChrono(false); return; }
  const el = Math.floor((Date.now() - c.start) / 1000);
  const t = document.getElementById('crTime'), sub = document.getElementById('crSub');
  if(t) t.textContent = fmtClock(el * 1000);
  if(sub){
    if(!c.lo) sub.textContent = 'Appuie sur Terminer quand tu as fini';
    else if(el < c.lo) sub.textContent = `Reste ${fmtClock((c.lo - el) * 1000)} · objectif ${fmtClock(c.lo * 1000)}`;
    else if(c.hi > c.lo && el < c.hi) sub.textContent = `✅ Objectif atteint · tu peux continuer jusqu'à ${fmtClock(c.hi * 1000)}`;
    else sub.textContent = `✅ Objectif atteint · +${fmtClock((el - (c.hi || c.lo)) * 1000)}`;
  }
  if(c.lo && el >= c.lo && !c.firedLo){ c.firedLo = true; chronoAlarm('⏱ Temps atteint !'); }
  if(c.hi > c.lo && el >= c.hi && !c.firedHi){ c.firedHi = true; chronoAlarm('⏱ Temps maximum atteint !'); }
}
function stopSetChrono(fill){
  const c = setChrono; if(!c) return;
  clearInterval(c.tick); setChrono = null;
  try{ if(c.wake) c.wake.release(); }catch(e){}
  try{ if(c.ctx) c.ctx.close(); }catch(e){}
  try{ localStorage.removeItem('hs_set_chrono'); }catch(e){}
  const row = document.getElementById('chronoRow'); if(row) row.remove();
  const b = c.line.querySelector('.chrono-btn'); if(b){ b.classList.remove('on'); b.textContent = '▶'; b.setAttribute('aria-label','Lancer le chrono'); }
  if(fill && document.body.contains(c.line)){
    const el = Math.max(1, Math.round((Date.now() - c.start) / 1000));
    const mi = c.line.querySelector('.min-input'), si = c.line.querySelector('.sec-input');
    if(mi && si){ mi.value = Math.floor(el / 60); si.value = el % 60; }
    toast('Durée enregistrée dans la ligne : appuie sur ✓ pour valider');
  }
}
function restoreSetChrono(){
  try{
    const v = JSON.parse(localStorage.getItem('hs_set_chrono') || 'null'); if(!v) return;
    const line = document.querySelector(`.set-line[data-slot="${v.slot}"][data-set="${v.set}"]`);
    if(!line || line.querySelector('.valid.done') || Date.now() - v.start > 6*3600*1000){ localStorage.removeItem('hs_set_chrono'); return; }
    startSetChrono(line, v.start);
  }catch(e){}
}

// Chrono de séance (durée totale) + minuteur de repos.
// Basé sur des horodatages : reste juste même si l'écran se met en veille.
let sessStart = 0, sessTick = null, restEnd = 0, sessDone = {};
function fmtClock(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  const mm = String(m).padStart(2,'0'), ss = String(s).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function sessTickFn(){
  const el = document.getElementById('sessElapsed');
  if(!el){ clearInterval(sessTick); sessTick = null; restEnd = 0; restPushClear(); return; }
  el.textContent = '⏱ ' + fmtClock(Date.now() - sessStart);
  if(restEnd){
    const left = restEnd - Date.now();
    if(left <= 0) endRest(true);
    else { const c = document.getElementById('restCount'); if(c) c.textContent = fmtClock(left + 999); }
  }
}
let restSuggestSec = 0;
// Après la dernière série d'un exercice (ou du dernier exercice d'un tour de superset), on propose le repos prévu
function suggestRest(k){
  const st = slotState[k], b = document.getElementById('restSuggest'); if(!b) return;
  if(!st || !st.restLast || !(st.rest > 0)) return;
  restSuggestSec = st.rest; b.textContent = '▶ Repos prévu ' + fmtClock(st.rest * 1000); b.style.display = '';
}
// Fin de repos « même écran verrouillé » : le serveur enverra une notification push si l'appli n'est plus au premier plan
function restPushSet(atMs){
  try{
    if(!isLoggedIn() || !localStorage.getItem('hs_push_on')) return;
    authedFetch('/rest/v1/rest_timers?on_conflict=user_id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: getUserSession().user.id, fire_at: new Date(atMs + 4000).toISOString() }) }).catch(()=>{});
  }catch(e){}
}
function restPushClear(){
  try{
    if(!isLoggedIn() || !localStorage.getItem('hs_push_on')) return;
    authedFetch('/rest/v1/rest_timers?user_id=eq.' + getUserSession().user.id, { method:'DELETE' }).catch(()=>{});
  }catch(e){}
}
function startRest(sec){
  const sg = document.getElementById('restSuggest'); if(sg) sg.style.display = 'none';
  restEnd = Date.now() + sec*1000;
  restPushSet(restEnd);
  const box = document.getElementById('sessTimer'); if(box) box.classList.add('running');
  sessTickFn();
}
function endRest(alarm){
  restEnd = 0;
  if(!alarm || !document.hidden) restPushClear();   // appli visible : l'écran « Reprendre » suffit, pas de notification en double
  const box = document.getElementById('sessTimer'); if(box) box.classList.remove('running');
  if(!alarm) return;
  showRestOver();
}
// Fin du repos : écran plein « Reprendre » + vibrations répétées jusqu'à l'appui
let restOverVib = null;
function closeRestOver(){
  const o = document.getElementById('restOver'); if(o) o.remove();
  if(restOverVib){ clearInterval(restOverVib); restOverVib = null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}
function showRestOver(){
  if(document.getElementById('restOver') || !document.getElementById('sessElapsed')) return;
  const o = document.createElement('div'); o.id = 'restOver';
  o.setAttribute('role','alertdialog'); o.setAttribute('aria-label','Repos terminé');
  o.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;animation:restFlash 1s ease-in-out infinite';
  o.innerHTML = '<style>@keyframes restFlash{0%,100%{box-shadow:inset 0 0 0 6px rgba(76,217,100,.2)}50%{box-shadow:inset 0 0 0 10px rgba(76,217,100,.9)}}</style>' +
    '<div style="font-size:54px">⏱</div>' +
    '<div style="font-family:Cinzel,serif;font-weight:700;font-size:30px;letter-spacing:.16em">REPOS TERMINÉ</div>' +
    '<div style="opacity:.8;font-size:16px">C\'est reparti pour la prochaine série</div>' +
    '<button type="button" id="restOverBtn" class="btn btn-accent" style="font-size:20px;padding:18px 40px;justify-content:center;margin-top:8px">▶ REPRENDRE</button>';
  document.body.appendChild(o);
  document.getElementById('restOverBtn').onclick = closeRestOver;
  const buzz = () => { try{ if(navigator.vibrate) navigator.vibrate([400,150,400,150,400]); }catch(e){} };
  buzz(); let n = 0;
  restOverVib = setInterval(() => { if(++n > 12 || !document.getElementById('restOver')){ closeRestOver(); return; } buzz(); }, 2500);
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && restEnd && restEnd - Date.now() <= 0 && typeof sessTickFn === 'function') sessTickFn(); });
// Terminer : on demande la durée (pré-remplie avec le chrono) pour pouvoir la corriger
// si le téléphone s'est éteint ou si le chrono n'a pas été lancé à temps.
function finishSession(programId){
  closeRestOver(); restPushClear();
  if(setChrono) stopSetChrono(true);
  const durationMs = Date.now() - sessStart;
  const origMin = Math.max(1, Math.round(durationMs/60000));
  // séries saisies (reps/charge remplies) mais jamais validées avec ✓ : elles ne seraient pas enregistrées
  const pending = [...document.querySelectorAll('.set-line')].filter(l=>{
    const b = l.querySelector('.valid'); if(!b || b.classList.contains('done')) return false;
    if(l.dataset.timed === '1') return ((parseInt(l.querySelector('.min-input').value)||0)*60 + (parseInt(l.querySelector('.sec-input').value)||0)) > 0;
    return !!(parseInt(l.querySelector('.reps-input').value) || parseFloat(l.querySelector('.charge-input').value));
  });
  const pendNames = pending.map(l=>{ const n = document.querySelector(`[data-slotname="${l.dataset.slot}"]`); return (n ? n.textContent.trim() : 'Exercice') + ' · série ' + l.dataset.set; });
  const ov = document.createElement('div');
  ov.className = 'fin-overlay'; ov.id = 'finOverlay';
  ov.innerHTML = `<div class="fin-card">
      <h3>Terminer la séance</h3>
      ${pending.length ? `<div style="border:1px solid #d33;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.4"><b>⚠ ${pending.length} série${pending.length>1?'s':''} saisie${pending.length>1?'s':''} mais pas validée${pending.length>1?'s':''} (✓)</b><br>${pendNames.map(escHtml).join('<br>')}<br><span style="opacity:.8">Elles ne sont pas enregistrées tant que tu n'appuies pas sur ✓.</span></div>` : ''}
      <div class="field"><label for="finMin">Durée de la séance (minutes)</label>
        <input id="finMin" type="number" inputmode="numeric" min="1" max="1440" value="${origMin}"></div>
      <p class="fin-hint">Chrono : ${fmtClock(durationMs)}. Corrige la durée si ton téléphone s'est éteint ou si tu as lancé le chrono en retard.</p>
      <div class="fin-actions">
        <button class="btn btn-accent" id="finOk" style="justify-content:center;">${pending.length ? 'Valider les séries et terminer' : 'Valider'}</button>
        ${pending.length ? '<button class="btn btn-ghost" id="finSkip" style="justify-content:center;">Terminer sans ces séries</button>' : ''}
        <button class="btn btn-ghost" id="finCancel" style="justify-content:center;">Annuler</button>
      </div></div>`;
  document.body.appendChild(ov);
  document.getElementById('finCancel').onclick = ()=> ov.remove();
  let skipPending = false;
  const skipBtn = document.getElementById('finSkip');
  if(skipBtn) skipBtn.onclick = ()=>{ skipPending = true; document.getElementById('finOk').click(); };
  document.getElementById('finOk').onclick = async ()=>{
    const v = parseInt(document.getElementById('finMin').value);
    if(!(v >= 1 && v <= 1440)){ toast('Durée invalide'); return; }
    const edited = v !== origMin;
    const finalMs = edited ? v*60000 : durationMs;
    const okBtn = document.getElementById('finOk'); okBtn.disabled = true;
    if(pending.length && !skipPending){
      for(const l of pending){ const b = l.querySelector('.valid'); if(b && !b.classList.contains('done')){ try{ await validateSetInner(b); }catch(e){} } }
      if(pending.some(l=>!l.querySelector('.valid').classList.contains('done'))){ toast('Certaines séries ne sont pas enregistrées : vérifie ta connexion'); okBtn.disabled = false; return; }
    }
    try{
      if(activeSession) await completeSessionFor(activeSession, edited ? v*60 : null);
    }catch(e){ console.error(e); toast('Erreur, réessaie'); okBtn.disabled = false; return; }
    ov.remove();
    clearActive();
    clearInterval(sessTick); sessTick = null; restEnd = 0;
    showSessionSummary(programId, 'SÉANCE TERMINÉE', finalMs, Object.keys(sessDone).length, Object.values(sessDone).reduce((x,y)=>x+y, 0), activeSession);
  };
}
function showSessionSummary(programId, eyebrow, durationMs, nSets, vol, sessionId){
  const body = document.getElementById('sessBody');
  if(!body){ location.hash = `#programme/${programId}`; return; }
  body.innerHTML = `
    <div class="eyebrow">${eyebrow}${activeDayLabel ? ' · ' + escHtml(activeDayLabel).toUpperCase() : ''}</div>
    <h1 class="page" style="font-size:32px;">Bravo 💪</h1>
    <div class="sess-summary">
      ${durationMs ? `<div class="end-pop"><b>${fmtClock(durationMs)}</b><span>Durée de la séance</span></div>` : ''}
      <div class="end-pop" style="animation-delay:.1s"><b data-count="${nSets}">0</b><span>${nSets>1?'Séries':'Série'} ${eyebrow.indexOf('TERMIN')>=0 ? (nSets>1?'validées':'validée') : (nSets>1?'enregistrées':'enregistrée')}</span></div>
      ${vol ? `<div class="end-pop" style="animation-delay:.2s"><b data-count="${Math.round(vol)}" data-suffix=" kg">0 kg</b><span>Poids total soulevé</span></div>` : ''}
    </div>
    <div id="badgeBox"></div>
    <button class="btn btn-accent" style="width:100%;justify-content:center;" onclick="location.hash='#programme/${programId}'">Retour au programme</button>
  `;
  window.scrollTo(0,0);
  window.__hsEndStats = { nSets, vol, minutes: durationMs ? Math.max(1, Math.round(durationMs / 60000)) : 0 };
  if(typeof HSBadges !== 'undefined' && HSBadges.animateEnd) HSBadges.animateEnd(body);
  showNewBadges(sessionId);
}
// Badges débloqués grâce à la séance qui vient de se terminer (comptes connectés uniquement)
async function showNewBadges(sessionId){
  if(!sessionId || !isLoggedIn() || typeof HSBadges === 'undefined') return;
  try{
    const getJson = async path => { const r = await authedFetch(path); if(!r.ok) throw new Error('load_failed'); return r.json(); };
    const data = await HSBadges.load(getJson, getUserSession().user.id);
    const { after, before, fresh, levelUp } = HSBadges.newlyUnlocked(data, sessionId);
    HSBadges.levelUpSeen(getUserSession().user.id, after.level);
    const box = document.getElementById('badgeBox');
    if(box){ box.innerHTML = HSBadges.renderEnd(fresh, after, before, levelUp) + '<div style="height:14px"></div>'; HSBadges.animateEnd(box); }
    try{ if(typeof HSRang !== 'undefined' && box){ const rk = await HSRang.rankUp(getJson, getUserSession().user.id, sessionId); if(rk) box.insertAdjacentHTML('afterbegin', rk); } }catch(e2){ console.error(e2); }
  }catch(e){ console.error(e); }
}
// Saisie d'une séance passée : date + durée + séries renseignées
async function saveManualSession(programId){
  const btn = document.getElementById('manSaveBtn');
  const entries = [...document.querySelectorAll('#sessBody .set-line')].map(l=>({
    exId: l.dataset.ex, setNum: parseInt(l.dataset.set),
    reps: parseInt(l.querySelector('.reps-input').value) || null,
    charge: parseFloat(l.querySelector('.charge-input').value) || null,
    sec: l.dataset.timed === '1' ? Math.min(86400, (parseInt(l.querySelector('.min-input').value) || 0) * 60 + (parseInt(l.querySelector('.sec-input').value) || 0)) || null : null,
    dist: (l.querySelector('.dist-input') && parseFloat(l.querySelector('.dist-input').value)) ? Math.min(500, Math.round(parseFloat(l.querySelector('.dist-input').value) * 100) / 100) : null
  })).filter(e=> e.reps || e.charge || e.sec);
  if(!entries.length){ toast('Renseigne au moins une série'); return; }
  const dateVal = document.getElementById('manDate').value;
  if(!dateVal){ toast('Choisis la date de la séance'); return; }
  const minutes = parseFloat(document.getElementById('manMin').value);
  const durSec = minutes > 0 ? Math.min(Math.round(minutes*60), 86400) : 0;
  const [y,m,d] = dateVal.split('-').map(Number);
  const now = new Date();
  const isToday = y === now.getFullYear() && m-1 === now.getMonth() && d === now.getDate();
  let startDt = isToday ? new Date(Date.now() - durSec*1000) : new Date(y, m-1, d, 12, 0, 0);
  if(startDt > now) startDt = now;
  btn.disabled = true;
  let sid;
  try{
    sid = await addPastSessionFor(programId, activeDayLabel, startDt.toISOString(), durSec);
    const results = await Promise.all(entries.map(e=> logSetFor(sid, e.exId, e.setNum, e.reps, e.charge, e.sec, e.dist)));
    if(results.some(r=> r && r.ok === false)) throw new Error('log_failed');
    await completeSessionFor(sid, durSec);
  }catch(e){ console.error(e); toast('Erreur, réessaie'); btn.disabled = false; return; }
  const vol = entries.reduce((a,e)=> a + ((e.reps && e.charge) ? e.reps*e.charge : 0), 0);
  showSessionSummary(programId, 'SÉANCE ENREGISTRÉE', durSec*1000, entries.length, vol, sid);
}

// Durée saisie en minutes et/ou secondes -> « 45s », « 2 min » ou « 1 min 30s » (30s par défaut)
function fmtTimeReps(min, sec, min2, sec2){
  const tot = (m, s) => (Math.max(0, parseInt(m) || 0) * 60) + Math.max(0, parseInt(s) || 0);
  const one = t => { const m = Math.floor(t / 60), s = t % 60; return m ? (s ? `${m} min ${s}s` : `${m} min`) : `${s}s`; };
  let a = tot(min, sec), b = tot(min2, sec2);
  if(!a && !b) return '30s';
  if(!a) a = b;
  if(b > a){
    if(a % 60 === 0 && b % 60 === 0) return `${a/60}-${b/60} min`;
    if(a < 60 && b < 60) return `${a}-${b}s`;
    return `${one(a)} à ${one(b)}`;
  }
  return one(a);
}
// Reps exactes (« 10 ») ou fourchette (« 8-10 »)
function fmtRepsRange(a, b){
  const x = parseInt(a), y = parseInt(b);
  if(!(x > 0) && !(y > 0)) return '10-12';
  if(!(x > 0)) return String(y);
  return y > x ? `${x}-${y}` : String(x);
}
function addDraftExercise(){
  const exId = selectedPickExId;
  if(!exId){ toast('Choisis un exercice dans la liste'); return; }
  const sets = document.getElementById('pSets').value || 3;
  const v = i => document.getElementById(i).value;
  const reps = pickRepsMode==='time' ? fmtTimeReps(v('pMin'), v('pSec'), v('pMin2'), v('pSec2')) : fmtRepsRange(v('pReps'), v('pRepsMax'));
  const ex = exercisesById[exId];
  draftExercises.push({ exercise_id: exId, sets: parseInt(sets), reps, name: ex.name, day: draftDays[activeDayIdx], linkPrev: false, variant_id: null });
  renderDraftList();
}
function renderDayTabs(){
  const box = document.getElementById('dayTabs');
  if(!box) return;
  box.innerHTML = draftDays.map((d,i)=>{
    const n = draftExercises.filter(x=>x.day===d).length;
    return `<button type="button" class="day-chip ${i===activeDayIdx?'active':''}" onclick="selectDay(${i})">${escHtml(d)} (${n})</button>`;
  }).join('') + `<button type="button" class="day-chip add" onclick="addDay()">+ Séance</button>`;
}
function selectDay(i){ activeDayIdx = i; renderDraftList(); }
function addDay(){
  let n = draftDays.length + 1, name = `Séance ${n}`;
  while(draftDays.includes(name)){ n++; name = `Séance ${n}`; }
  draftDays.push(name);
  activeDayIdx = draftDays.length - 1;
  renderDraftList();
}
function renameDay(){
  const old = draftDays[activeDayIdx];
  const val = prompt('Nom de la séance :', old);
  if(val === null) return;
  const name = val.trim();
  if(!name){ toast('Le nom ne peut pas être vide'); return; }
  if(name !== old && draftDays.includes(name)){ toast('Une séance porte déjà ce nom'); return; }
  draftExercises.forEach(x=>{ if(x.day===old) x.day = name; });
  draftDays[activeDayIdx] = name;
  renderDraftList();
}
function deleteDay(){
  if(draftDays.length <= 1){ toast('Un programme doit avoir au moins une séance'); return; }
  const name = draftDays[activeDayIdx];
  const n = draftExercises.filter(x=>x.day===name).length;
  if(!confirm(n ? `Supprimer « ${name} » et ses ${n} exercice${n>1?'s':''} ?` : `Supprimer « ${name} » ?`)) return;
  draftExercises = draftExercises.filter(x=>x.day!==name);
  draftDays.splice(activeDayIdx,1);
  activeDayIdx = Math.max(0, activeDayIdx-1);
  renderDraftList();
}
function renderDraftList(){
  renderDayTabs();
  const day = draftDays[activeDayIdx];
  const title = document.getElementById('dayExTitle');
  if(title) title.textContent = draftDays.length > 1 ? `Exercices de « ${day} »` : 'Exercices';
  const rows = draftExercises.map((d,i)=>({d,i})).filter(x=>x.d.day===day);
  // étiquettes de superset (A1, A2, B1…) d'après les liens "avec l'exercice du dessus"
  const tags = []; let letter = -1, pos = 0;
  rows.forEach(({d},idx)=>{
    const next = rows[idx+1];
    const inChain = (idx > 0 && d.linkPrev) || (next && next.d.linkPrev);
    if(!inChain){ tags.push(null); return; }
    if(idx > 0 && d.linkPrev){ pos++; } else { letter++; pos = 1; }
    tags.push(String.fromCharCode(65+letter) + pos);
  });
  document.getElementById('draftList').innerHTML = rows.length ? rows.map(({d,i},idx)=>{
    const vex = d.variant_id ? exercisesById[d.variant_id] : null;
    const canLink = idx > 0;
    return `<div class="draft-row ${tags[idx]?'in-ss':''}">
      <div class="draft-main">
        ${tags[idx]?`<span class="ss-chip">SUPERSET ${tags[idx]}</span> `:''}${escHtml(d.name)} — ${d.sets}×${escHtml(d.reps)}
        ${vex?`<div class="draft-var">↔ Variante : ${escHtml(vex.name)} <button type="button" class="rm-var" title="Retirer la variante" onclick="clearVariant(${i})">✕</button></div>`:''}
      </div>
      <div class="draft-actions">
        <button type="button" class="mini-btn" title="Monter" onclick="moveDraft(${i},-1)">↑</button>
        <button type="button" class="mini-btn" title="Descendre" onclick="moveDraft(${i},1)">↓</button>
        <button type="button" class="mini-btn ${d.linkPrev?'on':''}" ${canLink?'':'disabled'} title="Enchaîner avec l'exercice du dessus (superset)" onclick="toggleLink(${i})">🔗</button>
        <button type="button" class="mini-btn" title="Variante : utilise l'exercice sélectionné dans la grille" onclick="setVariant(${i})">↔</button>
        <button type="button" class="rm" onclick="removeDraft(${i})">✕</button>
      </div>
    </div>`;
  }).join('') + `<p class="subtitle" style="margin-top:10px;font-size:12px;">🔗 enchaîne avec l'exercice du dessus (superset) · ↔ ajoute comme variante l'exercice sélectionné dans la grille</p>` : '<div class="empty" style="padding:14px 0;">Aucun exercice dans cette séance pour l\'instant.</div>';
}
function removeDraft(i){
  // Si on retire la tête d'un superset, l'exercice suivant du superset devient la nouvelle tête
  // (sinon il se retrouverait enchaîné à l'exercice qui précède le superset).
  const j = sameDayNeighbor(i, 1);
  if(!draftExercises[i].linkPrev && j >= 0 && draftExercises[j].linkPrev) draftExercises[j].linkPrev = false;
  draftExercises.splice(i,1); renderDraftList();
}
function sameDayNeighbor(i, dir){
  let j = i + dir;
  while(j >= 0 && j < draftExercises.length && draftExercises[j].day !== draftExercises[i].day) j += dir;
  return (j < 0 || j >= draftExercises.length) ? -1 : j;
}
function moveDraft(i, dir){
  const j = sameDayNeighbor(i, dir);
  if(j < 0) return;
  const tmp = draftExercises[i]; draftExercises[i] = draftExercises[j]; draftExercises[j] = tmp;
  draftExercises[i].linkPrev = false; draftExercises[j].linkPrev = false; // à relier ensuite si besoin
  renderDraftList();
}
function toggleLink(i){
  if(sameDayNeighbor(i, -1) < 0){ toast('Il faut un exercice au-dessus pour créer un superset'); return; }
  draftExercises[i].linkPrev = !draftExercises[i].linkPrev;
  renderDraftList();
}
function setVariant(i){
  const exId = selectedPickExId;
  if(!exId){ toast('Choisis d\'abord l\'exercice variante dans la grille'); return; }
  if(exId === draftExercises[i].exercise_id){ toast('La variante doit être un autre exercice'); return; }
  draftExercises[i].variant_id = exId;
  renderDraftList();
}
function clearVariant(i){ draftExercises[i].variant_id = null; renderDraftList(); }
// Liste à plat dans l'ordre des séances. Une seule séance => pas de label (comme avant).
// Les exercices reliés ("avec l'exercice du dessus") reçoivent le même numéro de superset.
function orderedDraft(){
  const single = draftDays.length === 1;
  const out = []; let gid = 0;
  draftDays.forEach(day=>{
    draftExercises.filter(x=>x.day===day).forEach((x,idx,arr)=>{
      const item = { ...x, day_label: single ? null : day, superset_group: null };
      if(idx > 0 && x.linkPrev){
        const prev = out[out.length-1];
        if(prev.superset_group == null){ gid++; prev.superset_group = gid; }
        item.superset_group = prev.superset_group;
      }
      out.push(item);
    });
  });
  return out;
}
async function saveProgram(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ toast('Donne un nom à ton programme'); return; }
  if(!draftExercises.length){ toast('Ajoute au moins un exercice'); return; }
  const emptyDay = draftDays.find(d=> !draftExercises.some(x=>x.day===d));
  if(emptyDay){ toast(`« ${emptyDay} » est vide : ajoute-y un exercice ou supprime-la`); return; }
  const desc = document.getElementById('pDesc').value.trim();
  const btn = document.getElementById('saveProgramBtn');
  const wasEditing = !!editingProgramId;
  const draft = orderedDraft();
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  try{
    let programId;
    if(wasEditing){
      programId = editingProgramId;
      await updateProgramFor(programId, name, desc||null);
      await saveProgramExercises(programId, draft);
    } else {
      programId = await createProgramFor(name, desc||null);
      for(let i=0;i<draft.length;i++){
        const d = draft[i];
        await addProgramExerciseFor(programId, d.exercise_id, i+1, d.sets, d.reps, d.rest || 90, null, d.day_label, d.superset_group, d.variant_id, d.custom_name);
      }
    }
    toast(wasEditing ? 'Programme mis à jour !' : 'Programme créé !');
    editingProgramId = null;
    location.hash = `#programme/${programId}`;
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = wasEditing ? 'Enregistrer les modifications' : 'Enregistrer le programme';
    toast('Erreur, impossible d\'enregistrer. Réessaie.');
  }
}
async function updateProgramFor(programId, name, desc){
  if(isLoggedIn()){
    const res = await authedFetch(`/rest/v1/programs?id=eq.${programId}`, { method:'PATCH', body: JSON.stringify({ name, description: desc }) });
    if(!res.ok){ console.error(await res.text()); throw new Error('update_program_failed'); }
    return;
  }
  return rpc('guest_update_program', { p_token: TOKEN, p_program_id: programId, p_name: name, p_description: desc });
}
async function saveProgramExercises(programId, draft){
  if(isLoggedIn()){
    const res = await authedFetch(`/rest/v1/program_exercises?program_id=eq.${programId}`, { method:'DELETE' });
    if(!res.ok){ console.error(await res.text()); throw new Error('clear_program_exercises_failed'); }
    for(let i=0;i<draft.length;i++){
      const d = draft[i];
      await addProgramExerciseFor(programId, d.exercise_id, i+1, d.sets, d.reps, d.rest || 90, null, d.day_label, d.superset_group, d.variant_id, d.custom_name);
    }
    return;
  }
  // Invité : pas de suppression en masse côté serveur, on réutilise les lignes existantes
  // en les mettant à jour en place, et on "désactive" celles en trop (sets=0) plutôt que de les supprimer.
  const existing = (await rpc('guest_program_exercises', { p_token: TOKEN, p_program_id: programId }))
    .sort((a,b)=> (a.order_index||0)-(b.order_index||0));
  const n = Math.min(existing.length, draft.length);
  for(let i=0;i<n;i++){
    const d = draft[i];
    await rpc('guest_update_program_exercise_ext', { p_token: TOKEN, p_id: existing[i].id, p_exercise_id: d.exercise_id, p_order_index: i+1, p_sets: d.sets, p_reps: d.reps, p_rest_seconds: existing[i].rest_seconds||90, p_day_label: d.day_label||null, p_superset_group: d.superset_group||null, p_variant_id: d.variant_id||null });
  }
  if(draft.length > existing.length){
    for(let i=existing.length;i<draft.length;i++){
      const d = draft[i];
      await addProgramExerciseFor(programId, d.exercise_id, i+1, d.sets, d.reps, d.rest || 90, null, d.day_label, d.superset_group, d.variant_id, d.custom_name);
    }
  } else if(existing.length > draft.length){
    for(let i=draft.length;i<existing.length;i++){
      await rpc('guest_update_program_exercise_ext', { p_token: TOKEN, p_id: existing[i].id, p_exercise_id: existing[i].exercise_id, p_order_index: 9999, p_sets: 0, p_reps: null, p_rest_seconds: existing[i].rest_seconds||90, p_day_label: existing[i].day_label||null, p_superset_group: null, p_variant_id: null });
    }
  }
}

document.getElementById('exOverlay').addEventListener('click', e=>{ if(e.target.id==='exOverlay') e.target.classList.remove('open'); });
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') e.target.classList.remove('open'); });

function trackVisit(){
  try{
    let vid = localStorage.getItem('hs_visitor_id');
    if(!vid){ vid = crypto.randomUUID(); localStorage.setItem('hs_visitor_id', vid); }
    let uid = null;
    try{ const s = JSON.parse(localStorage.getItem('hs_session')||'null'); if(s && s.user && s.user.id) uid = s.user.id; }catch(e){}
    fetch(`${SUPABASE_URL}/rest/v1/rpc/track_visit`, {
      method:'POST',
      headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_token: vid, p_user_id: uid })
    }).catch(()=>{});
  }catch(e){}
}
trackVisit();

boot();
checkClientNotifications();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(function(){
  const KEY = 'hs_install_dismissed_v1';
  try{ const t = +localStorage.getItem(KEY); if(t && Date.now() - t < 14*864e5) return; }catch(e){}
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;

  function showBanner(html, onInstall){
    const bar = document.createElement('div');
    bar.className = 'install-banner show';
    bar.innerHTML = html;
    document.body.appendChild(bar);
    document.body.classList.add('has-install-banner');
    const closeBtn = bar.querySelector('.installClose');
    if (closeBtn) closeBtn.addEventListener('click', ()=>{ localStorage.setItem(KEY, String(Date.now())); bar.remove(); document.body.classList.remove('has-install-banner'); });
    const installBtn = bar.querySelector('.installGo');
    if (installBtn && onInstall) installBtn.addEventListener('click', onInstall);
    setTimeout(()=>{ if(!bar.isConnected) return; try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} bar.style.transition='opacity .4s'; bar.style.opacity='0'; setTimeout(()=>{ bar.remove(); document.body.classList.remove('has-install-banner'); }, 400); }, 7000);
  }

  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (isIos) {
    const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
    if (isSafari) {
      showBanner(`
        <p>Installe cette app sur ton écran d'accueil : appuie sur <strong>Partager</strong> puis <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);    } else {
      showBanner(`
        <p>Pour installer l'app sur iPhone, ouvre ce site dans <strong>Safari</strong>, puis <strong>Partager</strong> › <strong>« Sur l'écran d'accueil »</strong>.</p>
        <div class="btn-row"><button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button></div>
      `);
    }
  } else {
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      deferredPrompt = e;
      showBanner(`
        <p>Installe HS Coaching sur ton appareil pour un accès rapide depuis ton écran d'accueil.</p>
        <div class="btn-row">
          <button class="installGo" style="background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;">Installer</button>
          <button class="installClose" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;">✕</button>
        </div>
      `, async ()=>{
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        localStorage.setItem(KEY, String(Date.now()));
        const el = document.querySelector('.install-banner'); if (el) el.remove();
        document.body.classList.remove('has-install-banner');
      });
    });
  }
})();
